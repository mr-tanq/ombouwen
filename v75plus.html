<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pally · Ombouwen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --black:       #000000;
      --surface-1:   rgba(255,255,255,.03);
      --surface-2:   rgba(255,255,255,.055);
      --surface-3:   rgba(255,255,255,.08);
      --border:      rgba(255,255,255,.07);
      --border-2:    rgba(255,255,255,.12);
      --border-3:    rgba(255,255,255,.18);
      --amber:       #f59e0b;
      --amber-dim:   rgba(245,158,11,.15);
      --amber-glow:  rgba(245,158,11,.3);
      --blue:        #3b82f6;
      --blue-dim:    rgba(59,130,246,.15);
      --blue-glow:   rgba(59,130,246,.3);
      --green:       #22c55e;
      --green-dim:   rgba(34,197,94,.15);
      --green-glow:  rgba(34,197,94,.35);
      --red:         #ef4444;
      --red-dim:     rgba(239,68,68,.15);
      --red-glow:    rgba(239,68,68,.3);
      --slate:       #64748b;
      --text:        #ffffff;
      --text-2:      #94a3b8;
      --text-3:      #475569;
      --mono:        'Geist Mono', monospace;
      --sans:        'Geist', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--black); color: var(--text);
      font-family: var(--sans); font-size: 14px; line-height: 1.5;
      min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    img { max-width: 100%; display: block; }

    .shell { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; position: relative; z-index: 1; }

    .topbar {
      height: 56px; border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,.9); backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; position: sticky; top: 0; z-index: 200;
    }
    .topbar-brand { display: flex; align-items: center; gap: 14px; }
    .topbar-logo {
      width: 30px; height: 30px; border: 1px solid var(--border-2); border-radius: 6px;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: var(--surface-2); flex-shrink: 0;
    }
    .topbar-name { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text); letter-spacing: .14em; text-transform: uppercase; }
    .topbar-sep  { width: 1px; height: 18px; background: var(--border-2); }
    .topbar-module { font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: .18em; text-transform: uppercase; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .sync-indicator {
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .06em; padding: 5px 11px; border-radius: 20px;
      border: 1px solid #47556940; color: #475569;
      transition: all .25s ease; white-space: nowrap; cursor: pointer;
    }
    .sync-indicator:hover { filter: brightness(1.3); }
    .role-badge {
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      padding: 6px 12px; border-radius: 20px; border: 1px solid;
      display: inline-flex; align-items: center; gap: 6px;
      cursor: pointer; transition: all .15s ease;
    }
    .role-badge.operator { color: var(--text-2); border-color: var(--border-2); background: var(--surface-1); }
    .role-badge.operator:hover { color: var(--text); background: var(--surface-2); }
    .role-badge.admin { color: var(--amber); border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.08); }
    .role-badge.admin:hover { background: rgba(245,158,11,.14); }

    /* ── LOGIN OVERLAY ── */
    .login-overlay {
      position: fixed; inset: 0; z-index: 600;
      background: rgba(0,0,0,.8); backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      animation: fadeUp .2s ease;
    }
    .login-box {
      background: #0d0d0d; border: 1px solid var(--border-2); border-radius: 16px;
      padding: 32px; max-width: 380px; width: 90%;
      display: flex; flex-direction: column; gap: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.8);
    }
    .login-title { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -.03em; }
    .login-sub   { font-size: 12px; color: var(--text-2); margin-top: -10px; }
    .login-input {
      width: 100%; padding: 14px 16px; border-radius: 9px;
      border: 1px solid var(--border-2); background: rgba(255,255,255,.03);
      color: var(--text); font-family: var(--mono); font-size: 16px; font-weight: 600;
      outline: none; letter-spacing: .04em;
    }
    .login-input:focus { border-color: rgba(245,158,11,.4); box-shadow: 0 0 0 3px rgba(245,158,11,.08); }
    .login-error { font-family: var(--mono); font-size: 11px; color: var(--red); padding: 6px 10px; border-radius: 6px; background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); }
    .login-actions { display: flex; gap: 8px; }
    .btn-login { flex: 1; font-size: 13px; font-weight: 700; padding: 11px 18px; border-radius: 9px; background: var(--amber); color: #000; border: none; transition: all .15s ease; }
    .btn-login:hover { background: #fbbf24; box-shadow: 0 0 22px var(--amber-glow); }
    .btn-login-cancel { font-size: 13px; font-weight: 500; padding: 11px 18px; border-radius: 9px; border: 1px solid var(--border-2); background: transparent; color: var(--text-2); transition: all .14s ease; }
    .btn-login-cancel:hover { background: var(--surface-2); color: var(--text); }

    .body { display: grid; grid-template-columns: 260px 1fr; }

    .sidebar {
      border-right: 1px solid var(--border); background: rgba(0,0,0,.6);
      display: flex; flex-direction: column; padding: 28px 0;
      min-height: calc(100vh - 56px);
      position: sticky; top: 56px; align-self: start;
      max-height: calc(100vh - 56px); overflow-y: auto;
    }
    .sidebar::-webkit-scrollbar { width: 2px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 1px; }
    .sidebar-section { padding: 0 18px 22px; }
    .sidebar-label {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: .22em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px;
    }
    .flow-card { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); overflow: hidden; }
    .flow-card-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; }
    .flow-block { padding: 11px 13px; }
    .flow-block + .flow-block { border-left: 1px solid var(--border); }
    .flow-block-label { font-family: var(--mono); font-size: 10px; color: var(--text-3); letter-spacing: .16em; text-transform: uppercase; margin-bottom: 4px; }
    .flow-block-value { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flow-block-value.dim   { color: var(--text-3); font-weight: 400; }
    .flow-block-value.amber { color: var(--amber); }
    .flow-arrow-col { display: flex; align-items: center; justify-content: center; padding: 0 9px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--surface-1); font-family: var(--mono); font-size: 11px; color: var(--text-3); }
    .section-tag { margin-top: 7px; display: flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: .06em; }
    .tag-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 6px var(--amber-glow); flex-shrink: 0; }
    .sidebar-sep { height: 1px; background: var(--border); margin: 0 18px 22px; }
    .step-list { display: flex; flex-direction: column; gap: 3px; padding: 0 18px; }
    .step-item {
      display: flex; align-items: center; gap: 11px; padding: 10px 11px;
      border-radius: 8px; cursor: default; border: 1px solid transparent; transition: all .18s ease;
    }
    .step-item.done        { background: rgba(34,197,94,.05);  border-color: rgba(34,197,94,.1); }
    .step-item.active      { background: rgba(245,158,11,.05); border-color: rgba(245,158,11,.12); }
    .step-item.check-active{ background: rgba(6,182,212,.05);  border-color: rgba(6,182,212,.15); }
    .step-num {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      width: 22px; height: 22px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      border: 1px solid var(--border-2); color: var(--text-3); background: var(--surface-1); transition: all .18s ease;
    }
    .step-item.done        .step-num { background: rgba(34,197,94,.15);  border-color: rgba(34,197,94,.3);   color: var(--green); }
    .step-item.active      .step-num { background: rgba(245,158,11,.1);  border-color: rgba(245,158,11,.25); color: var(--amber); }
    .step-item.check-active .step-num{ background: rgba(6,182,212,.1);   border-color: rgba(6,182,212,.28);  color: #06b6d4; box-shadow: 0 0 8px rgba(6,182,212,.2); }
    .step-text { font-size: 13px; color: var(--text-3); font-weight: 500; }
    .step-item.done        .step-text { color: rgba(34,197,94,.75); }
    .step-item.active      .step-text { color: var(--text); }
    .step-item.check-active .step-text{ color: rgba(6,182,212,.9); }

    .main { display: flex; flex-direction: column; min-width: 0; }
    .breadcrumb {
      border-bottom: 1px solid var(--border); padding: 0 32px; height: 38px;
      display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.4);
    }
    .bc-item { font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: .06em; }
    .bc-item.active { color: rgba(255,255,255,.6); }
    .bc-sep { font-family: var(--mono); font-size: 11px; color: var(--text-3); opacity: .4; }

    /* ── MOBILE FLOW BAR (samenvatting Van → Naar als sidebar verborgen is) ── */
    .mobile-flowbar {
      display: none; font-family: var(--mono); font-size: 12px; color: var(--text-2);
      padding: 9px 14px; border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.02); letter-spacing: .03em;
      gap: 7px; align-items: center; flex-wrap: wrap;
    }
    .mobile-flowbar b { color: var(--amber); font-weight: 700; }
    .mobile-flowbar .mf-sep { color: var(--text-3); }

    .content { flex: 1; padding: 36px 36px 56px; animation: fadeUp .22s cubic-bezier(.16,1,.3,1) both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .content-header { margin-bottom: 28px; }
    .content-title  { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -.04em; margin-bottom: 5px; line-height: 1.15; }
    .content-sub    { font-size: 13px; color: var(--text-2); line-height: 1.6; max-width: 480px; }

    .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    .panel {
      border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1);
      overflow: hidden; position: relative; backdrop-filter: blur(10px); transition: border-color .18s;
    }
    .panel::before { content:''; position:absolute; inset:0; border-radius:12px; background: linear-gradient(135deg,rgba(255,255,255,.02) 0%,transparent 60%); pointer-events:none; }
    .panel:hover { border-color: var(--border-2); }
    .panel-header { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.015); }
    .panel-title { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.4); }
    .panel-badge { margin-left: auto; display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.2); color: var(--green); letter-spacing: .1em; }
    .panel-badge::before { content:''; width:4px; height:4px; border-radius:50%; background: var(--green); display:inline-block; flex-shrink:0; }
    .panel-body { padding: 18px; }
    .field-label { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; margin-top: 16px; }
    .field-label:first-child { margin-top: 0; }

    .chip-row, .chipRow { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      font-size: 13px; font-weight: 500; padding: 9px 14px; border-radius: 7px;
      border: 1px solid var(--border-2); background: var(--surface-1); color: var(--text-2);
      display: inline-flex; align-items: center; gap: 8px;
      transition: all .14s cubic-bezier(.16,1,.3,1); position: relative; overflow: hidden;
    }
    .chip:hover { background: var(--surface-3); color: var(--text); border-color: var(--border-3); transform: translateY(-1px); }
    .chip.active { background: rgba(245,158,11,.09); border-color: rgba(245,158,11,.28); color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,.07); }
    .chipInner { display: inline-flex; align-items: center; gap: 8px; }

    .actions-bar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding-top: 22px; border-top: 1px solid var(--border); }
    .btn-ghost { font-size: 13px; font-weight: 500; padding: 9px 17px; border-radius: 8px; border: 1px solid var(--border-2); background: transparent; color: var(--text-2); transition: all .14s ease; }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-3); }
    .btn-ghost:disabled { opacity: .25; cursor: not-allowed; }
    .btn-primary { font-size: 13px; font-weight: 700; padding: 9px 20px; border-radius: 8px; color: #000; background: var(--amber); border: none; transition: all .16s cubic-bezier(.16,1,.3,1); }
    .btn-primary:hover:not(:disabled) { background: #fbbf24; box-shadow: 0 0 22px var(--amber-glow); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .18; cursor: not-allowed; }

    .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .section-card {
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface-1);
      padding: 18px 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
      transition: all .18s cubic-bezier(.16,1,.3,1);
      position: relative;
      overflow: hidden;
    }
    .section-card::before { content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(255,255,255,.015) 0%,transparent 60%); pointer-events:none; }
    .section-card:hover { border-color: var(--border-3); background: var(--surface-2); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    .section-card-title { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
    .section-card-desc { font-size: 12px; color: var(--text-3); line-height: 1.4; }
    .section-card-footer { width: 100%; display: flex; align-items: center; justify-content: flex-end; padding-top: 8px; border-top: 1px solid var(--border); margin-top: auto; }
    .section-header-logo { height: 32px; width: auto; object-fit: contain; opacity: .9; filter: brightness(1.15); }
    .section-card-arrow { font-size: 14px; color: var(--text-3); transition: color .14s, transform .14s; }

    /* Logo + SVG fallback: fallback is verborgen tot het logo faalt */
    .section-card-logo-wrap { width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .section-card-logo { max-width: 100%; max-height: 100%; object-fit: contain; }
    .section-card-logo-fallback { display: none; width: 40px; height: 40px; border: 1px solid var(--border-2); border-radius: 9px; background: var(--surface-2); align-items: center; justify-content: center; }
    .section-card-logo-fallback svg { width: 18px; height: 18px; stroke: rgba(255,255,255,.4); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .section-card-logo-wrap.logo-failed .section-card-logo { display: none; }
    .section-card-logo-wrap.logo-failed .section-card-logo-fallback { display: flex; }

    .toggle-row { display: flex; gap: 6px; margin-bottom: 20px; }
    .toggleBtn { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--border-2); background: var(--surface-1); color: var(--text-3); letter-spacing: .1em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 7px; transition: all .14s ease; }
    .toggleBtn:hover { color: var(--text-2); background: var(--surface-2); }
    .toggleBtn.active { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.22); color: var(--amber); }
    .lineToggle { display: inline-flex; align-items: center; gap: 7px; }

    .view-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 14px; flex-wrap: wrap; }
    .view-header-left  { display: flex; align-items: center; gap: 13px; }
    .view-header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn-back { width: 36px; height: 36px; border-radius: 7px; border: 1px solid var(--border-2); background: var(--surface-1); color: rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all .14s ease; flex-shrink: 0; }
    .btn-back:hover { background: var(--surface-3); color: var(--text); }
    .view-title { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -.03em; }
    .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 20px; border: 1px solid var(--border-2); background: var(--surface-1); font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--text-2); letter-spacing: .02em; }

    .mode-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
    .view-actions { display: flex; gap: 5px; flex-wrap: wrap; }
    .view-action-btn { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 9px 14px; border-radius: 7px; border: 1px solid var(--border-2); background: var(--surface-1); color: var(--text-3); display: inline-flex; align-items: center; gap: 7px; transition: all .14s ease; letter-spacing: .08em; text-transform: uppercase; }
    .view-action-btn:hover { background: var(--surface-3); color: var(--text); }
    .view-action-btn.active { background: rgba(59,130,246,.08); border-color: rgba(59,130,246,.22); color: var(--blue); }
    .view-action-btn.check-btn.active { background: rgba(34,197,94,.08); border-color: rgba(34,197,94,.22); color: var(--green); }
    .mode-pills { display: flex; gap: 3px; }
    .mode-btn { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-3); transition: all .12s ease; }
    .mode-btn:hover { color: var(--text-2); }
    .mode-btn.active { background: var(--surface-2); border-color: var(--border-2); color: var(--text); }

    .value-table { border: 1px solid var(--border); border-radius: 11px; overflow: hidden; background: var(--surface-1); }
    .value-table-header { display: grid; grid-template-columns: minmax(160px,2fr) 130px 24px 130px; padding: 9px 18px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.02); }
    .value-table-col { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); }
    .value-table-col.center { text-align: center; }
    .value-rows { display: flex; flex-direction: column; }
    .value-row { display: grid; grid-template-columns: minmax(160px,2fr) 130px 24px 130px; padding: 11px 18px; border-bottom: 1px solid var(--border); align-items: center; gap: 8px; transition: background .11s ease; }
    .value-row:last-child { border-bottom: none; }
    .value-row:hover { background: rgba(255,255,255,.02); }
    .value-key { font-size: 13px; color: rgba(255,255,255,.7); display: flex; align-items: center; gap: 8px; min-width: 0; padding-right: 8px; }
    .value-key-text { white-space: normal; word-break: break-word; line-height: 1.4; }
    .param-num { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--amber); background: rgba(245,158,11,.07); border: 1px solid rgba(245,158,11,.2); border-radius: 4px; padding: 2px 6px; flex-shrink: 0; letter-spacing: .04em; align-self: flex-start; margin-top: 1px; }
    .value-cell { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--slate); }
    .value-cell.is-new { color: var(--blue); font-weight: 600; }
    .value-sep  { font-family: var(--mono); font-size: 11px; color: var(--text-3); text-align: center; opacity: .4; }

    /* ── STATUS-MODUS ── */
    .value-table-header.status-header,
    .value-row.status-row { grid-template-columns: minmax(160px,2fr) 1fr auto; }
    .status-check-btn {
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      padding: 7px 13px; border-radius: 7px;

    .restore-btn { font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 5px 10px; border-radius: 5px; border: 1px solid var(--border-2); background: var(--surface-1); color: var(--text-2); transition: all .14s ease; white-space: nowrap; }
    .restore-btn:hover { background: rgba(59,130,246,.12); border-color: rgba(59,130,246,.35); color: var(--blue); }

    .audit-list { display: flex; flex-direction: column; gap: 8px; }
    .audit-entry { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); padding: 14px 18px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; transition: border-color .14s; }
    .audit-entry:hover { border-color: var(--border-2); }

    .audit-icon.mismatch { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.2); }
    .audit-icon.saved    { background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.2); }
    .audit-icon.warn     { background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.2); }

    .empty-state { padding: 48px 32px; text-align: center; color: var(--text-3); font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .empty-state::before { content:''; display:block; width:32px; height:1px; background: var(--border-2); }

    /* ── TOASTS (zichtbare sync/foutmeldingen) ── */
    .pally-toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 9000;
      background: #111; border: 1px solid var(--border-3); color: var(--text);
      font-size: 13px; font-weight: 600; padding: 12px 18px; border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,.6); max-width: 92vw; text-align: center;
      animation: fadeUp .2s ease; transition: opacity .3s ease;
    }
    .pally-toast.ok   { border-color: rgba(34,197,94,.45); }
    .pally-toast.warn { border-color: rgba(245,158,11,.5); }
    .pally-toast.err  { border-color: rgba(239,68,68,.5); }
    .pally-toast.out  { opacity: 0; }

    /* ── TOEGANKELIJKHEID ── */
    :where(button, input, textarea, [tabindex]):focus-visible {
      outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 6px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    /* Touch targets: minimaal 44px op touch-apparaten */
    @media (pointer: coarse) {
      .mini-row, .check-mini-row { min-height: 44px; }
      .mode-btn, .view-action-btn, .toggleBtn, .tab-btn, .btn-ghost, .btn-primary, .chip,
      .btn-confirm-save, .btn-confirm-skip, .restore-btn, .role-badge { min-height: 44px; }
      .btn-back { width: 44px; height: 44px; }
      .version-card-header { min-height: 48px; }
    }

/* ── TABLET ── */
    @media (max-width: 900px) {
      .body { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .mobile-flowbar.show { display: flex; }
      .panel-grid { grid-template-columns: 1fr; gap: 12px; }
      .section-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .player-wrap, .check-wrap { grid-template-columns: 1fr; }
      .player-sidebar, .check-sidebar { display: none; }
      .value-table-header, .value-row { grid-template-columns: minmax(120px,2fr) 80px 20px 80px; }
      .value-table-header.status-header, .value-row.status-row { grid-template-columns: minmax(110px,1.6fr) 1fr auto; }
      .mode-choice-grid { grid-template-columns: 1fr; }
      .version-param-row { grid-template-columns: 1fr 80px 18px 80px auto; }
      .content { padding: 24px 16px 40px; }
      .topbar, .breadcrumb { padding: 0 14px; }
      .topbar { gap: 8px; }
      .topbar-brand { gap: 8px; min-width: 0; flex: 1; }
      .topbar-name { font-size: 11px; letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .topbar-sep, .topbar-module { display: none; }
      .topbar-right { gap: 6px; flex-shrink: 0; }
      .sync-indicator { padding: 4px 8px; font-size: 10px; }
      .role-badge { padding: 5px 9px; font-size: 10px; letter-spacing: .06em; }
    }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      .content { padding: 18px 12px 32px; }
      .content-title { font-size: 19px; }
      .content-sub { font-size: 12px; }
      .topbar, .breadcrumb { padding: 0 10px; }
      .panel-grid { grid-template-columns: 1fr; }
      .section-grid { grid-template-columns: 1fr; gap: 8px; }
      .section-card { padding: 14px 16px; flex-direction: row; align-items: center; gap: 14px; }
      .section-card-logo-wrap { width: 56px; height: 56px; }
      .section-card-title { font-size: 15px; }
      .section-card-desc { font-size: 12px; }
      .section-card > div:nth-child(2), .section-card > div:nth-child(3) { flex: 1; min-width: 0; }
      .section-card-footer { display: none; }
      .view-header { gap: 8px; }
      .view-header-right { width: 100%; gap: 6px; }
      .pill { font-size: 11px; padding: 4px 9px; }
      .actions-bar { flex-wrap: wrap; gap: 8px; }
      .check-header-right { width: 100%; }
      .check-values-grid { grid-template-columns: 1fr; }
      .check-arrow { display: none; }
      .check-param-name { font-size: 20px; }
      .check-val-box { font-size: 18px; padding: 14px 16px; }
      .preset-btn { min-width: 70px; font-size: 14px; padding: 14px 10px; }
      .player-body { padding: 22px 18px; }
      .player-label { font-size: 19px; }
      .player-val-box { font-size: 15px; padding: 12px 14px; }
      .player-values { flex-direction: column; gap: 12px; }
      .player-arrow-sep { display: none; }
      .check-summary-stats { gap: 6px; }
      .check-stat-pill { font-size: 10px; padding: 5px 10px; }
      .check-changes-row { grid-template-columns: minmax(90px,2fr) 70px 16px 70px 22px; padding: 10px 12px; gap: 6px; font-size: 11px; }
      .tab-btn { padding: 8px 11px; font-size: 10px; letter-spacing: .06em; }
      .login-box { padding: 24px 22px; }
      .check-confirm-box { padding: 24px 22px; }
    }

    .check-values-stacked { display: flex; flex-direction: column; gap: 14px; margin-bottom: 0; }
    .check-values-stacked .check-val-block { width: 100%; }

    .preset-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 0; }
    .preset-btn { flex: 1; min-width: 80px; padding: 16px 12px; border: 1px solid var(--border-2); background: var(--surface-2); border-radius: 8px; font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--text-2); cursor: pointer; transition: all .14s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-align: center; line-height: 1.3; }
    .preset-btn:hover { background: var(--surface-3); color: var(--text); border-color: var(--border-3); }
    .preset-btn.selected-match { background: rgba(34,197,94,.14); border-color: rgba(34,197,94,.5); color: var(--green); box-shadow: 0 0 0 2px rgba(34,197,94,.12); }
    .preset-btn.selected-miss { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.45); color: var(--red); box-shadow: 0 0 0 2px rgba(239,68,68,.1); }

    .seq-display { background: var(--black); border: 1px solid var(--border-2); border-radius: 8px; padding: 14px 16px; font-family: var(--mono); font-size: 13px; color: var(--text-2); letter-spacing: .06em; word-break: break-all; line-height: 1.8; margin-bottom: 10px; }
    .seq-confirm { display: flex; gap: 8px; }
    .seq-confirm .preset-btn { font-size: 13px; padding: 12px 10px; }

    /* ── PRINT (lijst op papier als backup) ── */
    @media print {
      html, body { background: #fff !important; color: #000 !important; }
      .topbar, .breadcrumb, .mobile-flowbar, .sidebar, .mode-bar, .toggle-row,
      .actions-bar, .view-header .btn-back, .view-action-btn, .pally-toast,
      #pally-error-box { display: none !important; }
      .body { display: block; }
      .content { padding: 0; animation: none; }
      .value-table, .value-row, .value-table-header { border-color: #bbb !important; background: #fff !important; }
      .value-key, .value-key-text, .value-cell, .view-title, .pill { color: #000 !important; }
      .value-cell.is-new { color: #1d4ed8 !important; }
      .param-num { color: #92400e !important; background: #fff !important; border-color: #d97706 !important; }
      .pill { border-color: #bbb !important; background: #fff !important; }
      .richText { color: #000 !important; }
    }
  </style>

<body>
<div id="pally-error-box" style="display:none;position:fixed;bottom:12px;left:12px;right:12px;z-index:9999;background:#1a0000;border:1px solid #ef4444;border-radius:8px;padding:10px 14px;font-family:monospace;font-size:12px;color:#ef4444;white-space:pre-wrap;max-height:140px;overflow:auto"
  onclick="this.style.display='none'"></div>

<div class="shell" id="app-shell"></div>
<script>
(function(){

  /* ═══════════════════════════════════════
     FOUT-OPPERVLAK — onzichtbare fouten worden nu getoond
  ═══════════════════════════════════════ */
  function showFatal(msg){
    try{
      var box = document.getElementById('pally-error-box');
      if(box){ box.textContent = '⚠ ' + msg + '  (tik om te sluiten)'; box.style.display = 'block'; }
    }catch(e){}
  }
  window.addEventListener('error', function(e){
    showFatal('Fout: ' + (e.message || e.type || 'onbekend'));
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    showFatal('Async fout: ' + ((r && r.message) || r || 'onbekend'));
  });

  /* ═══════════════════════════════════════
     SUPABASE CLOUD SYNC — met CDN-guard:
     als supabase-js niet laadt (firewall/CDN down) draait de
     app gewoon door in lokaal-only modus i.p.v. wit scherm.
  ═══════════════════════════════════════ */
  const SUPABASE_URL = 'https://ntccfqevzwayxplmxsqc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_98qpLnBWLaARnKYU6DHwlw_CbpkNinn';
  let sb = null;
  try {
    if(window.supabase && window.supabase.createClient){
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } else {
      console.warn('[pally] supabase-js niet geladen — lokaal-only modus');
    }
  } catch(err){
    console.warn('[pally] supabase init mislukt:', err && err.message);
    sb = null;
  }

  /* ═══════════════════════════════════════
     ROLE / AUTH
  ═══════════════════════════════════════ */
  /* AUTH — echte Supabase Auth (e-mail + wachtwoord).
     • Operators loggen NIET in → alleen-lezen (anoniem).
     • Technici/admins loggen in → mogen schrijven (RLS dwingt dit af).
     • Offline fallback: als supabase-js niet geladen is, valt het terug op
       een lokaal noodwachtwoord zodat het hulpmiddel niet onbruikbaar wordt
       als het CDN onbereikbaar is in de fabriek. */
  const FALLBACK_PASSWORD = 'admin';   // alleen gebruikt als cloud onbereikbaar is
  const auth = {
    role: 'operator',         // wordt 'admin' zodra er een sessie is
    email: '',
    showLogin: false,
    loginError: '',
    busy: false
  };
  function isAdmin(){ return auth.role === 'admin'; }

  async function refreshAuthFromSession(){
    if(!sb){ return; }
    try{
      const { data } = await sb.auth.getSession();
      if(data && data.session && data.session.user){
        auth.role = 'admin';
        auth.email = data.session.user.email || '';
      } else {
        auth.role = 'operator';
        auth.email = '';
      }
    }catch(e){ /* laat operator-rol staan */ }
  }

  async function doLogin(email, password){
    auth.busy = true; auth.loginError = ''; render();
    /* Offline noodscenario: geen supabase-js → lokaal wachtwoord */
    if(!sb){
      if(password === FALLBACK_PASSWORD){
        auth.role = 'admin'; auth.email = '(offline)'; auth.showLogin = false; auth.busy = false;
        showToast('Ingelogd (offline modus)', 'warn');
        render();
      } else {
        auth.busy = false; auth.loginError = 'Verkeerd wachtwoord (offline modus)'; render();
      }
      return;
    }
    try{
      const { data, error } = await sb.auth.signInWithPassword({ email: email, password: password });
      if(error) throw error;
      auth.role = 'admin';
      auth.email = (data && data.user && data.user.email) || email;
      auth.showLogin = false; auth.busy = false; auth.loginError = '';
      showToast('Ingelogd als ' + auth.email, 'ok');
      pullFromCloud(true).then(()=> render());
      render();
    }catch(err){
      auth.busy = false;
      auth.loginError = (err && err.message) === 'Invalid login credentials'
        ? 'Onjuiste e-mail of wachtwoord'
        : ('Login mislukt: ' + ((err && err.message) || 'onbekend'));
      render();
    }
  }

  async function doLogout(){
    if(sb){ try{ await sb.auth.signOut(); }catch(e){} }
    auth.role = 'operator'; auth.email = '';
    showToast('Uitgelogd — operator modus', 'ok');
    render();
  }

  /* ═══════════════════════════════════════
     TOASTS — zichtbare meldingen i.p.v. console.warn
  ═══════════════════════════════════════ */
  function showToast(msg, type){
    try{
      var t = document.createElement('div');
      t.className = 'pally-toast ' + (type || '');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function(){
        t.classList.add('out');
        setTimeout(function(){ t.remove(); }, 350);
      }, 3500);
    }catch(e){}
  }

  /* ═══════════════════════════════════════
     SYNC QUEUE — mislukte writes gaan in een wachtrij
     (localStorage) en worden automatisch opnieuw geprobeerd.
     Geen stille dataverliezen meer.
  ═══════════════════════════════════════ */
  const QUEUE_KEY = 'pally_sync_queue';
  function loadQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){ return []; } }
  function saveQueue(q){ try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){} }
  function enqueue(op){
    const q = loadQueue(); q.push(op); saveQueue(q);
    setSyncStatus('queued');
  }
  let flushing = false;
  async function flushSyncQueue(){
    if(flushing || !sb || !navigator.onLine) return;
    let q = loadQueue();
    if(!q.length) return;
    flushing = true;
    setSyncStatus('syncing');
    const remaining = [];
    let authBlocked = false;
    for(const op of q){
      let ok = false;
      try{
        if(op.t==='value')   ok = await pushSavedValue(op.a, op.b, op.c, true);
        if(op.t==='audit')   ok = await pushAuditEntry(op.a, true);
        if(op.t==='version') ok = await pushVersion(op.a, op.b, true);
      }catch(e){ ok = false; }
      if(!ok) remaining.push(op);
    }
    saveQueue(remaining);
    flushing = false;

    /* Als er nog items vastzitten en de gebruiker niet (meer) is ingelogd,
       is de oorzaak vrijwel zeker dat RLS de schrijfactie blokkeert.
       Vraag dan opnieuw inloggen i.p.v. stil te blijven proberen. */
    if(remaining.length && sb && !isAdmin()){
      authBlocked = true;
    }

    if(remaining.length){
      setSyncStatus('queued');
      if(authBlocked){
        showToast('⚠ ' + remaining.length + ' wijziging(en) niet opgeslagen — log opnieuw in', 'err');
      }
    } else {
      setSyncStatus('synced');
      if(q.length) showToast('✓ Alle wachtende wijzigingen gesynchroniseerd', 'ok');
    }
  }
  setInterval(flushSyncQueue, 30000);

  /* ═══════════════════════════════════════
     SYNC STATUS
  ═══════════════════════════════════════ */
  let syncStatus = 'idle';
  function setSyncStatus(s){
    syncStatus = s;
    const el = document.getElementById('sync-indicator');
    if(!el) return;
    const qn = loadQueue().length;
    const cfg = ({
      idle:    { color:'#475569', label:'·' },
      syncing: { color:'#f59e0b', label:'⟳ Sync…' },
      synced:  { color:'#22c55e', label:'✓ Synced' },
      queued:  { color:'#f59e0b', label:'⟳ ' + qn + ' in wachtrij' },
      offline: { color:'#64748b', label:'⊘ Offline' },
      error:   { color:'#ef4444', label:'! Sync fout' }
    })[s] || {color:'#475569', label:'·'};
    el.style.color = cfg.color;
    el.style.borderColor = cfg.color + '40';
    el.textContent = cfg.label;
  }

  /* Sync diagnose: test elke tabel apart en toon het exacte foutbericht,
     zodat duidelijk is of het probleem RLS, een ontbrekende tabel of een
     kolom-mismatch is. */
  let lastSyncErrorShown = '';
  async function diagnoseSync(){
    if(!sb) return;
    const lines = [];
    for(const t of ['current_values','versions','audit_log']){
      try{
        const { error } = await sb.from(t).select('*').limit(1);
        lines.push(t + ': ' + (error ? 'FOUT — ' + error.message : 'OK'));
      }catch(e){
        lines.push(t + ': FOUT — ' + ((e && e.message) || 'onbekend'));
      }
    }
    showFatal('SYNC DIAGNOSE\n' + lines.join('\n'));
  }

  let lastPullAt = 0;
  let pullInFlight = null;
  /* throttled pull: slaat een nieuwe pull over als er recent al één was,
     tenzij force=true. Voorkomt dubbele refetch + geflikker bij snel klikken. */
  async function pullFromCloud(force){
    if(!sb){ setSyncStatus(loadQueue().length ? 'queued' : 'offline'); return; }
    if(pullInFlight) return pullInFlight;
    if(!force && (Date.now() - lastPullAt) < 8000) return;
    pullInFlight = doPullFromCloud().finally(()=>{ pullInFlight = null; lastPullAt = Date.now(); });
    return pullInFlight;
  }

  async function doPullFromCloud(){
    if(!sb){ setSyncStatus(loadQueue().length ? 'queued' : 'offline'); return; }
    await flushSyncQueue();
    setSyncStatus('syncing');
    try {
      const [cv, vs, al] = await Promise.all([
        sb.from('current_values').select('*'),
        sb.from('versions').select('*').order('id', { ascending:false }),
        sb.from('audit_log').select('*').order('id', { ascending:false }).limit(500)
      ]);
      if(cv.error) throw cv.error;
      if(vs.error) throw vs.error;
      if(al.error) throw al.error;

      const store = getStore();
      store.currentValues = {};
      (cv.data || []).forEach(row => {
        if(!store.currentValues[row.store_key]) store.currentValues[row.store_key] = {};
        store.currentValues[row.store_key][row.param_key] = row.value;
      });
      store.versions = {};
      (vs.data || []).forEach(row => {
        if(!store.versions[row.store_key]) store.versions[row.store_key] = [];
        store.versions[row.store_key].push({
          v: row.v, ts: row.ts, changes: row.changes, locked: row.locked
        });
      });
      store.auditLog = (al.data || []).map(row => ({
        ts: row.ts, section: row.section, line: row.line,
        toBiscuit: row.to_biscuit, toFormat: row.to_format,
        param: row.param, old: row.old_value, new_: row.new_value,
        note: row.note || '', action: row.action, changedBy: row.changed_by || ''
      }));

      /* Nog-niet-gesynchroniseerde lokale wijzigingen uit de wachtrij
         opnieuw toepassen, anders zou de pull ze lokaal wissen. */
      loadQueue().forEach(op => {
        if(op.t==='value'){
          if(!store.currentValues[op.a]) store.currentValues[op.a] = {};
          store.currentValues[op.a][op.b] = op.c;
        }
        if(op.t==='audit'){
          store.auditLog.unshift(op.a);
        }
        if(op.t==='version'){
          if(!store.versions[op.a]) store.versions[op.a] = [];
          const arr = store.versions[op.a];
          const i = arr.findIndex(v => v.v === op.b.v);
          if(i >= 0) arr[i] = op.b; else arr.unshift(op.b);
        }
      });

      saveStore(store);
      setSyncStatus(loadQueue().length ? 'queued' : 'synced');
    } catch(err){
      console.warn('[pullFromCloud] failed:', err && err.message);
      const msg = (err && err.message) || 'onbekende fout';
      if(msg !== lastSyncErrorShown){
        lastSyncErrorShown = msg;
        showToast('Sync fout: ' + msg, 'err');
        diagnoseSync();
      }
      setSyncStatus(navigator.onLine ? 'error' : 'offline');
    }
  }

  async function pushSavedValue(storeKey, paramKey, value, fromQueue){
    if(!sb){
      if(!fromQueue) enqueue({ t:'value', a:storeKey, b:paramKey, c:String(value) });
      return false;
    }
    try {
      const { error } = await sb.from('current_values').upsert({
        store_key: storeKey, param_key: paramKey, value: String(value),
        updated_at: new Date().toISOString(), updated_by: auth.email || ''
      }, { onConflict: 'store_key,param_key' });
      if(error) throw error;
      return true;
    } catch(err){
      console.warn('[pushSavedValue] failed:', err && err.message);
      if(!fromQueue){
        enqueue({ t:'value', a:storeKey, b:paramKey, c:String(value) });
        showToast('⚠ Niet gesynchroniseerd: ' + ((err && err.message) || 'fout') + ' — wordt opnieuw geprobeerd', 'warn');
      }
      return false;
    }
  }

  async function pushAuditEntry(entry, fromQueue){
    if(!sb){
      if(!fromQueue) enqueue({ t:'audit', a:entry });
      return false;
    }
    try {
      const { error } = await sb.from('audit_log').insert({
        ts: entry.ts, section: entry.section, line: entry.line || '',
        to_biscuit: entry.toBiscuit, to_format: entry.toFormat,
        param: entry.param, old_value: entry.old, new_value: entry.new_,
        note: entry.note || '', action: entry.action, changed_by: entry.changedBy || ''
      });
      if(error) throw error;
      return true;
    } catch(err){
      console.warn('[pushAuditEntry] failed:', err && err.message);
      if(!fromQueue) enqueue({ t:'audit', a:entry });
      return false;
    }
  }

  async function pushVersion(storeKey, version, fromQueue){
    if(!sb){
      if(!fromQueue) enqueue({ t:'version', a:storeKey, b:JSON.parse(JSON.stringify(version)) });
      return false;
    }
    try {
      const { data: existing, error: selErr } = await sb
        .from('versions').select('id')
        .eq('store_key', storeKey).eq('v', version.v).limit(1);
      if(selErr) throw selErr;

      if(existing && existing.length){
        const { error } = await sb.from('versions').update({
          ts: version.ts, changes: version.changes, locked: !!version.locked
        }).eq('id', existing[0].id);
        if(error) throw error;
      } else {
        const { error } = await sb.from('versions').insert({
          store_key: storeKey, v: version.v, ts: version.ts,
          changes: version.changes, locked: !!version.locked
        });
        if(error) throw error;
      }
      return true;
    } catch(err){
      console.warn('[pushVersion] failed:', err && err.message);
      if(!fromQueue) enqueue({ t:'version', a:storeKey, b:JSON.parse(JSON.stringify(version)) });
      return false;
    }
  }

  const BISCUITS = [

    robertpack: './data/robertpack.json',

  const state = {
    loading:true, error:'', data:null,
    appMode:null,
    stage:1,
    fromBiscuit:null, fromFormat:null,
    toBiscuit:null,   toFormat:null,
    section:null,

  };

  const COLOR_MAP = {
    rood:'#ef4444', grijs:'#64748b', bruin:'#7a4a21',
    wit:'#ffffff',  blauw:'#3b82f6', zwart:'#111', groen:'#22c55e'
  };

  const biscuitLabel      = id => { const _b = BISCUITS.find(b=>b.id===id); return _b ? _b.label || '' : ''; };
  const formatsForBiscuit = id => { const _b = BISCUITS.find(b=>b.id===id); return _b ? _b.formats || [] : []; };
  const getBiscuitMeta    = id => BISCUITS.find(b=>b.id===id) || null;

  /* Resolves a UI format label to the internal data key.
     E.g. for Thee/Kokos, "4x4" maps to "5x5" in the JSON files. */
  function resolveDataFormat(biscuitId, uiFormat){
    const meta = getBiscuitMeta(biscuitId);
    if(meta && meta.formatMap && meta.formatMap[uiFormat]) return meta.formatMap[uiFormat];
    return uiFormat;
  }
  function buildFlowRows(fromObj, toObj){
    const keys = Array.from(new Set([...Object.keys(fromObj||{}), ...Object.keys(toObj||{})]));
    return keys.map(k => [k, fromObj && fromObj[k] != null ? fromObj[k] : '—', toObj && toObj[k] != null ? toObj[k] : '—']);
  }

  function escapeHtml(v){
    return String(v != null ? v : '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function cleanNumberToken(token){
    let s = String(token).trim();
    if(!s) return s;
    if(!/^[-+]?\d+[\.,]?\d*$/.test(s)) return s;
    const hasComma=s.includes(','), hasDot=s.includes('.');
    const sep = hasComma?',':(hasDot?'.':'');
    let parts = sep ? s.split(sep) : [s];
    let intPart = parts[0].replace(/^0+(\d)/,'$1');
    if(intPart==='') intPart='0';
    if(parts.length===1) return intPart;
    let decPart = parts[1].replace(/0+$/,'');
    if(decPart==='') return intPart;
    return intPart+','+decPart;
  }

  function normalizeDisplayValue(value){
    return String(value != null ? value : '').replace(/\u0392/g,'B')
      .split('/').map(p=>cleanNumberToken(p.trim())).join(' / ');
  }

  function normalizeCompareValue(value){
    return normalizeDisplayValue(value).toLowerCase().replace(/\s+/g,' ').trim();
  }

  const filterRows = (rows, onlyChanges) =>
    onlyChanges ? rows.filter(r=>normalizeCompareValue(r[1])!==normalizeCompareValue(r[2])) : rows;

  const isColorToken = t => Object.prototype.hasOwnProperty.call(COLOR_MAP, String(t).trim().toLowerCase());

  function renderColorDot(token){
    const name = String(token).trim().toLowerCase();
    const color = COLOR_MAP[name];
    if(!color) return '';
    return `<span class="colorDot ${name}" style="background:${color}"></span>`;
  }

  function renderRichValue(value){
    const norm  = normalizeDisplayValue(value);
    const parts = norm.split('/').map(p=>p.trim()).filter(Boolean);
    if(parts.length && parts.every(isColorToken))
      return `<span class="richValue"><span class="colorDots">${parts.map(renderColorDot).join('')}</span></span>`;
    const html = parts.map(p=>
      isColorToken(p) ? renderColorDot(p) : `<span class="richText">${escapeHtml(p)}</span>`
    );
    return `<span class="richValue">${html.join('<span class="richText">/</span>')}</span>`;
  }

  function renderParamKey(key){
    const m = String(key).match(/^(\d+[A-Z]?)\s+(.+)$/);
    if(!m) return `<span class="value-key-text">${escapeHtml(key)}</span>`;
    return `<span class="param-num">${escapeHtml(m[1])}</span><span class="value-key-text">${escapeHtml(m[2])}</span>`;
  }

  function renderPlayerLabel(key){
    const m = String(key).match(/^(\d+[A-Z]?)\s+(.+)$/);
    if(!m) return `<span>${escapeHtml(key)}</span>`;
    return `<span class="player-num">${escapeHtml(m[1])}</span><span>${escapeHtml(m[2])}</span>`;
  }

  const checkState = {

  /* ═══════════════════════════════════════
     SESSIE-PERSISTENTIE — refresh of vergrendeld tablet
     gooit de sessie niet meer weg.
  ═══════════════════════════════════════ */
  const SESSION_KEY = 'pally_session';
  function persistSession(){
    try{
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        s: {
          appMode: state.appMode,
          stage: state.stage,
          fromBiscuit: state.fromBiscuit, fromFormat: state.fromFormat,
          toBiscuit: state.toBiscuit, toFormat: state.toFormat,
          section: state.section,
          cavannaLine: state.cavannaLine, robertpackLine: state.robertpackLine,
          viewMode: state.viewMode, onlyChanges: state.onlyChanges, stepIndex: state.stepIndex,
          statusChecking: state.statusChecking
        },
        c: {
          active: checkState.active, stepIndex: checkState.stepIndex,
          results: checkState.results, showSummary: checkState.showSummary,
          tab: checkState.tab, onlyChanges: checkState.onlyChanges,
          statusParam: checkState.statusParam
        }
      }));
    }catch(e){}
  }
  function restoreSession(){
    try{
      const raw = sessionStorage.getItem(SESSION_KEY);
      if(!raw) return;
      const d = JSON.parse(raw);
      if(d && d.s) Object.assign(state, d.s);
      if(d && d.c) Object.assign(checkState, d.c);
      checkState.pendingSave = null;
    }catch(e){}
  }

  function loadStore(){ try{ return JSON.parse(localStorage.getItem('pally_store')||'{}'); }catch(e){return {};} }
  function saveStore(s){ try{ localStorage.setItem('pally_store', JSON.stringify(s)); }catch(e){} }

  function getStore(){
    const s = loadStore();
    if(!s.versions) s.versions = {};
    if(!s.auditLog) s.auditLog = [];
    if(!s.currentValues) s.currentValues = {};
    return s;
  }

  function buildStoreKey(){
    const line = state.section==='cavanna' ? state.cavannaLine :
                 state.section==='robertpack' ? state.robertpackLine : '';
    return `${state.section}|${state.toBiscuit}|${state.toFormat}|${line}`;
  }

  function nowStr(){ return new Date().toLocaleString('nl-NL',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

  async function loadData(){
    try{
      const entries = await Promise.all(
        Object.entries(FILES).map(async([key,path])=>{
          const res = await fetch(path,{cache:'no-store'});
          if(!res.ok) throw new Error('Failed: '+path);
          return [key, await res.json()];
        })
      );
      state.data = Object.fromEntries(entries);
    } catch(err){
      state.error = err.message||'Failed to load data.';
    } finally{
      state.loading = false;
      render();
      pullFromCloud(true).then(()=> render());
    }
  }

  function setState(patch){ Object.assign(state,patch); render(); }

  function resetAll(){
    Object.assign(state,{
      appMode:null,
      stage:1, fromBiscuit:null, fromFormat:null,
      toBiscuit:null, toFormat:null, section:null,
      cavannaLine:'9', robertpackLine:'9',
      viewMode:null, onlyChanges:true, stepIndex:0,
      statusChecking:false
    });
    checkState.active = false; checkState.stepIndex = 0; checkState.results = {}; checkState.tab = 'check';
    checkState.showSummary = false; checkState.pendingSave = null;
    render();
  }

  function getRobertPackValuesForFormat(format,col){
    var rp = state.data && state.data.robertpack;
    var byFormat = rp && rp.values && rp.values[format] ? rp.values[format] : {};
    return (byFormat[col]) || {};
  }

  /* FIX: opgeslagen waarden (uit Check Mode / cloud) worden nu óók
     toegepast op de "Nieuw"-kolom in de gewone weergave, zodat
     operators altijd de geldende waarde zien — niet de verouderde
     JSON-waarde. */
  function applySavedValues(rows){
    if(!state.section || !state.toBiscuit || !state.toFormat) return rows;
    const store = getStore();
    const sk = buildStoreKey();
    const cv = store.currentValues && store.currentValues[sk];
    if(!cv) return rows;
    return rows.map(r => (cv[r[0]] != null && cv[r[0]] !== '') ? [r[0], r[1], cv[r[0]]] : r);
  }

  function getRows(){
    if(!state.data) return [];
    const fromKey = resolveDataFormat(state.fromBiscuit, state.fromFormat);
    const toKey   = resolveDataFormat(state.toBiscuit,   state.toFormat);
    if(state.section==='cavanna'){
      const src = state.cavannaLine==='10' ? state.data.cavanna10 : state.data.cavanna9;
      return applySavedValues(buildFlowRows((src && src.values && src.values[fromKey])||{}, (src && src.values && src.values[toKey])||{}));
    }
    if(state.section==='robertpack')
      return applySavedValues(buildFlowRows(
        getRobertPackValuesForFormat(fromKey, state.robertpackLine),
        getRobertPackValuesForFormat(toKey,   state.robertpackLine)
      ));
    if(state.section==='dozen')
      return applySavedValues(buildFlowRows((state.data.dozen && state.data.dozen.values && state.data.dozen.values[fromKey] || {}), (state.data.dozen && state.data.dozen.values && state.data.dozen.values[toKey] || {})));
    if(state.section==='dekselaar')
      return applySavedValues(buildFlowRows((state.data.dekselaar && state.data.dekselaar.values && state.data.dekselaar.values[fromKey] || {}), (state.data.dekselaar && state.data.dekselaar.values && state.data.dekselaar.values[toKey] || {})));
    return [];
  }

  /* Check Mode respecteert nu ook het Alles/Wijzigingen-filter.
     In Status-modus zijn het enkele-waarde-rijen (geen Van→Naar, geen
     wijzigingen-filter want er is geen "oude" waarde om mee te vergelijken). */
  function getCheckRows(){
    if(state.appMode==='status'){
      const rows = getStatusRows();
      if(checkState.statusParam){
        const only = rows.filter(r => r[0] === checkState.statusParam);
        if(only.length) return only;
      }
      return rows;
    }
    return filterRows(getRows(), checkState.onlyChanges);
  }

  /* STATUS-MODUS: één waarde per parameter (de geldende waarde) voor
     het gekozen product+formaat+sectie — zonder Van→Naar.
     Rijvorm [param, '', huidigeWaarde] zodat dezelfde renderers/check
     werken; kolom 2 (oud) blijft leeg. */
  function getStatusBaseValues(){
    if(!state.data) return {};
    const key = resolveDataFormat(state.toBiscuit, state.toFormat);
    if(state.section==='cavanna'){
      const src = state.cavannaLine==='10' ? state.data.cavanna10 : state.data.cavanna9;
      return (src && src.values && src.values[key]) || {};
    }
    if(state.section==='robertpack')
      return getRobertPackValuesForFormat(key, state.robertpackLine);
    if(state.section==='dozen')
      return (state.data.dozen && state.data.dozen.values && state.data.dozen.values[key]) || {};
    if(state.section==='dekselaar')
      return (state.data.dekselaar && state.data.dekselaar.values && state.data.dekselaar.values[key]) || {};
    return {};
  }

  function getStatusRows(){
    const base = getStatusBaseValues();
    const store = getStore();
    const sk = buildStoreKey();
    const cv = (store.currentValues && store.currentValues[sk]) || {};
    return Object.keys(base).map(k => {
      const val = (cv[k] != null && cv[k] !== '') ? cv[k] : base[k];
      return [k, '', val];
    });
  }

  function getExpectedValue(paramKey, originalExpected){
    const store = getStore();
    const sk = buildStoreKey();
    const cv = store.currentValues && store.currentValues[sk];
    return (cv && cv[paramKey]) || originalExpected;
  }

  function openCheckMode(){
    /* Check & Verify is admin-only. Een operator wordt naar de login geleid. */
    if(!isAdmin()){
      auth.showLogin = true;
      auth.loginError = '';
      render();
      showToast('🔒 Log in als admin voor Check & Verify', 'warn');
      return;
    }
    checkState.active = true;
    checkState.stepIndex = 0;
    checkState.results = {};
    checkState.showSummary = false;
    checkState.pendingSave = null;
    checkState._finishAfterSave = false;
    checkState.statusParam = null;   /* hele lijst checken */
    pullFromCloud(true).then(()=> render());
    render();
  }

  /* Status-modus: Check Mode openen gericht op één parameter
     (de admin tikte 'Check' naast een specifiek nummer). */
  function openStatusCheck(paramKey){
    if(!isAdmin()){
      auth.showLogin = true;
      auth.loginError = '';
      render();
      showToast('🔒 Log in als admin om te checken', 'warn');
      return;
    }
    checkState.active = true;
    checkState.stepIndex = 0;
    checkState.results = {};
    checkState.showSummary = false;
    checkState.pendingSave = null;
    checkState._finishAfterSave = false;
    checkState.statusParam = paramKey || null;
    pullFromCloud(true).then(()=> render());
    render();
  }

  function closeCheckMode(){
    checkState.active = false;
    checkState.showSummary = false;
    checkState.pendingSave = null;
    checkState.statusParam = null;
    render();
  }

  function advanceCheck(){
    checkState.pendingSave = null;
    if(checkState._finishAfterSave){
      checkState._finishAfterSave = false;
      checkState.showSummary = true;
      render();
      return;
    }
    const rows = getCheckRows();
    if(checkState.stepIndex < rows.length - 1){
      checkState.stepIndex++;
      render();
    } else {
      checkState.showSummary = true;
      render();
    }
  }

  /* Gedeelde opslag-logica voor Check Mode én versie-herstel:
     schrijft currentValues + audit + versie, en synct met wachtrij. */
  function persistValueChange(paramKey, oldVal, newVal, note){
    const store = getStore();
    const sk = buildStoreKey();

    if(!store.currentValues[sk]) store.currentValues[sk] = {};
    store.currentValues[sk][paramKey] = String(newVal);

    const auditEntry = {
      ts: nowStr(),
      section: getSectionTitle(state.section),
      line: state.section==='cavanna'?state.cavannaLine:state.section==='robertpack'?state.robertpackLine:'',
      toBiscuit: biscuitLabel(state.toBiscuit), toFormat: state.toFormat,
      param: paramKey,
      old: normalizeDisplayValue(String(oldVal)),
      new_: normalizeDisplayValue(String(newVal)),
      note: note || '', action: 'saved',
      changedBy: auth.email || ''
    };
    store.auditLog.unshift(auditEntry);

    if(!store.versions[sk]) store.versions[sk] = [];
    const last = store.versions[sk][0];
    const changeEntry = {
      param: paramKey,
      old: normalizeDisplayValue(String(oldVal)),
      new_: normalizeDisplayValue(String(newVal)),
      note: note || ''
    };
    let versionToPush;
    if(!last || last.locked){
      versionToPush = { v:(store.versions[sk].length+1), ts:nowStr(), changes:[changeEntry], locked:false };
      store.versions[sk].unshift(versionToPush);
    } else {
      const idx = last.changes.findIndex(c=>c.param===paramKey);
      if(idx>=0) last.changes[idx]=changeEntry; else last.changes.push(changeEntry);
      last.ts = nowStr();
      versionToPush = last;
    }
    saveStore(store);

    setSyncStatus('syncing');
    Promise.all([
      pushSavedValue(sk, paramKey, newVal),
      pushAuditEntry(auditEntry),
      pushVersion(sk, versionToPush)
    ]).then(results => {
      if(results.every(r=>r)) setSyncStatus('synced');
      else setSyncStatus(loadQueue().length ? 'queued' : (navigator.onLine ? 'error' : 'offline'));
    }).catch(()=>{
      setSyncStatus(loadQueue().length ? 'queued' : (navigator.onLine ? 'error' : 'offline'));
    });
  }

  function confirmSave(){
    const p = checkState.pendingSave;
    if(!p) return;

    /* Opslaan van een nieuwe geldende waarde vereist admin */
    if(!isAdmin()){
      auth.showLogin = true;
      auth.loginError = '';
      render();
      showToast('🔒 Log in als admin om de nieuwe waarde op te slaan', 'warn');
      return;
    }

    const noteEl = document.getElementById('confirm-note');
    const note = noteEl ? noteEl.value.trim() : '';

    persistValueChange(p.paramKey, p.expectedVal, p.actualVal, note);

    checkState.results[p.paramKey] = { status:'saved', actual:p.actualVal };
    removeConfirmOverlay();

    const finishAfter = checkState._finishAfterSave;
    checkState._finishAfterSave = false;

    if(finishAfter){ checkState.showSummary = true; render(); }
    else { advanceCheck(); }
  }

  function confirmSkip(){
    const p = checkState.pendingSave;
    if(!p) return;
    const noteEl = document.getElementById('confirm-note');
    const note = noteEl ? noteEl.value.trim() : '';
    checkState.results[p.paramKey] = { status:'mismatch', actual:p.actualVal, note: note };
    removeConfirmOverlay();
    const finishAfter = checkState._finishAfterSave;
    checkState._finishAfterSave = false;
    if(finishAfter){ checkState.showSummary = true; render(); }
    else { advanceCheck(); }
  }

  function renderConfirmOverlay(){
    const p = checkState.pendingSave;
    if(!p) return;
    const existing = document.getElementById('check-confirm-overlay');
    if(existing) existing.remove();
    const adminHint = isAdmin() ? '' :
      `<div class="confirm-admin-hint">🔒 Opslaan vereist admin — je wordt gevraagd in te loggen.</div>`;
    const div = document.createElement('div');
    div.className = 'check-confirm-overlay';
    div.id = 'check-confirm-overlay';
    div.innerHTML = `
      <div class="check-confirm-box">
        <div class="check-confirm-title">Waarde verschilt</div>
        <div class="check-confirm-body">De machine-waarde verschilt van de lijst. Wil je de nieuwe waarde opslaan als de geldende waarde?</div>
        <div class="check-confirm-vals">
          <span class="check-confirm-val old">${escapeHtml(normalizeDisplayValue(String(p.expectedVal)))}</span>
          <span class="check-confirm-arr">→</span>

  }

  /* Versie-herstel: zet een parameter terug naar een eerdere waarde */
  function restoreParam(paramKey, oldValue){
    if(!isAdmin()){
      auth.showLogin = true;
      auth.loginError = '';
      render();
      showToast('🔒 Log in als admin om een waarde te herstellen', 'warn');
      return;
    }
    const rows = state.appMode==='status' ? getStatusRows() : getRows();
    const row  = rows.find(r => r[0] === paramKey);
    const currentVal = row ? getExpectedValue(paramKey, row[2]) : '—';
    persistValueChange(paramKey, currentVal, oldValue, 'Hersteld naar eerdere waarde');
    showToast('↩ ' + paramKey + ' hersteld naar ' + normalizeDisplayValue(String(oldValue)), 'ok');
    render();
  }

  async function commitAndClose(){
    const store = getStore();
    const sk = buildStoreKey();
    if((store.versions[sk] && store.versions[sk][0]) && !store.versions[sk][0].locked){
      store.versions[sk][0].locked = true;
      saveStore(store);
      setSyncStatus('syncing');
      const ok = await pushVersion(sk, store.versions[sk][0]);
      setSyncStatus(ok ? 'synced' : (loadQueue().length ? 'queued' : (navigator.onLine ? 'error' : 'offline')));
    }
    closeCheckMode();
  }
