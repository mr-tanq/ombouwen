  function detectPresetType(expectedVal) {
    var norm = normalizeCompareValue(String(expectedVal));
    if(norm === '-' || norm === '—') return { type:'dash', options:null };
    if(norm === 'ja' || norm === 'nee') return { type:'yn', options:['JA','NEE'] };
    if(norm === 'open' || norm === 'dicht') return { type:'preset', options:['OPEN','DICHT'] };
    if(norm === 'a' || norm === 'b') return { type:'preset', options:['A','B'] };
    if(/^x\d+$/.test(norm)) return { type:'preset', options:['x1','x2','x3','x4','x5','x6','x7','x8'] };
    if(norm === 'uit' || norm === 'in') return { type:'preset', options:['uit','in'] };
    if(/gat$/.test(norm)) return { type:'preset', options:['1ste gat','4de gat'] };
    if(/^nr\.\d+\s*-\s*\d+x$/.test(norm)) return { type:'racetrack', options:null };
    if(norm.indexOf('->') >= 0 || norm.indexOf('<-') >= 0 || /^[x\d\-]+/.test(norm)) {
      if(norm.length > 8) return { type:'sequence', options:null };
    }
    if(norm.length > 20 && !/^[-+]?[\d,./]+$/.test(norm)) return { type:'freetext', options:null };
    return null;
  }

  function buildActualArea(colorMode, boxClass, liveStatus, curKey, actualVal, expectedVal){
    if(colorMode){
      var matchSt    = liveStatus==='match'    ? 'background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.5);' : '';
      var mismatchSt = liveStatus==='mismatch' ? 'background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.5);' : '';
      return '<div class="check-val-box color-confirm ' + boxClass + '" style="flex-direction:column;gap:12px;padding:20px;">'
        + '<div style="font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px">Klopt dit op de machine?</div>'
        + '<div style="display:flex;gap:10px;width:100%">'
        + '<button class="check-color-btn match" data-action="check-color-confirm" data-key="' + escapeHtml(curKey) + '" data-value="match" style="' + matchSt + '">✓ Ja, klopt</button>'
        + '<button class="check-color-btn miss"  data-action="check-color-confirm" data-key="' + escapeHtml(curKey) + '" data-value="mismatch" style="' + mismatchSt + '">✕ Nee, afwijking</button>'
        + '</div></div>';
    }

    var preset = detectPresetType(expectedVal);

    if(preset && preset.type === 'dash') {
      var matchSt0 = liveStatus==='match' ? 'selected-match' : '';
      return '<div class="check-val-lbl" style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">Niet van toepassing</div>'
        + '<div class="seq-confirm">'
        + '<button class="preset-btn ' + matchSt0 + '" data-action="check-preset" data-key="' + escapeHtml(curKey) + '" data-value="-" style="font-size:13px;padding:12px 10px;">✓ N.v.t. — bevestigen</button>'
        + '</div>';
    }

    if(preset && preset.type !== 'sequence' && preset.type !== 'racetrack' && preset.type !== 'freetext' && preset.options) {
      var normExp  = normalizeCompareValue(String(expectedVal));
      var btns = preset.options.map(function(opt) {
        var normOpt = normalizeCompareValue(opt);
        var isExp = normOpt === normExp;
        var isSel = liveStatus === 'match' && normalizeCompareValue(actualVal || String(expectedVal)) === normOpt;
        var isMiss = liveStatus === 'mismatch' && normalizeCompareValue(actualVal) === normOpt;
        var cls = isSel ? 'selected-match' : (isMiss ? 'selected-miss' : '');
        return '<button class="preset-btn ' + cls + '" data-action="check-preset" data-key="' + escapeHtml(curKey) + '" data-value="' + escapeHtml(opt) + '">'
          + escapeHtml(opt)
          + (isExp ? '<span style="display:block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-top:3px;">verwacht</span>' : '')
          + '</button>';
      }).join('');
      return '<div class="check-val-lbl" style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">Selecteer waarde</div>'
        + '<div class="preset-grid">' + btns + '</div>';
    }

    if(preset && (preset.type === 'racetrack' || preset.type === 'freetext')) {
      var matchSt2 = liveStatus==='match'    ? 'selected-match' : '';
      var missSt2  = liveStatus==='mismatch' ? 'selected-miss'  : '';
      return '<div class="check-val-lbl" style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">Controleer op machine</div>'
        + '<div class="seq-display">' + escapeHtml(normalizeDisplayValue(String(expectedVal))) + '</div>'
        + '<div class="seq-confirm">'
        + '<button class="preset-btn ' + matchSt2 + '" data-action="check-preset" data-key="' + escapeHtml(curKey) + '" data-value="' + escapeHtml(String(expectedVal)) + '" style="font-size:13px;padding:12px 10px;">✓ Klopt</button>'
        + '<button class="preset-btn ' + missSt2  + '" data-action="check-preset-miss" data-key="' + escapeHtml(curKey) + '" style="font-size:13px;padding:12px 10px;">✕ Afwijking</button>'
        + '</div>';
    }

    if(preset && preset.type === 'sequence') {
      var matchSt3 = liveStatus==='match'    ? 'selected-match' : '';
      var missSt3  = liveStatus==='mismatch' ? 'selected-miss'  : '';
      var dispVal  = normalizeDisplayValue(String(expectedVal));
      return '<div class="check-val-lbl" style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">Volgorde controleren</div>'
        + '<div class="seq-display" style="font-size:15px;letter-spacing:.12em;">' + escapeHtml(dispVal) + '</div>'
        + '<div class="seq-confirm">'
        + '<button class="preset-btn ' + matchSt3 + '" data-action="check-preset" data-key="' + escapeHtml(curKey) + '" data-value="' + escapeHtml(String(expectedVal)) + '" style="font-size:13px;padding:12px 10px;">✓ Volgorde klopt</button>'
        + '<button class="preset-btn ' + missSt3  + '" data-action="check-preset-miss" data-key="' + escapeHtml(curKey) + '" style="font-size:13px;padding:12px 10px;">✕ Afwijking</button>'
        + '</div>';
    }

    /* Vrij invoerveld — numeriek toetsenbord als de verwachte waarde numeriek is */
    var isNumeric = /^[\s\d.,\/+-]+$/.test(normalizeDisplayValue(String(expectedVal)));
    return '<div class="check-val-box ' + boxClass + '">'
      + '<input class="check-input" id="check-actual-input"'
      + ' placeholder="Voer waarde in\u2026"'
      + ' value="' + escapeHtml(actualVal) + '"'
      + ' type="text" inputmode="' + (isNumeric ? 'decimal' : 'text') + '" autocomplete="off"'
      + ' data-param="' + escapeHtml(curKey) + '"'
      + ' data-expected="' + escapeHtml(String(expectedVal)) + '">'
      + '</div>';
  }

  function renderCheckMode(checkRows){
    const total = checkRows.length;
    const isStatus = state.appMode==='status';

    /* Alles/Wijzigingen-filter — alleen in Ombouw-modus.
       In Status-modus is er geen "oude" waarde, dus geen filter. */
    const checkToggle = isStatus
      ? `<div class="mode-bar" style="margin-bottom:14px">
           <span style="font-family:var(--mono);font-size:11px;color:#06b6d4">≡ Status-check${checkState.statusParam?' · '+escapeHtml(checkState.statusParam):''}</span>
           <span style="font-family:var(--mono);font-size:11px;color:var(--text-3)">${total} parameter${total!==1?'s':''}</span>
         </div>`
      : `<div class="mode-bar" style="margin-bottom:14px">
        <div class="mode-pills">
          <button class="mode-btn${!checkState.onlyChanges?' active':''}" data-action="check-show-mode" data-value="all">Alles</button>
          <button class="mode-btn${checkState.onlyChanges?' active':''}" data-action="check-show-mode" data-value="changes">Wijzigingen</button>
        </div>
        <span style="font-family:var(--mono);font-size:11px;color:var(--text-3)">${total} parameter${total!==1?'s':''}</span>
      </div>`;

    if(!total){
      const secData  = state.section==='cavanna' ? (state.data && state.data.cavanna9) :
                       state.section==='robertpack' ? (state.data && state.data.robertpack) :
                       state.section==='dozen' ? (state.data && state.data.dozen) :
                       (state.data && state.data.dekselaar);
      const fmtKeys  = (secData && secData.values) ? Object.keys(secData.values) : [];
      return checkToggle + `<div class="emptyNote">
        ${isStatus ? 'Geen parameters gevonden' : (checkState.onlyChanges ? 'Geen wijzigingen — schakel naar "Alles" om alle parameters te checken' : 'Geen parameters gevonden')}<br>
        <span style="font-size:10px;margin-top:8px;display:block">
          Sectie: ${state.section} · Format: ${state.toFormat}<br>
          Beschikbare formats: ${fmtKeys.join(', ')||'—'}
        </span>
      </div>`;
    }

    if(checkState.showSummary) return renderCheckSummary(checkRows);

    if(checkState.stepIndex >= total) checkState.stepIndex = 0;

    const done  = checkRows.filter(r=>(checkState.results[r[0]] && checkState.results[r[0]].status) && (checkState.results[r[0]] && checkState.results[r[0]].status)!=='pending').length;
    const pct   = Math.round(done/total*100);

    const statusGlyph = s => s==='match'?'✓':s==='mismatch'?'✕':s==='saved'?'↑':'·';

    const miniList = checkRows.map(([key],i)=>{
      const s = (checkState.results[key] && checkState.results[key].status) || 'pending';
      return `
        <button class="check-mini-row${i===checkState.stepIndex?' active':''}" data-action="check-jump" data-value="${i}">
          <span class="check-mini-num">${String(i+1).padStart(2,'0')}</span>
          <span class="check-mini-key">${escapeHtml(key)}</span>
          <span class="check-mini-status ${s}">${statusGlyph(s)}</span>
        </button>`;
    }).join('');

    const cur = checkRows[checkState.stepIndex];
    if(!cur) return checkToggle + `<div class="emptyNote">Geen parameter</div>`;
    const [curKey, , curExpRaw] = cur;

    const curResult  = checkState.results[curKey] || {};
    const expectedVal= getExpectedValue(curKey, curExpRaw);
    const actualVal  = curResult.actual || '';
    const isLast     = checkState.stepIndex >= total-1;

    const liveStatus = curResult.status || (
      actualVal.trim()
        ? (normalizeCompareValue(String(expectedVal))===normalizeCompareValue(actualVal) ? 'match' : 'mismatch')
        : 'pending'
    );

    const isColorValue = v => {
      const norm  = normalizeDisplayValue(String(v));
      const parts = norm.split('/').map(p=>p.trim()).filter(Boolean);
      return parts.length > 0 && parts.every(isColorToken);
    };
    const colorMode = isColorValue(expectedVal);

    const boxClass    = liveStatus==='match' ? 'status-match' : liveStatus==='mismatch' ? 'status-mismatch' : liveStatus==='saved' ? 'status-saved' : 'actual';
    const badgeLabel  = { match:'✓ Match', mismatch:'✕ Mismatch', saved:'↑ Opgeslagen', pending:'Wacht…' };
    const badgeCls    = { match:'match', mismatch:'mismatch', saved:'saved', pending:'pending' };

    const actualArea = buildActualArea(colorMode, boxClass, liveStatus, curKey, actualVal, expectedVal);

    const paramCard = `
      <div class="check-player">
        <div class="check-player-top">
          <span class="player-counter">${checkState.stepIndex+1} / ${total}</span>
          <div class="player-progress-track" style="flex:1;margin:0 18px">
            <div class="player-progress-fill" style="width:${pct}%"></div>
          </div>
          <span class="check-status-badge ${badgeCls[liveStatus]||'pending'}">
            <span class="check-status-dot"></span>${badgeLabel[liveStatus]||'Wacht…'}
          </span>
        </div>

        <div class="check-player-body">
          <div class="check-param-label">PARAMETER</div>
          <div class="check-param-name">${renderPlayerLabel(curKey)}</div>

          ${(function(){
            var _preset = detectPresetType(expectedVal);
            var _isStacked = _preset && (_preset.type==='racetrack'||_preset.type==='freetext'||_preset.type==='sequence'||_preset.type==='dash');
            if(_isStacked) {
              return '<div class="check-values-stacked">'
                + '<div class="check-val-block"><div class="check-val-label">Expected (lijst)</div>'
                + '<div class="check-val-box expected">' + renderRichValue(String(expectedVal)) + '</div></div>'
                + '<div class="check-val-block">' + actualArea + '</div>'
                + '</div>';
            }
            return '<div class="check-values-grid">'
              + '<div class="check-val-block"><div class="check-val-label">Expected (lijst)</div>'
              + '<div class="check-val-box expected">' + renderRichValue(String(expectedVal)) + '</div></div>'
              + '<div class="check-arrow">→</div>'
              + '<div class="check-val-block"><div class="check-val-label">Actual (machine)</div>'
              + actualArea + '</div>'
              + '</div>';
          })()}
        </div>

        <div class="check-player-nav">
          <button class="btn-ghost" data-action="check-prev" ${checkState.stepIndex===0?'disabled':''}>← Vorige</button>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="player-counter-done" style="font-family:var(--mono);font-size:11px;color:var(--text-3)">${done}/${total}</span>
            ${isLast
              ? `<button class="btn-primary" data-action="check-finish" data-param="${escapeHtml(curKey)}" data-expected="${escapeHtml(String(expectedVal))}" data-status="${liveStatus}">Afronden ✓</button>`
              : `<button class="btn-primary" data-action="check-next"  data-param="${escapeHtml(curKey)}" data-expected="${escapeHtml(String(expectedVal))}" data-status="${liveStatus}">Volgende →</button>`
            }
          </div>
        </div>
      </div>`;

    return `
      ${checkToggle}
      <div class="check-wrap">
        <div>${paramCard}</div>
        <div class="check-sidebar">
          <div class="check-sidebar-header">
            <span class="player-sidebar-title">Parameters</span>
            <span style="font-family:var(--mono);font-size:10px;color:var(--text-3)">${pct}%</span>
          </div>
          <div class="mini-list">${miniList}</div>
        </div>
      </div>`;
  }

  function renderCheckSummary(checkRows){
    const saved      = checkRows.filter(([k])=>(checkState.results[k] && checkState.results[k].status)==='saved');
    const mismatches = checkRows.filter(([k])=>(checkState.results[k] && checkState.results[k].status)==='mismatch');
    const matches    = checkRows.filter(([k])=>(checkState.results[k] && checkState.results[k].status)==='match');
    const pending    = checkRows.filter(([k])=>!(checkState.results[k] && checkState.results[k].status) || (checkState.results[k] && checkState.results[k].status)==='pending');

    const allChecked = [...saved, ...mismatches, ...matches];

    const changeRows = allChecked.map(([key, , expRaw]) => {
      const r = checkState.results[key];
      const status = (r && r.status) || 'pending';
      const expectedDisp = normalizeDisplayValue(String(getExpectedValue(key, expRaw)));
      const expParts = expectedDisp.split('/').map(p=>p.trim()).filter(Boolean);
      const isColor  = expParts.length > 0 && expParts.every(isColorToken);

      const actualDisplay = isColor
        ? renderRichValue(expectedDisp)
        : escapeHtml(normalizeDisplayValue(String(r && r.actual ? r.actual : '—')));

      const statusIco = status==='match'?'✓':status==='saved'?'↑':status==='mismatch'?'✕':'·';
      const rowCls = status==='match'?'row-match':status==='saved'?'row-saved':status==='mismatch'?'row-miss':'';
      return `
        <div class="check-changes-row ${rowCls}">
          <span class="check-changes-key">${renderParamKey(key)}</span>
          <span class="check-changes-from">${renderRichValue(expectedDisp)}</span>
          <span class="check-changes-sep">→</span>
          <span class="check-changes-to ${status}">${actualDisplay}</span>
          <span class="check-changes-status ${status}">${statusIco}</span>
        </div>`;
    }).join('');

    return `
      <div class="check-summary-screen">
        <div class="check-summary-hero">Check afgerond</div>
        <div class="check-summary-sub">${getSectionTitle(state.section)} · ${escapeHtml(biscuitLabel(state.toBiscuit))} ${escapeHtml(state.toFormat||'')}</div>
        <div class="check-summary-stats">
          <span class="check-stat-pill ok">  <span class="sn">${matches.length}</span> Match</span>
          <span class="check-stat-pill miss"><span class="sn">${mismatches.length}</span> Mismatch</span>
          <span class="check-stat-pill save"><span class="sn">${saved.length}</span> Opgeslagen</span>
          ${pending.length ? `<span class="check-stat-pill skip"><span class="sn">${pending.length}</span> Niet gecheckt</span>` : ''}
        </div>
        ${allChecked.length ? `
          <div class="check-changes-title">Gecheckte parameters</div>
          <div class="check-changes-list">${changeRows}</div>
        ` : `<div class="emptyNote" style="padding:32px;margin-bottom:24px">Geen parameters gecheckt</div>`}
        <div class="check-summary-actions">

  function renderHistory(){
    const store = getStore();
    const sk    = buildStoreKey();
    const versions = store.versions[sk] || [];
    if(!versions.length) return `<div class="empty-state">Geen versies gevonden — nog geen waarden opgeslagen</div>`;
    return `<div class="version-list">
      ${versions.map((v,vi)=>`
        <div class="version-card">
          <button class="version-card-header" data-action="toggle-version" data-value="${vi}">
            <span class="version-badge${vi===0?' latest':''}">v${v.v}</span>
            <span class="version-meta">${biscuitLabel(state.toBiscuit)} ${state.toFormat} · ${getSectionTitle(state.section)}</span>
            <span class="version-change-count">${v.changes.length} wijziging${v.changes.length!==1?'en':''}</span>
            <span class="version-date">${v.ts}</span>
          </button>
          <div class="version-body${vi===0?' open':''}" id="version-body-${vi}">
            <div class="version-param-list">
              ${v.changes.map(c=>`
                <div class="version-param-row">
                  <span class="version-param-name">${renderParamKey(c.param)}</span>
                  <span class="version-param-val">${escapeHtml(c.old)}</span>
                  <span class="version-param-sep">→</span>
                  <span class="version-param-val new">${escapeHtml(c.new_)}</span>
                  <button class="restore-btn" data-action="restore-param" data-param="${escapeHtml(c.param)}" data-oldval="${escapeHtml(c.old)}" title="Zet ${escapeHtml(c.param)} terug naar ${escapeHtml(c.old)}">↩ Herstel</button>
                </div>
                ${c.note ? `<div style="padding:0 10px 6px 10px"><span style="font-family:var(--mono);font-size:11px;color:var(--text-3);font-style:italic">"${escapeHtml(c.note)}"</span></div>` : ''}

          </div>

  function renderAudit(){
    const store = getStore();
    const logs = store.auditLog.filter(e=>
      e.section===getSectionTitle(state.section) &&
      e.toBiscuit===biscuitLabel(state.toBiscuit) &&
      e.toFormat===state.toFormat
    );
    if(!logs.length) return `<div class="empty-state">Geen wijzigingen gelogd voor deze combinatie</div>`;
    const iconMap = { match:'✓', warn:'!', mismatch:'✕', saved:'↑', skipped:'—' };
    return `<div class="audit-list">
      ${logs.map(e=>`
        <div class="audit-entry">
          <div class="audit-icon ${e.action}">${iconMap[e.action]||'·'}</div>
          <div class="audit-body">
            <div class="audit-title">${escapeHtml(e.param)}</div>
            <div class="audit-meta">${escapeHtml(e.section)}${e.line?' · Lijn '+e.line:''} · ${escapeHtml(e.toBiscuit)} ${escapeHtml(e.toFormat)}${e.changedBy?' · door '+escapeHtml(e.changedBy):''}</div>
            <div class="audit-change">
              <span class="audit-old">${escapeHtml(e.old)}</span>
              <span class="audit-arr">→</span>

    const sectionLabel = !state.section ? null :
      state.section==='cavanna'    ? `Cavanna · L${state.cavannaLine}` :
      state.section==='robertpack' ? `Robert Pack · L${state.robertpackLine}` :
      state.section==='dozen'      ? 'Dozen Opzetter' : 'Dekselaar Opzetter';

    /* Check & Verify is nu altijd zichtbaar als stap — ook voor operators.

    const steps = [
      { label:'Product & Formaat', done: canContinue,                        active: state.stage===1 },
      { label:'Sectie & Ombouw',   done: state.stage===2 && !!state.section, active: state.stage===2 && !checkState.active },

              ${state.viewMode?`
                <div class="mode-pills">
                  <button class="mode-btn${!state.onlyChanges?' active':''}" data-action="show-mode" data-value="all">Alles</button>
                  <button class="mode-btn${state.onlyChanges?' active':''}" data-action="show-mode" data-value="changes">Wijzigingen</button>
                </div>`:''
              }
              ${state.viewMode==='list'?`<button class="view-action-btn" data-action="print-list">⎙ Print</button>`:''}
            </div>
          </div>

          ${state.viewMode==='start' ? renderStepPlayer(visibleRows) : ''}
          ${state.viewMode==='list'  ? renderValueList(visibleRows) : ''}
          ${!state.viewMode ? `<div class="emptyNote">Kies hierboven hoe je de informatie wilt weergeven.</div>` : ''}
        </div>`;
    }

    const roleBadge = isAdmin()
      ? `<button class="role-badge admin" data-action="role-logout" title="${escapeHtml(auth.email||'')} — klik om uit te loggen">🔓 ${escapeHtml(auth.email ? auth.email.split('@')[0] : 'Admin')}</button>`
      : `<button class="role-badge operator" data-action="role-login" title="Klik om in te loggen voor wijzigingen">🔒 Operator</button>`;

    shell.innerHTML = `
      <div class="topbar">
        <div class="topbar-brand">
          <div class="topbar-logo"><img src="./pally-logo.png" alt="Pally" onerror="this.style.display='none'"></div>
          <span class="topbar-name">Pally Biscuits</span>
          <div class="topbar-sep"></div>
          <span class="topbar-module">${checkState.active ? 'Check Mode' : 'Ombouwen'}</span>
        </div>
        <div class="topbar-right">
          <button class="sync-indicator" id="sync-indicator" data-action="manual-refresh" title="Klik om te verversen" aria-live="polite">·</button>
          ${roleBadge}
        </div>
      </div>
      <div class="body">
        ${renderSidebar()}
        <div class="main">
          <div class="breadcrumb">${bc}</div>
          ${renderMobileFlowbar()}
          ${mainContent}
        </div>
      </div>
      ${renderLoginOverlay()}`;

    setSyncStatus(syncStatus);
    bindActions();
    persistSession();
  }

  function saveCurrentInput(){
    const inp  = document.getElementById('check-actual-input');
    const rows = getCheckRows();
    const cur  = rows[checkState.stepIndex];
    if(!cur) return;
    const key    = cur[0];
    const expRaw = cur[2];
    const normExp  = normalizeDisplayValue(String(expRaw));
    const expParts = normExp.split('/').map(p=>p.trim()).filter(Boolean);
    const isColor  = expParts.length > 0 && expParts.every(isColorToken);
    if(isColor) return;
    var presetType2 = detectPresetType(expRaw);
    if(presetType2 && presetType2.options) return;
    const val    = inp ? inp.value : (checkState.results[key] && checkState.results[key].actual ? checkState.results[key].actual : '');
    const exp    = getExpectedValue(key, expRaw);
    const status = val.trim()
      ? (normalizeCompareValue(String(exp)) === normalizeCompareValue(val) ? 'match' : 'mismatch')
      : ((checkState.results[key] && checkState.results[key].status) || 'pending');
    checkState.results[key] = { ...(checkState.results[key]||{}), actual: val, status };
  }

  function attemptLogin(){
    const emailInp = document.getElementById('login-email');
    const passInp  = document.getElementById('login-input');
    if(!passInp) return;
    const email = emailInp ? emailInp.value.trim() : '';
    const pass  = passInp.value;
    if(sb && !email){ auth.loginError = 'Vul je e-mail in'; render(); return; }
    doLogin(email, pass);
  }

  function bindActions(){
    document.querySelectorAll('[data-action]').forEach(el=>{
      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') return;
      el.addEventListener('click', ()=>{
        const action = el.dataset.action;
        const value  = el.dataset.value;

        /* ── auth ── */
        if(action==='manual-refresh'){ showToast('Verversen…', 'ok'); pullFromCloud(true).then(()=> render()); }
        if(action==='role-login'){ auth.showLogin = true; auth.loginError = ''; render(); }
        if(action==='role-logout'){ doLogout(); }
        if(action==='login-cancel'){ auth.showLogin = false; auth.loginError = ''; render(); }
        if(action==='login-submit'){ attemptLogin(); }

        if(action==='from-product')  setState({fromBiscuit:value, fromFormat:null});
        if(action==='to-product')    setState({toBiscuit:value,   toFormat:null});
        if(action==='from-format')   setState({fromFormat:value});
        if(action==='to-format')     {
          setState({toFormat:value});
        }
        if(action==='reset-all')     resetAll();
        if(action==='pick-mode'){
          setState({ appMode: value, stage: 1, section: null });
        }
        if(action==='go-sections' && state.fromBiscuit&&state.fromFormat&&state.toBiscuit&&state.toFormat) setState({stage:2});
        if(action==='status-go-sections' && state.toBiscuit&&state.toFormat) setState({stage:2, section:null});
        if(action==='back-setup')    setState({stage:1});
        if(action==='open-section')  {
          setState({section:value, viewMode:null, stepIndex:0});
          pullFromCloud(true).then(()=> render());
        }
        if(action==='status-open-section'){
          setState({section:value});
          pullFromCloud(true).then(()=> render());
        }
        if(action==='close-section') setState({section:null, viewMode:null, stepIndex:0});
        if(action==='status-close-section') setState({section:null});
        if(action==='status-check-one'){
          /* Open Check Mode gericht op deze parameter */
          openStatusCheck(el.dataset.param);
        }
        if(action==='cav-line')      {
          setState({cavannaLine:value, stepIndex:0});
        }
        if(action==='rp-line')       {
          setState({robertpackLine:value, stepIndex:0});
        }
        if(action==='show-mode')     setState({onlyChanges:value==='changes', stepIndex:0});
        if(action==='jump-step')     setState({stepIndex:parseInt(value)});
        if(action==='prev-step' && state.stepIndex>0) setState({stepIndex:state.stepIndex-1});
        if(action==='view-mode')     setState({viewMode: state.viewMode===value ? null : value, stepIndex:0});
        if(action==='next-step'){
          const vr = filterRows(getRows(), state.onlyChanges);
          if(state.stepIndex < vr.length-1) setState({stepIndex:state.stepIndex+1});
          else setState({viewMode:null, stepIndex:0});
        }
        if(action==='print-list'){ window.print(); }

        if(action==='open-check')  openCheckMode();
        if(action==='close-check') closeCheckMode();
        if(action==='check-commit'){ commitAndClose(); }
        if(action==='check-tab')   { checkState.tab = value; render(); }
        if(action==='check-show-mode'){
          checkState.onlyChanges = (value==='changes');
          checkState.stepIndex = 0;
          render();
        }
        if(action==='restore-param'){
          restoreParam(el.dataset.param, el.dataset.oldval);
        }

        if(action==='check-jump'){
          saveCurrentInput();
          checkState.stepIndex = parseInt(value);
          render();
        }
        if(action==='check-prev'){
          saveCurrentInput();
          if(checkState.stepIndex > 0){ checkState.stepIndex--; render(); }
        }
        if(action==='check-next'){
          saveCurrentInput();
          const rows = getCheckRows();
          const cur  = rows[checkState.stepIndex];
          if(!cur) return;
          const curKey = cur[0], expRaw = cur[2];
          const res = checkState.results[curKey] || {};
          if(res.status === 'mismatch'){
            checkState.pendingSave = {
              paramKey: curKey,
              expectedVal: getExpectedValue(curKey, expRaw),
              actualVal: res.actual || ''
            };
            renderConfirmOverlay();
          } else {
            advanceCheck();
          }
        }
        if(action==='check-finish'){
          saveCurrentInput();
          const rows = getCheckRows();
          const cur  = rows[checkState.stepIndex];
          if(!cur) return;
          const curKey = cur[0], expRaw = cur[2];
          const res = checkState.results[curKey] || {};
          if(res.status === 'mismatch'){
            checkState.pendingSave = {
              paramKey: curKey,
              expectedVal: getExpectedValue(curKey, expRaw),
              actualVal: res.actual || ''
            };
            checkState._finishAfterSave = true;
            renderConfirmOverlay();
          } else {
            checkState.showSummary = true;
            render();
          }
        }
        if(action==='check-preset'){
          var pKey = el.dataset.key;
          var pVal = el.dataset.value;
          var pExp = getExpectedValue(pKey, (getCheckRows().find(function(r){ return r[0]===pKey; }) || [])[2] || '');
          var isMatch = normalizeCompareValue(pVal) === normalizeCompareValue(String(pExp));
          checkState.results[pKey] = { actual: pVal, status: isMatch ? 'match' : 'mismatch' };
          updateCheckCardColors(isMatch ? 'match' : 'mismatch');
          render();
        }
        if(action==='check-preset-miss'){
          var pKey2 = el.dataset.key;
          checkState.results[pKey2] = { actual: '—', status: 'mismatch' };
          updateCheckCardColors('mismatch');
          render();
        }
        if(action==='check-color-confirm'){
          const key    = el.dataset.key;
          const status = el.dataset.value;
          checkState.results[key] = { ...(checkState.results[key]||{}), actual: status==='match' ? '✓' : '✕', status };
          updateCheckCardColors(status);
          document.querySelectorAll('.check-color-btn').forEach(b=>{
            b.style.background = '';
            b.style.borderColor = '';
          });
          if(status==='match'){
            el.style.background = 'rgba(34,197,94,.18)';
            el.style.borderColor = 'rgba(34,197,94,.5)';
          } else {
            el.style.background = 'rgba(239,68,68,.18)';
            el.style.borderColor = 'rgba(239,68,68,.5)';
          }
        }
        if(action==='toggle-version' || action==='toggle-history'){
          const body = document.getElementById('version-body-' + value);
          if(body) body.classList.toggle('open');
        }
      });
    });

    /* Login input — Enter to submit */
    const loginEmail = document.getElementById('login-email');
    const loginInp = document.getElementById('login-input');
    if(loginInp){
      (loginEmail || loginInp).focus();
      const onKey = e=>{
        if(e.key === 'Enter') attemptLogin();
        if(e.key === 'Escape'){ auth.showLogin = false; auth.loginError = ''; render(); }
      };
      loginInp.addEventListener('keydown', onKey);
      if(loginEmail) loginEmail.addEventListener('keydown', onKey);
    }

    const inp = document.getElementById('check-actual-input');
    if(inp){
      inp.addEventListener('input', ()=>{
        const rows = getCheckRows();
        const cur  = rows[checkState.stepIndex];
        if(!cur) return;
        const key    = cur[0];
        const expRaw = cur[2];
        const val    = inp.value;
        const exp    = getExpectedValue(key, expRaw);
        const status = val.trim()
          ? (normalizeCompareValue(String(exp))===normalizeCompareValue(val) ? 'match' : 'mismatch')
          : 'pending';
        checkState.results[key] = { ...(checkState.results[key]||{}), actual: val, status };
        updateCheckCardColors(status);
      });
      inp.focus();
      const len = inp.value.length;
      inp.setSelectionRange(len, len);
    }
  }

  function updateCheckCardColors(status){
    const inp = document.getElementById('check-actual-input');
    if(inp){
      const box = inp.closest('.check-val-box');
      if(box){
        box.className = 'check-val-box ' +
          (status==='match'    ? 'status-match'    :
           status==='mismatch' ? 'status-mismatch' :
           status==='saved'    ? 'status-saved'    : 'actual');
      }
    }
    const badge = document.querySelector('.check-status-badge');
    if(badge){
      const labels = { match:'✓ Match', mismatch:'✕ Mismatch', saved:'↑ Opgeslagen', pending:'Wacht…' };
      const cls    = { match:'match',   mismatch:'mismatch',    saved:'saved',         pending:'pending' };
      badge.className = 'check-status-badge ' + (cls[status]||'pending');
      badge.innerHTML = `<span class="check-status-dot"></span>${labels[status]||'Wacht…'}`;
    }
    const btn = document.querySelector('[data-action="check-next"]') ||
                document.querySelector('[data-action="check-finish"]');
    if(btn) btn.dataset.status = status;

    const rows  = getCheckRows();
    const done  = rows.filter(([k]) => {
      const s = (checkState.results[k] && checkState.results[k].status);
      return s && s !== 'pending';
    }).length;
    const total = rows.length;
    const pct   = total ? Math.round(done / total * 100) : 0;
    const fill  = document.querySelector('.check-player-top .player-progress-fill');
    if(fill) fill.style.width = pct + '%';
  }

  window.addEventListener('online', ()=>{
    setSyncStatus('syncing');
    flushSyncQueue().then(()=> pullFromCloud(true)).then(()=> render());
  });
  window.addEventListener('offline', ()=> setSyncStatus('offline'));

  restoreSession();
  render();

  /* Auth-sessie herstellen (ingelogd blijven na refresh) en
     reageren op login/logout in andere tabs. */
  if(sb){
    refreshAuthFromSession().then(()=> render());
    try{
      sb.auth.onAuthStateChange((_event, session)=>{
        if(session && session.user){ auth.role='admin'; auth.email=session.user.email||''; }
        else { auth.role='operator'; auth.email=''; }
        render();
      });
    }catch(e){}
  }

  loadData();

})();
</script>
</body>
</html>
