    const fileInp = document.getElementById('backup-file-input');
    if(imp && fileInp){
      imp.addEventListener('click', ()=> fileInp.click());
      fileInp.addEventListener('change', e=>{
        const f = e.target.files && e.target.files[0];
        if(f) handleBackupFile(f);
      });
    }
  }

  /* ═══════════════════════════════════════
     TOASTS — zichtbare meldingen i.p.v. console.warn
  ═══════════════════════════════════════ */
  function showToast(msg, type){
    try{
      var t = document.createElement('div');
      t.className = 'pally-toast ' + (type || '');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function(){
        t.classList.add('out');
        setTimeout(function(){ t.remove(); }, 350);
      }, 3500);
    }catch(e){}
  }

  /* ═══════════════════════════════════════
     SYNC QUEUE — mislukte writes gaan in een wachtrij
     (localStorage) en worden automatisch opnieuw geprobeerd.
     Geen stille dataverliezen meer.
  ═══════════════════════════════════════ */
  const QUEUE_KEY = 'pally_sync_queue';
  function loadQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){ return []; } }
  function saveQueue(q){ try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){} }
  function enqueue(op){
    const q = loadQueue(); q.push(op); saveQueue(q);
    setSyncStatus('queued');
  }
  let flushing = false;
  async function flushSyncQueue(){
    if(flushing || !sb || !navigator.onLine) return;
    /* Extra slot: alleen admin mag de wachtrij wegschrijven. Een operator
       (of een achtergebleven wachtrij na rolwissel) synct nooit. */
    if(!isAdmin()) return;
    let q = loadQueue();
    if(!q.length) return;
    flushing = true;
    setSyncStatus('syncing');
    const remaining = [];
    let authBlocked = false;
    for(const op of q){
      let ok = false;
      try{
        if(op.t==='value')   ok = await pushSavedValue(op.a, op.b, op.c, true);
        if(op.t==='audit')   ok = await pushAuditEntry(op.a, true);
        if(op.t==='version') ok = await pushVersion(op.a, op.b, true);
      }catch(e){ ok = false; }
      if(!ok) remaining.push(op);
    }
    saveQueue(remaining);
    flushing = false;

    /* Als er nog items vastzitten en de gebruiker niet (meer) is ingelogd,
       is de oorzaak vrijwel zeker dat RLS de schrijfactie blokkeert.
       Vraag dan opnieuw inloggen i.p.v. stil te blijven proberen. */
    if(remaining.length && sb && !isAdmin()){
      authBlocked = true;
    }

    if(remaining.length){
      setSyncStatus('queued');
      if(authBlocked){
        showToast('⚠ ' + remaining.length + ' — ' + t('not_saved_relogin'), 'err');
      }
    } else {
      setSyncStatus('synced');
      if(q.length) showToast(t('sync_all_done'), 'ok');
    }
  }
  setInterval(flushSyncQueue, 30000);

  /* ═══════════════════════════════════════
     SYNC STATUS
  ═══════════════════════════════════════ */
  let syncStatus = 'idle';
  function setSyncStatus(s){
    syncStatus = s;
    const el = document.getElementById('sync-indicator');
    if(!el) return;
    const qn = loadQueue().length;
    const cfg = ({
      idle:    { color:'#475569', label:'·' },
      syncing: { color:'#f59e0b', label:'⟳ Sync…' },
      synced:  { color:'#22c55e', label:'✓ Synced' },
      queued:  { color:'#f59e0b', label:'⟳ ' + qn + ' in wachtrij' },
      offline: { color:'#64748b', label:'⊘ Offline' },
      error:   { color:'#ef4444', label:'! Sync fout' }
    })[s] || {color:'#475569', label:'·'};
    el.style.color = cfg.color;
    el.style.borderColor = cfg.color + '40';
    el.textContent = cfg.label;
  }

  /* Sync diagnose: test elke tabel apart en toon het exacte foutbericht,
     zodat duidelijk is of het probleem RLS, een ontbrekende tabel of een
     kolom-mismatch is. */
  let lastSyncErrorShown = '';
  async function diagnoseSync(){
    if(!sb) return;
    const lines = [];
    for(const t of ['current_values','versions','audit_log']){
      try{
        const { error } = await sb.from(t).select('*').limit(1);
        lines.push(t + ': ' + (error ? 'FOUT — ' + error.message : 'OK'));
      }catch(e){
        lines.push(t + ': FOUT — ' + ((e && e.message) || 'onbekend'));
      }
    }
    showFatal('SYNC DIAGNOSE\n' + lines.join('\n'));
  }

  let lastPullAt = 0;
  let lastPullStr = '—';
  let pullInFlight = null;
  /* throttled pull: slaat een nieuwe pull over als er recent al één was,
     tenzij force=true. Voorkomt dubbele refetch + geflikker bij snel klikken. */
  async function pullFromCloud(force){
    if(!sb){ setSyncStatus(loadQueue().length ? 'queued' : 'offline'); return; }
    if(pullInFlight) return pullInFlight;
    if(!force && (Date.now() - lastPullAt) < 8000) return;
    pullInFlight = doPullFromCloud().finally(()=>{ pullInFlight = null; lastPullAt = Date.now(); });
    return pullInFlight;
  }

  async function doPullFromCloud(){
    if(!sb){ setSyncStatus(loadQueue().length ? 'queued' : 'offline'); return; }
    await flushSyncQueue();
    setSyncStatus('syncing');
    try {
      const [cv, vs, al] = await Promise.all([
        sb.from('current_values').select('*'),
        sb.from('versions').select('*').order('id', { ascending:false }),
        sb.from('audit_log').select('*').order('id', { ascending:false }).limit(500)
      ]);
      if(cv.error) throw cv.error;
      if(vs.error) throw vs.error;
      if(al.error) throw al.error;

      const store = getStore();
      store.currentValues = {};
      (cv.data || []).forEach(row => {
        if(!store.currentValues[row.store_key]) store.currentValues[row.store_key] = {};
        store.currentValues[row.store_key][row.param_key] = row.value;
      });
      store.versions = {};
      (vs.data || []).forEach(row => {
        if(!store.versions[row.store_key]) store.versions[row.store_key] = [];
        store.versions[row.store_key].push({
          v: row.v, ts: row.ts, changes: row.changes, locked: row.locked, vid: row.vid || null
        });
      });
      store.auditLog = (al.data || []).map(row => ({
        ts: row.ts, section: row.section, line: row.line,
        toBiscuit: row.to_biscuit, toFormat: row.to_format,
        param: row.param, old: row.old_value, new_: row.new_value,
        note: row.note || '', action: row.action, changedBy: row.changed_by || ''
      }));

      /* Nog-niet-gesynchroniseerde lokale wijzigingen uit de wachtrij
         opnieuw toepassen, anders zou de pull ze lokaal wissen.
         ALLEEN voor admin — een operator mag nooit oude wachtrij-waarden
         als officiële lokale waarden te zien krijgen. */
      if(isAdmin()){
        loadQueue().forEach(op => {
          if(op.t==='value'){
            if(!store.currentValues[op.a]) store.currentValues[op.a] = {};
            store.currentValues[op.a][op.b] = op.c;
          }
          if(op.t==='audit'){
            store.auditLog.unshift(op.a);
          }
          if(op.t==='version'){
            if(!store.versions[op.a]) store.versions[op.a] = [];
            const arr = store.versions[op.a];
            const i = arr.findIndex(v => v.v === op.b.v);
            if(i >= 0) arr[i] = op.b; else arr.unshift(op.b);
          }
        });
      }

      saveStore(store);
      await loadPhotoRegistry();
      if(isAdmin()) await loadReports();
      if(isAdmin()) await loadTimings();
      lastPullStr = nowStr();
      setSyncStatus(loadQueue().length ? 'queued' : 'synced');
    } catch(err){
      console.warn('[pullFromCloud] failed:', err && err.message);
      const msg = (err && err.message) || 'onbekende fout';
      if(msg !== lastSyncErrorShown){
        lastSyncErrorShown = msg;
        showToast(t('sync_err') + msg, 'err');
        diagnoseSync();
      }
      setSyncStatus(navigator.onLine ? 'error' : 'offline');
    }
  }

  async function pushSavedValue(storeKey, paramKey, value, fromQueue){
    /* Harde gate: alleen admin mag schrijven of in de wachtrij plaatsen. */
    if(!isAdmin()) return false;
    if(!sb){
      if(!fromQueue) enqueue({ t:'value', a:storeKey, b:paramKey, c:String(value) });
      return false;
    }
    try {
      const { error } = await sb.from('current_values').upsert({
        store_key: storeKey, param_key: paramKey, value: String(value),
        updated_at: new Date().toISOString(), updated_by: auth.email || ''
      }, { onConflict: 'store_key,param_key' });
      if(error) throw error;
      return true;
    } catch(err){
      console.warn('[pushSavedValue] failed:', err && err.message);
      if(!fromQueue){
        enqueue({ t:'value', a:storeKey, b:paramKey, c:String(value) });
        showToast(t('not_synced') + ((err && err.message) || '?') + t('will_retry'), 'warn');
      }
      return false;
    }
  }

  async function pushAuditEntry(entry, fromQueue){
    if(!isAdmin()) return false;
    if(!sb){
      if(!fromQueue) enqueue({ t:'audit', a:entry });
      return false;
    }
    try {
      const { error } = await sb.from('audit_log').insert({
        ts: entry.ts, section: entry.section, line: entry.line || '',
        to_biscuit: entry.toBiscuit, to_format: entry.toFormat,
        param: entry.param, old_value: entry.old, new_value: entry.new_,
        note: entry.note || '', action: entry.action, changed_by: entry.changedBy || ''
      });
      if(error) throw error;
      return true;
    } catch(err){
      console.warn('[pushAuditEntry] failed:', err && err.message);
      if(!fromQueue) enqueue({ t:'audit', a:entry });
      return false;
    }
  }

  async function pushVersion(storeKey, version, fromQueue){
    if(!isAdmin()) return false;
    if(!sb){
      if(!fromQueue) enqueue({ t:'version', a:storeKey, b:JSON.parse(JSON.stringify(version)) });
      return false;
    }
    try {
      /* Elke lokaal aangemaakte versie heeft een unieke vid. We matchen op
         vid (niet op v-nummer), zodat een versie van admin A nooit verward
         wordt met die van admin B die toevallig hetzelfde v-nummer koos. */
      let existing = null;
      if(version.vid){
        const { data, error: selErr } = await sb
          .from('versions').select('id,v')
          .eq('store_key', storeKey).eq('vid', version.vid).limit(1);
        if(selErr) throw selErr;
        existing = data;
      }

      if(existing && existing.length){
        const { error } = await sb.from('versions').update({
          ts: version.ts, changes: version.changes, locked: !!version.locked
        }).eq('id', existing[0].id);
        if(error) throw error;
      } else {
        /* Nieuwe versie: bepaal het echte volgende v-nummer uit de cloud
           (MAX(v)+1). Zo overschrijven twee admins die tegelijk opslaan
           elkaars versie niet stilletjes. */
        let vNum = version.v;
        try {
          const { data: maxRows } = await sb
            .from('versions').select('v')
            .eq('store_key', storeKey).order('v', { ascending:false }).limit(1);
          if(maxRows && maxRows.length) vNum = Math.max(version.v, (maxRows[0].v||0) + 1);
        } catch(e){ /* val terug op lokaal v */ }

        const { error } = await sb.from('versions').insert({
          store_key: storeKey, v: vNum, ts: version.ts,
          changes: version.changes, locked: !!version.locked, vid: version.vid || null
        });
        if(error) throw error;

        /* Lokale versie bijwerken zodat verdere changes op hetzelfde
           (nu correcte) nummer landen. */
        if(vNum !== version.v){
          version.v = vNum;
          const st = getStore();
          if(st.versions[storeKey] && st.versions[storeKey][0]) st.versions[storeKey][0].v = vNum;
          saveStore(st);
        }
      }
      return true;
    } catch(err){
      console.warn('[pushVersion] failed:', err && err.message);
      if(!fromQueue) enqueue({ t:'version', a:storeKey, b:JSON.parse(JSON.stringify(version)) });
      return false;
    }
  }

  const formatsForBiscuit = id => { const _b = BISCUITS.find(b=>b.id===id); return _b ? _b.formats || [] : []; };
  const getBiscuitMeta    = id => BISCUITS.find(b=>b.id===id) || null;

  /* Resolves a UI format label to the internal data key.
     E.g. for Thee/Kokos, "4x4" maps to "5x5" in the JSON files. */
  function resolveDataFormat(biscuitId, uiFormat){
    /* Thee/Kokos heeft eigen data onder de key 'theekokos' — nooit samenvoegen
       met Koffiekoek 5x5. Dit is de harde garantie, los van formatMap. */
    if(biscuitId === 'theekokos') return 'theekokos';
    const meta = getBiscuitMeta(biscuitId);
    if(meta && meta.formatMap && meta.formatMap[uiFormat]) return meta.formatMap[uiFormat];

  }
  function buildFlowRows(fromObj, toObj){
    const keys = Array.from(new Set([...Object.keys(fromObj||{}), ...Object.keys(toObj||{})]));
    return keys.map(k => [k, fromObj && fromObj[k] != null ? fromObj[k] : '—', toObj && toObj[k] != null ? toObj[k] : '—']);
  }

  function escapeHtml(v){
    return String(v != null ? v : '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function cleanNumberToken(token){
    let s = String(token).trim();
    if(!s) return s;
    if(!/^[-+]?\d+[\.,]?\d*$/.test(s)) return s;
    const hasComma=s.includes(','), hasDot=s.includes('.');
    const sep = hasComma?',':(hasDot?'.':'');
    let parts = sep ? s.split(sep) : [s];
    let intPart = parts[0].replace(/^0+(\d)/,'$1');
    if(intPart==='') intPart='0';
    if(parts.length===1) return intPart;
    let decPart = parts[1].replace(/0+$/,'');
    if(decPart==='') return intPart;
    return intPart+','+decPart;
  }

  function normalizeDisplayValue(value){
    return String(value != null ? value : '').replace(/\u0392/g,'B')
      .split('/').map(p=>cleanNumberToken(p.trim())).join(' / ');
  }

  function normalizeCompareValue(value){
    return normalizeDisplayValue(value).toLowerCase().replace(/\s+/g,' ').trim();
  }

  const filterRows = (rows, onlyChanges) =>
    onlyChanges ? rows.filter(r=>normalizeCompareValue(r[1])!==normalizeCompareValue(r[2])) : rows;

  const isColorToken = t => Object.prototype.hasOwnProperty.call(COLOR_MAP, String(t).trim().toLowerCase());

  function renderColorDot(token){
    const name = String(token).trim().toLowerCase();
    const color = COLOR_MAP[name];
    if(!color) return '';
    return `<span class="colorDot ${name}" style="background:${color}"></span>`;
  }

  function renderRichValue(value){
    const norm  = normalizeDisplayValue(value);
    const parts = norm.split('/').map(p=>p.trim()).filter(Boolean);
    if(parts.length && parts.every(isColorToken))
      return `<span class="richValue"><span class="colorDots">${parts.map(renderColorDot).join('')}</span></span>`;
    const html = parts.map(p=>
      isColorToken(p) ? renderColorDot(p) : `<span class="richText">${escapeHtml(p)}</span>`
    );
    return `<span class="richValue">${html.join('<span class="richText">/</span>')}</span>`;
  }

    return `<button class="param-num param-num-btn" data-action="open-photo" data-param="${escapeHtml(key)}">${escapeHtml(m[1])}</button><span class="value-key-text">${escapeHtml(m[2])}${dot}</span>`;
  }

     SESSIE-PERSISTENTIE — refresh of vergrendeld tablet
     gooit de sessie niet meer weg.
  ═══════════════════════════════════════ */
  const SESSION_KEY = 'pally_session';
  function persistSession(){
    try{
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        s: {
          appMode: state.appMode,
          stage: state.stage,
          fromBiscuit: state.fromBiscuit, fromFormat: state.fromFormat,
          toBiscuit: state.toBiscuit, toFormat: state.toFormat,
          section: state.section,
          cavannaLine: state.cavannaLine, robertpackLine: state.robertpackLine,
          viewMode: state.viewMode, onlyChanges: state.onlyChanges, stepIndex: state.stepIndex,
          statusChecking: state.statusChecking
        },
        c: {
          active: checkState.active, stepIndex: checkState.stepIndex,
          results: checkState.results, showSummary: checkState.showSummary,
          tab: checkState.tab, onlyChanges: checkState.onlyChanges,
          statusParam: checkState.statusParam
        }
      }));
    }catch(e){}
  }
  function restoreSession(){
    try{
      const raw = sessionStorage.getItem(SESSION_KEY);
      if(!raw) return;
      const d = JSON.parse(raw);
      if(d && d.s) Object.assign(state, d.s);
      if(d && d.c) Object.assign(checkState, d.c);
      checkState.pendingSave = null;
    }catch(e){}
  }

  function loadStore(){ try{ return JSON.parse(localStorage.getItem('pally_store')||'{}'); }catch(e){return {};} }
  function saveStore(s){ try{ localStorage.setItem('pally_store', JSON.stringify(s)); }catch(e){} }

  function getStore(){
    const s = loadStore();
    if(!s.versions) s.versions = {};
    if(!s.auditLog) s.auditLog = [];
    if(!s.currentValues) s.currentValues = {};
    return s;
  }

  function buildStoreKey(){
    const line = state.section==='cavanna' ? state.cavannaLine :
                 state.section==='robertpack' ? state.robertpackLine : '';
    return `${state.section}|${state.toBiscuit}|${state.toFormat}|${line}`;
  }

  function nowStr(){ return new Date().toLocaleString('nl-NL',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

  /* ═══════════════════════════════════════
     FOTO'S PER PARAMETER
     Een foto hoort bij sectie + parameter (bv. "dozen|3 Luchtverdeler"),
     NIET bij het volledige store-key — want de foto toont wáár op de machine
     je iets verstelt, en dat is hetzelfde ongeacht naar welk product je
     omschakelt. Opslag in Supabase Storage (bucket 'param-photos');
     een registry-tabel ('param_photos') houdt bij welke params een foto
     hebben zodat we niet elke keer de hele storage hoeven te listen.
  ═══════════════════════════════════════ */
  /* TODO (productie / officiële company deployment):
     Het 'param-photos' bucket is nu PUBLIEK leesbaar (publicUrl). Voor een
     officiële uitrol bij Pally → maak het bucket PRIVATE en gebruik
     createSignedUrl() met een korte vervaltijd i.p.v. getPublicUrl().
     Dan zijn foto's/video's alleen zichtbaar voor wie de app gebruikt,
     niet voor iedereen met de URL. Schrijven blijft hoe dan ook admin-only
     via RLS. */
  const PHOTO_BUCKET = 'param-photos';
  let photoRegistry = {};   // { "section|param": { url, updated_at, by } }

  function photoKey(param){
    return `${state.section}|${param}`;
  }
  function photoPath(param, ext){
    /* veilige bestandsnaam: alleen letters/cijfers, rest -> _ */
    const safe = `${state.section}__${param}`.replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    return `${state.section}/${safe}.${ext || 'jpg'}`;
  }
  function hasPhoto(param){
    return !!(photoRegistry[photoKey(param)] && photoRegistry[photoKey(param)].url);
  }
  function getPhoto(param){
    return photoRegistry[photoKey(param)] || null;
  }

  async function loadPhotoRegistry(){
    if(!sb) return;
    try{
      const { data, error } = await sb.from('param_photos').select('*');
      if(error) throw error;
      const reg = {};
      (data||[]).forEach(row=>{
        reg[row.pkey] = {
          url: row.url, updated_at: row.updated_at, by: row.updated_by || '',
          mediaType: row.media_type || 'image', path: row.path || ''
        };
      });
      photoRegistry = reg;
    }catch(err){
      console.warn('[loadPhotoRegistry] failed:', err && err.message);
    }
  }

  async function loadData(){
    try{
      const entries = await Promise.all(
        Object.entries(FILES).map(async([key,path])=>{
          const res = await fetch(path,{cache:'no-store'});
          if(!res.ok) throw new Error('Failed: '+path);
          return [key, await res.json()];
        })
      );
      state.data = Object.fromEntries(entries);
    } catch(err){
      state.error = err.message||'Failed to load data.';
    } finally{
      state.loading = false;
      render();
      pullFromCloud(true).then(()=> render());
    }
  }

  function setState(patch){ Object.assign(state,patch); render(); }

  function resetAll(){
    Object.assign(state,{
      appMode:null,
      stage:1, fromBiscuit:null, fromFormat:null,
      toBiscuit:null, toFormat:null, section:null,
      cavannaLine:'9', robertpackLine:'9',
      viewMode:null, onlyChanges:true, stepIndex:0,
      statusChecking:false
    });
    checkState.active = false; checkState.stepIndex = 0; checkState.results = {}; checkState.tab = 'check';
    checkState.showSummary = false; checkState.pendingSave = null;
    render();
  }

  function getRobertPackValuesForFormat(format,col){
    var rp = state.data && state.data.robertpack;
    var byFormat = rp && rp.values && rp.values[format] ? rp.values[format] : {};
    return (byFormat[col]) || {};
  }

  /* FIX: opgeslagen waarden (uit Check Mode / cloud) worden nu óók
     toegepast op de "Nieuw"-kolom in de gewone weergave, zodat
     operators altijd de geldende waarde zien — niet de verouderde
     JSON-waarde. */
  function applySavedValues(rows){
    if(!state.section || !state.toBiscuit || !state.toFormat) return rows;
    const store = getStore();
    const sk = buildStoreKey();
    const cv = store.currentValues && store.currentValues[sk];
    if(!cv) return rows;
    return rows.map(r => (cv[r[0]] != null && cv[r[0]] !== '') ? [r[0], r[1], cv[r[0]]] : r);
  }

  function getRows(){
    if(!state.data) return [];
    const fromKey = resolveDataFormat(state.fromBiscuit, state.fromFormat);
    const toKey   = resolveDataFormat(state.toBiscuit,   state.toFormat);
    if(state.section==='cavanna'){
      const src = state.cavannaLine==='10' ? state.data.cavanna10 : state.data.cavanna9;
      return applySavedValues(buildFlowRows((src && src.values && src.values[fromKey])||{}, (src && src.values && src.values[toKey])||{}));
    }
    if(state.section==='robertpack')
      return applySavedValues(buildFlowRows(
        getRobertPackValuesForFormat(fromKey, state.robertpackLine),
        getRobertPackValuesForFormat(toKey,   state.robertpackLine)
      ));
    if(state.section==='dozen')
      return applySavedValues(buildFlowRows((state.data.dozen && state.data.dozen.values && state.data.dozen.values[fromKey] || {}), (state.data.dozen && state.data.dozen.values && state.data.dozen.values[toKey] || {})));
    if(state.section==='dekselaar')
      return applySavedValues(buildFlowRows((state.data.dekselaar && state.data.dekselaar.values && state.data.dekselaar.values[fromKey] || {}), (state.data.dekselaar && state.data.dekselaar.values && state.data.dekselaar.values[toKey] || {})));
    return [];
  }

  /* Check Mode respecteert nu ook het Alles/Wijzigingen-filter.
     In Status-modus zijn het enkele-waarde-rijen (geen Van→Naar, geen
     wijzigingen-filter want er is geen "oude" waarde om mee te vergelijken). */
  function getCheckRows(){
    if(state.appMode==='status'){
      const rows = getStatusRows();
      if(checkState.statusParam){
        const only = rows.filter(r => r[0] === checkState.statusParam);
        if(only.length) return only;
      }
      return rows;
    }
    return filterRows(getRows(), checkState.onlyChanges);
  }

  /* STATUS-MODUS: één waarde per parameter (de geldende waarde) voor
     het gekozen product+formaat+sectie — zonder Van→Naar.
     Rijvorm [param, '', huidigeWaarde] zodat dezelfde renderers/check
     werken; kolom 2 (oud) blijft leeg. */
  function getStatusBaseValues(){
    if(!state.data) return {};
    const key = resolveDataFormat(state.toBiscuit, state.toFormat);
    if(state.section==='cavanna'){
      const src = state.cavannaLine==='10' ? state.data.cavanna10 : state.data.cavanna9;
      return (src && src.values && src.values[key]) || {};
    }
    if(state.section==='robertpack')
      return getRobertPackValuesForFormat(key, state.robertpackLine);
    if(state.section==='dozen')
      return (state.data.dozen && state.data.dozen.values && state.data.dozen.values[key]) || {};
    if(state.section==='dekselaar')
      return (state.data.dekselaar && state.data.dekselaar.values && state.data.dekselaar.values[key]) || {};
    return {};
  }

  function getStatusRows(){  const base = getStatusBaseValues();
    const store = getStore();
    const sk = buildStoreKey();
    const cv = (store.currentValues && store.currentValues[sk]) || {};
    return Object.keys(base).map(k => {
      const val = (cv[k] != null && cv[k] !== '') ? cv[k] : base[k];
      return [k, '', val];
    });
  }

  function getExpectedValue(paramKey, originalExpected){
    const store = getStore();
    const sk = buildStoreKey();
    const cv = store.currentValues && store.currentValues[sk];
    return (cv && cv[paramKey]) || originalExpected;
  }

  /* ── FOTO OVERLAY ── */
  let photoOverlayParam = null;

  function openPhoto(param){
    photoOverlayParam = param;
    renderPhotoOverlay();
  }
  function closePhoto(){
    photoOverlayParam = null;
    const el = document.getElementById('photo-overlay');
    if(el) el.remove();
  }

  function renderPhotoOverlay(){
    const existing = document.getElementById('photo-overlay');
    if(existing) existing.remove();
    if(!photoOverlayParam) return;

    const param = photoOverlayParam;
    const photo = getPhoto(param);
    const admin = isAdmin();

    let inner;
    if(photo && photo.url){
      const isVideo = photo.mediaType === 'video';
      const media = isVideo
        ? `<video class="photo-img" src="${escapeHtml(photo.url)}" controls playsinline preload="metadata"></video>`
        : `<img class="photo-img" src="${escapeHtml(photo.url)}" alt="${escapeHtml(param)}">`;
      inner = `
        ${media}
        <div class="photo-meta">${isVideo?'🎬':'📷'} ${photo.updated_at?escapeHtml(photo.updated_at):''}${photo.by?(' · '+escapeHtml(photo.by)):''}</div>
        ${admin ? `<div class="photo-actions">
          <button class="btn-ghost" data-action="photo-upload-img" data-param="${escapeHtml(param)}">📷 ${t('photo_replace')}</button>
          <button class="btn-ghost" data-action="photo-upload-vid" data-param="${escapeHtml(param)}">🎬 ${t('photo_replace_vid')}</button>
          <button class="btn-ghost photo-del" data-action="photo-delete" data-param="${escapeHtml(param)}">${t('photo_delete')}</button>
        </div>` : ''}`;
    } else {
      inner = admin
        ? `<div class="photo-empty">${t('photo_none')}</div>
           <div class="photo-actions">
             <button class="btn-primary" data-action="photo-upload-img" data-param="${escapeHtml(param)}">${t('photo_add')}</button>
             <button class="btn-ghost" data-action="photo-upload-vid" data-param="${escapeHtml(param)}">${t('photo_add_vid')}</button>
           </div>`
        : `<div class="photo-empty">${t('photo_none_operator')}</div>`;
    }

    const div = document.createElement('div');
    div.className = 'photo-overlay';
    div.id = 'photo-overlay';
    div.innerHTML = `
      <div class="photo-box">
        <div class="photo-header">
          <span class="photo-title">📷 ${escapeHtml(param)}</span>
          <button class="photo-close" data-action="photo-close" aria-label="${t('close')}">✕</button>
        </div>
        <div class="photo-body" id="photo-body">${inner}</div>
        <input type="file" id="photo-file-input" accept="image/*" capture="environment" style="display:none">
        <input type="file" id="video-file-input" accept="video/*" capture="environment" style="display:none">
      </div>`;
    document.body.appendChild(div);

    div.addEventListener('click', e=>{ if(e.target===div) closePhoto(); });
    div.querySelectorAll('[data-action]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const a = el.dataset.action, p = el.dataset.param;
        if(a==='photo-close') closePhoto();
        if(a==='photo-upload-img') triggerPick('photo-file-input');
        if(a==='photo-upload-vid') triggerPick('video-file-input');
        if(a==='photo-delete') deletePhoto(p);
      });
    });
    const imgInput = document.getElementById('photo-file-input');
    if(imgInput){
      imgInput.addEventListener('change', e=>{
        const f = e.target.files && e.target.files[0];
        if(f) uploadMedia(photoOverlayParam, f, 'image');
      });
    }
    const vidInput = document.getElementById('video-file-input');
    if(vidInput){
      vidInput.addEventListener('change', e=>{
        const f = e.target.files && e.target.files[0];
        if(f) uploadMedia(photoOverlayParam, f, 'video');
      });
    }
  }

  function triggerPick(id){
    const inp = document.getElementById(id);
    if(inp) inp.click();
  }

  const MAX_VIDEO_MB = 50;
  const MAX_IMAGE_MB = 10;

  async function uploadMedia(param, file, kind){
    if(!requireAdmin(t('photo_admin_only'))) return;
    if(!sb){ showToast(t('photo_need_cloud'), 'err'); return; }

    const isVideo = kind === 'video';
    const limitMB = isVideo ? MAX_VIDEO_MB : MAX_IMAGE_MB;
    if(file.size > limitMB * 1024 * 1024){
      showToast(t('media_too_big', { n: limitMB }), 'err');
      return;
    }

    const body = document.getElementById('photo-body');
    if(body) body.innerHTML = `<div class="photo-empty">${t('photo_uploading')}</div>`;
    try{
      /* extensie uit het bestand halen; bij video val terug op mp4, bij foto jpg */
      let ext = (file.name.split('.').pop() || '').toLowerCase();
      if(!/^[a-z0-9]{2,4}$/.test(ext)) ext = isVideo ? 'mp4' : 'jpg';
      const path = photoPath(param, ext);
      const pkey = photoKey(param);

      /* oude media (mogelijk andere extensie) opruimen zodat er niet
         tegelijk een oude foto én een nieuwe video blijft staan */
      const old = photoRegistry[pkey];
      if(old && old.path && old.path !== path){
        try{ await sb.storage.from(PHOTO_BUCKET).remove([old.path]); }catch(e){}
      }

      const { error: upErr } = await sb.storage.from(PHOTO_BUCKET)
        .upload(path, file, { upsert:true, contentType: file.type || (isVideo?'video/mp4':'image/jpeg') });
      if(upErr) throw upErr;

      const { data: pub } = sb.storage.from(PHOTO_BUCKET).getPublicUrl(path);
      const url = (pub && pub.publicUrl) ? pub.publicUrl : '';

      const { error: regErr } = await sb.from('param_photos').upsert({
        pkey, section: state.section, param, url, path,
        media_type: isVideo ? 'video' : 'image',
        updated_at: nowStr(), updated_by: auth.email || ''
      }, { onConflict: 'pkey' });
      if(regErr) throw regErr;

      /* cache-buster zodat vervangen media direct ververst */
      photoRegistry[pkey] = {
        url: url + '?t=' + Date.now(), updated_at: nowStr(), by: auth.email || '',
        mediaType: isVideo ? 'video' : 'image', path
      };
      showToast(t('photo_saved'), 'ok');
      renderPhotoOverlay();
      render();
    }catch(err){
      console.warn('[uploadMedia] failed:', err && err.message);
      showToast(t('photo_fail') + ((err && err.message) || ''), 'err');
      renderPhotoOverlay();
    }
  }

  async function deletePhoto(param){
    if(!requireAdmin(t('photo_admin_only'))) return;
    if(!sb) return;
    try{
      const rec = photoRegistry[photoKey(param)];
      const path = (rec && rec.path) ? rec.path : photoPath(param);
      await sb.storage.from(PHOTO_BUCKET).remove([path]);
      await sb.from('param_photos').delete().eq('pkey', photoKey(param));
      delete photoRegistry[photoKey(param)];
      showToast(t('photo_deleted'), 'ok');
      renderPhotoOverlay();
      render();
    }catch(err){
      console.warn('[deletePhoto] failed:', err && err.message);
      showToast(t('photo_fail') + ((err && err.message) || ''), 'err');
    }
  }

  function openCheckMode(){
    /* Check & Verify is uitsluitend voor admin. Een operator wordt naar de
       login geleid en kan niets checken of opslaan. */
    if(!isAdmin()){
      auth.showLogin = true;
      auth.loginError = '';
      render();
      showToast(t('login_admin_check'), 'warn');
      return;
    }
    checkState.active = true;
    checkState.stepIndex = 0;
    checkState.results = {};
    checkState.showSummary = false;
    checkState.pendingSave = null;
    checkState._finishAfterSave = false;
    checkState.statusParam = null;   /* hele lijst checken */
    pullFromCloud(true).then(()=> render());
    render();
  }

  /* Status-modus: Check Mode openen gericht op één parameter — admin-only. */
  function openStatusCheck(paramKey){
    if(!isAdmin()){
      auth.showLogin = true;
      auth.loginError = '';
      render();
      showToast(t('login_admin_check'), 'warn');
      return;
    }
    checkState.active = true;
    checkState.stepIndex = 0;
    checkState.results = {};
    checkState.showSummary = false;
    checkState.pendingSave = null;
    checkState._finishAfterSave = false;
    checkState.statusParam = paramKey || null;
    pullFromCloud(true).then(()=> render());
    render();
  }

  function closeCheckMode(){
    checkState.active = false;
    checkState.showSummary = false;
    checkState.pendingSave = null;
    checkState.statusParam = null;
    render();
  }

  function advanceCheck(){
    checkState.pendingSave = null;
    if(checkState._finishAfterSave){
      checkState._finishAfterSave = false;
      checkState.showSummary = true;
      render();
      return;
    }
    const rows = getCheckRows();
    if(checkState.stepIndex < rows.length - 1){
      checkState.stepIndex++;
      render();
    } else {
      checkState.showSummary = true;
      render();
    }
  }

  /* Gedeelde opslag-logica voor Check Mode én versie-herstel:
     schrijft currentValues + audit + versie, en synct met wachtrij. */
  /* Placeholder-waarden mogen NOOIT als officiële waarde worden opgeslagen.
     Dit zijn UI-symbolen (mismatch-kruis, streepje, vinkje) of lege tekst —
     geen echte machine-instelling. Beschermt de data-integriteit. */
  function isPlaceholderValue(v){
    const s = String(v == null ? '' : v).trim();
    if(s === '') return true;
    /* losse symbolen of pijl/streepjes zonder inhoud */
    if(/^[✕✔✓×—–\-→·]+$/.test(s)) return true;
    return false;
  }

  function persistValueChange(paramKey, oldVal, newVal, note){
    if(!requireAdmin()) return;
    if(isPlaceholderValue(newVal)){
      showToast(t('save_placeholder_blocked'), 'warn');
      return;
    }
    const store = getStore();
    const sk = buildStoreKey();

    if(!store.currentValues[sk]) store.currentValues[sk] = {};
    store.currentValues[sk][paramKey] = String(newVal);

    const auditEntry = {
      ts: nowStr(),
      section: getSectionTitle(state.section),
      line: state.section==='cavanna'?state.cavannaLine:state.section==='robertpack'?state.robertpackLine:'',
      toBiscuit: biscuitLabel(state.toBiscuit), toFormat: state.toFormat,
      param: paramKey,
      old: normalizeDisplayValue(String(oldVal)),
      new_: normalizeDisplayValue(String(newVal)),
      note: note || '', action: 'saved',
      changedBy: auth.email || ''
    };
    store.auditLog.unshift(auditEntry);

    if(!store.versions[sk]) store.versions[sk] = [];
    const last = store.versions[sk][0];
    const changeEntry = {
      param: paramKey,
      old: normalizeDisplayValue(String(oldVal)),
      new_: normalizeDisplayValue(String(newVal)),
      note: note || ''
    };
    let versionToPush;
    if(!last || last.locked){
      versionToPush = { v:(store.versions[sk].length+1), ts:nowStr(), changes:[changeEntry], locked:false, vid: (Date.now().toString(36)+Math.random().toString(36).slice(2,8)) };
      store.versions[sk].unshift(versionToPush);
    } else {
      const idx = last.changes.findIndex(c=>c.param===paramKey);
      if(idx>=0) last.changes[idx]=changeEntry; else last.changes.push(changeEntry);
      last.ts = nowStr();
      versionToPush = last;
    }
    saveStore(store);

    setSyncStatus('syncing');
    Promise.all([
      pushSavedValue(sk, paramKey, newVal),
      pushAuditEntry(auditEntry),
      pushVersion(sk, versionToPush)
    ]).then(results => {
      if(results.every(r=>r)) setSyncStatus('synced');
      else setSyncStatus(loadQueue().length ? 'queued' : (navigator.onLine ? 'error' : 'offline'));
    }).catch(()=>{
      setSyncStatus(loadQueue().length ? 'queued' : (navigator.onLine ? 'error' : 'offline'));
    });
  }

  function confirmSave(){
    const p = checkState.pendingSave;
    if(!p) return;

    /* Opslaan van een nieuwe geldende waarde vereist admin */
    if(!requireAdmin(t('login_admin_save'))) return;

    const noteEl = document.getElementById('confirm-note');
    const note = noteEl ? noteEl.value.trim() : '';

    persistValueChange(p.paramKey, p.expectedVal, p.actualVal, note);

    checkState.results[p.paramKey] = { status:'saved', actual:p.actualVal };
    removeConfirmOverlay();

    const finishAfter = checkState._finishAfterSave;
    checkState._finishAfterSave = false;

    if(finishAfter){ checkState.showSummary = true; render(); }
    else { advanceCheck(); }
  }

  function confirmSkip(){
    const p = checkState.pendingSave;
    if(!p) return;
    const noteEl = document.getElementById('confirm-note');
    const note = noteEl ? noteEl.value.trim() : '';
    checkState.results[p.paramKey] = { status:'mismatch', actual:p.actualVal, note: note };
    removeConfirmOverlay();
    const finishAfter = checkState._finishAfterSave;
    checkState._finishAfterSave = false;
    if(finishAfter){ checkState.showSummary = true; render(); }
    else { advanceCheck(); }
  }

  function renderConfirmOverlay(){
    const p = checkState.pendingSave;
    if(!p) return;
    /* Dit overlay hoort alleen bij admin (Check Mode is admin-only). De
       isAdmin-check is een extra vangnet; operators komen hier nooit. */
    if(!isAdmin()){ removeConfirmOverlay(); return; }
    const existing = document.getElementById('check-confirm-overlay');
    if(existing) existing.remove();
    const div = document.createElement('div');
    div.className = 'check-confirm-overlay';
    div.id = 'check-confirm-overlay';
    div.innerHTML = `
      <div class="check-confirm-box">
        <div class="check-confirm-title">${t('val_differs')}</div>
        <div class="check-confirm-body">${t('val_differs_body')}</div>
        <div class="check-confirm-vals">
          <span class="check-confirm-val old">${escapeHtml(normalizeDisplayValue(String(p.expectedVal)))}</span>
          <span class="check-confirm-arr">→</span>
          <span class="check-confirm-val new">${escapeHtml(normalizeDisplayValue(String(p.actualVal)))}</span>
        </div>
        <textarea class="confirm-note" id="confirm-note" placeholder="${t('note_ph')}"></textarea>
        <div class="check-confirm-actions">
          <button class="btn-confirm-save" id="confirm-save-btn">${t('save_as_new')}</button>
          <button class="btn-confirm-skip" id="confirm-skip-btn">${t('no_continue')}</button>
        </div>
      </div>`;
    document.body.appendChild(div);
    const saveEl = document.getElementById('confirm-save-btn');
    if(saveEl) saveEl.addEventListener('click', confirmSave);
    document.getElementById('confirm-skip-btn').addEventListener('click', confirmSkip);
  }

  function removeConfirmOverlay(){  const el = document.getElementById('check-confirm-overlay');
    if(el) el.remove();
  }

  /* Versie-herstel: zet een parameter terug naar een eerdere waarde */
  function restoreParam(paramKey, oldValue){
    if(!requireAdmin(t('login_admin_restore'))) return;
    const rows = state.appMode==='status' ? getStatusRows() : getRows();
    const row  = rows.find(r => r[0] === paramKey);
    const currentVal = row ? getExpectedValue(paramKey, row[2]) : '—';
    persistValueChange(paramKey, currentVal, oldValue, t('restored_note'));
    showToast('↩ ' + paramKey + ' ' + t('restored_to') + ' ' + normalizeDisplayValue(String(oldValue)), 'ok');
    render();
  }

  async function commitAndClose(){
    if(!requireAdmin()){ closeCheckMode(); return; }
    const store = getStore();
    const sk = buildStoreKey();
    if((store.versions[sk] && store.versions[sk][0]) && !store.versions[sk][0].locked){
      store.versions[sk][0].locked = true;
      saveStore(store);
      setSyncStatus('syncing');
      const ok = await pushVersion(sk, store.versions[sk][0]);
      setSyncStatus(ok ? 'synced' : (loadQueue().length ? 'queued' : (navigator.onLine ? 'error' : 'offline')));
    }
    closeCheckMode();
  }

  function renderChipGroup(items, value, onClick, formatter=x=>x){
    return `<div class="chipRow">${items.map(item=>`
      <button class="chip${value===item?' active':''}" data-action="${onClick}" data-value="${item}">
        <span class="chipInner">${formatter(item)}</span>
      </button>`).join('')}</div>`;
  }

  /* Laatste wijzigingsdatum van een parameter (uit audit log) voor de
     huidige combinatie — geeft '' als de waarde nooit is aangepast.
     Bouwt vertrouwen: de operator ziet of een waarde vers is of oud. */
  function getLastChanged(paramKey){

                : `<button class="status-check-btn report-btn" data-action="report-value" data-param="${escapeHtml(r[0])}" data-current="${escapeHtml(normalizeDisplayValue(String(r[2])))}" title="${t('report_hint')}">${t('report_btn')}</button>`}

  function detectPresetType(expectedVal) {
    var norm = normalizeCompareValue(String(expectedVal));
    if(norm === '-' || norm === '—') return { type:'dash', options:null };
    if(norm === 'ja' || norm === 'nee') return { type:'yn', options:['JA','NEE'] };
    if(norm === 'open' || norm === 'dicht') return { type:'preset', options:['OPEN','DICHT'] };
    if(norm === 'a' || norm === 'b') return { type:'preset', options:['A','B'] };
    if(/^x\d+$/.test(norm)) return { type:'preset', options:['x1','x2','x3','x4','x5','x6','x7','x8'] };
    if(norm === 'uit' || norm === 'in') return { type:'preset', options:['uit','in'] };
    if(/gat$/.test(norm)) return { type:'preset', options:['1ste gat','4de gat'] };
    if(/^nr\.\d+\s*-\s*\d+x$/.test(norm)) return { type:'racetrack', options:null };
    if(norm.indexOf('->') >= 0 || norm.indexOf('<-') >= 0 || /^[x\d\-]+/.test(norm)) {
      if(norm.length > 8) return { type:'sequence', options:null };
    }
    if(norm.length > 20 && !/^[-+]?[\d,./]+$/.test(norm)) return { type:'freetext', options:null };
    return null;
  }

  function buildActualArea(colorMode, boxClass, liveStatus, curKey, actualVal, expectedVal){
    if(colorMode){
      var matchSt    = liveStatus==='match'    ? 'background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.5);' : '';
      var mismatchSt = liveStatus==='mismatch' ? 'background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.5);' : '';
      return '<div class="check-val-box color-confirm ' + boxClass + '" style="flex-direction:column;gap:12px;padding:20px;">'
        + '<div style="font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px">' + t('machine_ok_q') + '</div>'
        + '<div style="display:flex;gap:10px;width:100%">'
        + '<button class="check-color-btn match" data-action="check-color-confirm" data-key="' + escapeHtml(curKey) + '" data-value="match" style="' + matchSt + '">' + t('yes_ok') + '</button>'
        + '<button class="check-color-btn miss"  data-action="check-color-confirm" data-key="' + escapeHtml(curKey) + '" data-value="mismatch" style="' + mismatchSt + '">' + t('no_dev') + '</button>'
        + '</div></div>';
    }

    var preset = detectPresetType(expectedVal);

    if(preset && preset.type === 'dash') {
      var matchSt0 = liveStatus==='match' ? 'selected-match' : '';
      return '<div class="check-val-lbl" style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">' + t('na') + '</div>'
        + '<div class="seq-confirm">'
        + '<button class="preset-btn ' + matchSt0 + '" data-action="check-preset" data-key="' + escapeHtml(curKey) + '" data-value="-" style="font-size:13px;padding:12px 10px;">' + t('na_confirm') + '</button>'
        + '</div>';
    }

    if(preset && preset.type !== 'sequence' && preset.type !== 'racetrack' && preset.type !== 'freetext' && preset.options) {
      var normExp  = normalizeCompareValue(String(expectedVal));
      var btns = preset.options.map(function(opt) {
        var normOpt = normalizeCompareValue(opt);
        var isExp = normOpt === normExp;
        var isSel = liveStatus === 'match' && normalizeCompareValue(actualVal || String(expectedVal)) === normOpt;
        var isMiss = liveStatus === 'mismatch' && normalizeCompareValue(actualVal) === normOpt;
        var cls = isSel ? 'selected-match' : (isMiss ? 'selected-miss' : '');
        return '<button class="preset-btn ' + cls + '" data-action="check-preset" data-key="' + escapeHtml(curKey) + '" data-value="' + escapeHtml(opt) + '">'
          + escapeHtml(opt)
          + (isExp ? '<span style="display:block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-top:3px;">verwacht</span>' : '')
          + '</button>';
      }).join('');
      return '<div class="check-val-lbl" style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">' + t('select_value') + '</div>'
        + '<div class="preset-grid">' + btns + '</div>';
    }

    if(preset && (preset.type === 'racetrack' || preset.type === 'freetext')) {
      var matchSt2 = liveStatus==='match'    ? 'selected-match' : '';
      var missSt2  = liveStatus==='mismatch' ? 'selected-miss'  : '';
      return '<div class="check-val-lbl" style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">' + t('check_on_machine') + '</div>'
        + '<div class="seq-display">' + escapeHtml(normalizeDisplayValue(String(expectedVal))) + '</div>'
        + '<div class="seq-confirm">'
        + '<button class="preset-btn ' + matchSt2 + '" data-action="check-preset" data-key="' + escapeHtml(curKey) + '" data-value="' + escapeHtml(String(expectedVal)) + '" style="font-size:13px;padding:12px 10px;">' + t('value_ok') + '</button>'
        + '<button class="preset-btn ' + missSt2  + '" data-action="check-preset-miss" data-key="' + escapeHtml(curKey) + '" style="font-size:13px;padding:12px 10px;">' + t('deviation') + '</button>'
        + '</div>';
    }

    if(preset && preset.type === 'sequence') {
      var matchSt3 = liveStatus==='match'    ? 'selected-match' : '';
      var missSt3  = liveStatus==='mismatch' ? 'selected-miss'  : '';
      var dispVal  = normalizeDisplayValue(String(expectedVal));
      return '<div class="check-val-lbl" style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">' + t('check_order') + '</div>'
        + '<div class="seq-display" style="font-size:15px;letter-spacing:.12em;">' + escapeHtml(dispVal) + '</div>'
        + '<div class="seq-confirm">'
        + '<button class="preset-btn ' + matchSt3 + '" data-action="check-preset" data-key="' + escapeHtml(curKey) + '" data-value="' + escapeHtml(String(expectedVal)) + '" style="font-size:13px;padding:12px 10px;">' + t('order_ok') + '</button>'
        + '<button class="preset-btn ' + missSt3  + '" data-action="check-preset-miss" data-key="' + escapeHtml(curKey) + '" style="font-size:13px;padding:12px 10px;">' + t('deviation') + '</button>'
        + '</div>';
    }

    /* Vrij invoerveld — numeriek toetsenbord als de verwachte waarde numeriek is */
    var isNumeric = /^[\s\d.,\/+-]+$/.test(normalizeDisplayValue(String(expectedVal)));
    return '<div class="check-val-box ' + boxClass + '">'
      + '<input class="check-input" id="check-actual-input"'
      + ' placeholder="Voer waarde in\u2026"'
      + ' value="' + escapeHtml(actualVal) + '"'
      + ' type="text" inputmode="' + (isNumeric ? 'decimal' : 'text') + '" autocomplete="off"'
      + ' data-param="' + escapeHtml(curKey) + '"'
      + ' data-expected="' + escapeHtml(String(expectedVal)) + '">'
      + '</div>';
  }

  function renderCheckMode(checkRows){
    const total = checkRows.length;
    const isStatus = state.appMode==='status';

    /* Alles/Wijzigingen-filter — alleen in Ombouw-modus.
       In Status-modus is er geen "oude" waarde, dus geen filter. */
    const checkToggle = isStatus
      ? `<div class="mode-bar" style="margin-bottom:14px">
           <span style="font-family:var(--mono);font-size:11px;color:#06b6d4">≡ Status-check${checkState.statusParam?' · '+escapeHtml(checkState.statusParam):''}</span>
           <span style="font-family:var(--mono);font-size:11px;color:var(--text-3)">${total} ${total!==1?t('params_count'):t('param_count')}</span>
         </div>`
      : `<div class="mode-bar" style="margin-bottom:14px">
        <div class="mode-pills">
          <button class="mode-btn${!checkState.onlyChanges?' active':''}" data-action="check-show-mode" data-value="all">${t('all')}</button>
          <button class="mode-btn${checkState.onlyChanges?' active':''}" data-action="check-show-mode" data-value="changes">${t('changes')}</button>
        </div>
        <span style="font-family:var(--mono);font-size:11px;color:var(--text-3)">${total} ${total!==1?t('params_count'):t('param_count')}</span>
      </div>`;

    if(!total){
      const secData  = state.section==='cavanna' ? (state.data && state.data.cavanna9) :
                       state.section==='robertpack' ? (state.data && state.data.robertpack) :
                       state.section==='dozen' ? (state.data && state.data.dozen) :
                       (state.data && state.data.dekselaar);
      const fmtKeys  = (secData && secData.values) ? Object.keys(secData.values) : [];
      return checkToggle + `<div class="emptyNote">
        ${isStatus ? t('no_params') : (checkState.onlyChanges ? t('no_changes_switch') : t('no_params'))}<br>
        <span style="font-size:10px;margin-top:8px;display:block">
          Sectie: ${state.section} · Format: ${state.toFormat}<br>
          ${t('param_count_avail')} ${fmtKeys.join(', ')||'—'}
        </span>
      </div>`;
    }

    if(checkState.showSummary) return renderCheckSummary(checkRows);

    if(checkState.stepIndex >= total) checkState.stepIndex = 0;

    const done  = checkRows.filter(r=>(checkState.results[r[0]] && checkState.results[r[0]].status) && (checkState.results[r[0]] && checkState.results[r[0]].status)!=='pending').length;
    const pct   = Math.round(done/total*100);

    const statusGlyph = s => s==='match'?'✓':s==='mismatch'?'✕':s==='saved'?'↑':'·';

    const miniList = checkRows.map(([key],i)=>{
      const s = (checkState.results[key] && checkState.results[key].status) || 'pending';
      return `
        <button class="check-mini-row${i===checkState.stepIndex?' active':''}" data-action="check-jump" data-value="${i}">
          <span class="check-mini-num">${String(i+1).padStart(2,'0')}</span>
          <span class="check-mini-key">${escapeHtml(key)}</span>
          <span class="check-mini-status ${s}">${statusGlyph(s)}</span>
        </button>`;
    }).join('');

    const cur = checkRows[checkState.stepIndex];
    if(!cur) return checkToggle + `<div class="emptyNote">${t('no_params')}</div>`;
    const [curKey, , curExpRaw] = cur;

    const curResult  = checkState.results[curKey] || {};
    const expectedVal= getExpectedValue(curKey, curExpRaw);
    const actualVal  = curResult.actual || '';
    const isLast     = checkState.stepIndex >= total-1;

    const liveStatus = curResult.status || (
      actualVal.trim()
        ? (normalizeCompareValue(String(expectedVal))===normalizeCompareValue(actualVal) ? 'match' : 'mismatch')
        : 'pending'
    );

    const isColorValue = v => {
      const norm  = normalizeDisplayValue(String(v));
      const parts = norm.split('/').map(p=>p.trim()).filter(Boolean);
      return parts.length > 0 && parts.every(isColorToken);
    };
    const colorMode = isColorValue(expectedVal);

    const boxClass    = liveStatus==='match' ? 'status-match' : liveStatus==='mismatch' ? 'status-mismatch' : liveStatus==='saved' ? 'status-saved' : 'actual';
    const badgeLabel  = { match:t('st_match'), mismatch:t('st_mismatch'), saved:t('st_saved'), pending:t('st_wait') };
    const badgeCls    = { match:'match', mismatch:'mismatch', saved:'saved', pending:'pending' };

    const actualArea = buildActualArea(colorMode, boxClass, liveStatus, curKey, actualVal, expectedVal);

    const paramCard = `
      <div class="check-player">
        <div class="check-player-top">
          <span class="player-counter">${checkState.stepIndex+1} / ${total}</span>
          <div class="player-progress-track" style="flex:1;margin:0 18px">
            <div class="player-progress-fill" style="width:${pct}%"></div>
          </div>
          <span class="check-status-badge ${badgeCls[liveStatus]||'pending'}">
            <span class="check-status-dot"></span>${badgeLabel[liveStatus]||t('st_wait')}
          </span>
        </div>

        <div class="check-player-body">
          <div class="check-param-label">${t('param_caps')}</div>
          <div class="check-param-name">${renderPlayerLabel(curKey)}</div>

          ${(function(){
            var _preset = detectPresetType(expectedVal);
            var _isStacked = _preset && (_preset.type==='racetrack'||_preset.type==='freetext'||_preset.type==='sequence'||_preset.type==='dash');
            if(_isStacked) {
              return '<div class="check-values-stacked">'
                + '<div class="check-val-block"><div class="check-val-label">' + t('expected_list') + '</div>'
                + '<div class="check-val-box expected">' + renderRichValue(String(expectedVal)) + '</div></div>'
                + '<div class="check-val-block">' + actualArea + '</div>'
                + '</div>';
            }
            return '<div class="check-values-grid">'
              + '<div class="check-val-block"><div class="check-val-label">' + t('expected_list') + '</div>'
              + '<div class="check-val-box expected">' + renderRichValue(String(expectedVal)) + '</div></div>'
              + '<div class="check-arrow">→</div>'
              + '<div class="check-val-block"><div class="check-val-label">' + t('actual_machine') + '</div>'
              + actualArea + '</div>'
              + '</div>';
          })()}
        </div>

        <div class="check-player-nav">
          <button class="btn-ghost" data-action="check-prev" ${checkState.stepIndex===0?'disabled':''}>${t('prev')}</button>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="player-counter-done" style="font-family:var(--mono);font-size:11px;color:var(--text-3)">${done}/${total}</span>
            ${isLast
              ? `<button class="btn-primary" data-action="check-finish" data-param="${escapeHtml(curKey)}" data-expected="${escapeHtml(String(expectedVal))}" data-status="${liveStatus}">${t('finish')}</button>`
              : `<button class="btn-primary" data-action="check-next"  data-param="${escapeHtml(curKey)}" data-expected="${escapeHtml(String(expectedVal))}" data-status="${liveStatus}">${t('next')}</button>`
            }
          </div>
        </div>
      </div>`;

    return `
      ${checkToggle}
      <div class="check-wrap">
        <div>${paramCard}</div>
        <div class="check-sidebar">
          <div class="check-sidebar-header">
            <span class="player-sidebar-title">${t('col_param')}</span>
            <span style="font-family:var(--mono);font-size:10px;color:var(--text-3)">${pct}%</span>
          </div>
          <div class="mini-list">${miniList}</div>
        </div>
      </div>`;
  }

  function renderCheckSummary(checkRows){
    const saved      = checkRows.filter(([k])=>(checkState.results[k] && checkState.results[k].status)==='saved');
    const mismatches = checkRows.filter(([k])=>(checkState.results[k] && checkState.results[k].status)==='mismatch');
    const matches    = checkRows.filter(([k])=>(checkState.results[k] && checkState.results[k].status)==='match');
    const pending    = checkRows.filter(([k])=>!(checkState.results[k] && checkState.results[k].status) || (checkState.results[k] && checkState.results[k].status)==='pending');

    const allChecked = [...saved, ...mismatches, ...matches];

    const changeRows = allChecked.map(([key, , expRaw]) => {
      const r = checkState.results[key];
      const status = (r && r.status) || 'pending';
      const expectedDisp = normalizeDisplayValue(String(getExpectedValue(key, expRaw)));
      const expParts = expectedDisp.split('/').map(p=>p.trim()).filter(Boolean);
      const isColor  = expParts.length > 0 && expParts.every(isColorToken);

      const actualDisplay = isColor
        ? renderRichValue(expectedDisp)
        : escapeHtml(normalizeDisplayValue(String(r && r.actual ? r.actual : '—')));

      const statusIco = status==='match'?'✓':status==='saved'?'↑':status==='mismatch'?'✕':'·';
      const rowCls = status==='match'?'row-match':status==='saved'?'row-saved':status==='mismatch'?'row-miss':'';
      return `
        <div class="check-changes-row ${rowCls}">
          <span class="check-changes-key">${renderParamKey(key)}</span>
          <span class="check-changes-from">${renderRichValue(expectedDisp)}</span>
          <span class="check-changes-sep">→</span>
          <span class="check-changes-to ${status}">${actualDisplay}</span>
          <span class="check-changes-status ${status}">${statusIco}</span>
        </div>`;
    }).join('');

    return `
      <div class="check-summary-screen">
        <div class="check-summary-hero">${t('check_done')}</div>
        <div class="check-summary-sub">${getSectionTitle(state.section)} · ${escapeHtml(biscuitLabel(state.toBiscuit))} ${escapeHtml(state.toFormat||'')}</div>
        <div class="check-summary-stats">
          <span class="check-stat-pill ok">  <span class="sn">${matches.length}</span> ${t('stat_match')}</span>
          <span class="check-stat-pill miss"><span class="sn">${mismatches.length}</span> ${t('stat_mismatch')}</span>

  function renderHistory(){
    const store = getStore();
    const sk    = buildStoreKey();
    const versions = store.versions[sk] || [];
    if(!versions.length) return `<div class="empty-state">${t('no_versions')}</div>`;
    return `<div class="version-list">
      ${versions.map((v,vi)=>`
        <div class="version-card">
          <button class="version-card-header" data-action="toggle-version" data-value="${vi}">
            <span class="version-badge${vi===0?' latest':''}">v${v.v}</span>
            <span class="version-meta">${biscuitLabel(state.toBiscuit)} ${state.toFormat} · ${getSectionTitle(state.section)}</span>
            <span class="version-change-count">${v.changes.length} ${v.changes.length!==1?t('change_many'):t('change_one')}</span>
            <span class="version-date">${v.ts}</span>
          </button>
          <div class="version-body${vi===0?' open':''}" id="version-body-${vi}">
            <div class="version-param-list">
              ${v.changes.map(c=>`
                <div class="version-param-row">
                  <span class="version-param-name">${renderParamKey(c.param)}</span>
                  <span class="version-param-val">${escapeHtml(c.old)}</span>
                  <span class="version-param-sep">→</span>
                  <span class="version-param-val new">${escapeHtml(c.new_)}</span>
                  ${isAdmin() ? `<button class="restore-btn" data-action="restore-param" data-param="${escapeHtml(c.param)}" data-oldval="${escapeHtml(c.old)}" title="${t('restore_hint',{p:escapeHtml(c.param),v:escapeHtml(c.old)})}">${t('restore')}</button>` : ''}
                </div>
                ${c.note ? `<div style="padding:0 10px 6px 10px"><span style="font-family:var(--mono);font-size:11px;color:var(--text-3);font-style:italic">"${escapeHtml(c.note)}"</span></div>` : ''}
              `).join('')}
            </div>
          </div>

  function renderAudit(){
    const store = getStore();
    const logs = store.auditLog.filter(e=>
      e.section===getSectionTitle(state.section) &&
      e.toBiscuit===biscuitLabel(state.toBiscuit) &&
      e.toFormat===state.toFormat
    );
    if(!logs.length) return `<div class="empty-state">${t('no_log')}</div>`;
    const iconMap = { match:'✓', warn:'!', mismatch:'✕', saved:'↑', skipped:'—' };
    return `<div class="audit-list">
      ${logs.map(e=>`
        <div class="audit-entry">
          <div class="audit-icon ${e.action}">${iconMap[e.action]||'·'}</div>
          <div class="audit-body">
            <div class="audit-title">${escapeHtml(e.param)}</div>
            <div class="audit-meta">${escapeHtml(e.section)}${e.line?' · Lijn '+e.line:''} · ${escapeHtml(e.toBiscuit)} ${escapeHtml(e.toFormat)}${e.changedBy?' · door '+escapeHtml(e.changedBy):''}</div>
            <div class="audit-change">
              <span class="audit-old">${escapeHtml(e.old)}</span>
              <span class="audit-arr">→</span>
              <span class="audit-new">${escapeHtml(e.new_)}</span>
            </div>
            ${e.note ? `<div class="audit-note">"${escapeHtml(e.note)}"</div>` : ''}
          </div>
          <div class="audit-timestamp">${escapeHtml(e.ts)}</div>
        </div>`).join('')}
    </div>`;

  function renderSidebar(){
    const canContinue = state.fromBiscuit&&state.fromFormat&&state.toBiscuit&&state.toFormat;
    const fromLabel   = state.fromBiscuit ? biscuitLabel(state.fromBiscuit) : '—';
    const toLabel     = state.toBiscuit   ? biscuitLabel(state.toBiscuit)   : '—';
    const fromFmt     = state.fromFormat  || '—';
    const toFmt       = state.toFormat    || '—';
    const sectionLabel = !state.section ? null :
      state.section==='cavanna'    ? `Cavanna · L${state.cavannaLine}` :
      state.section==='robertpack' ? `Robert Pack · L${state.robertpackLine}` :
      state.section==='dozen'      ? 'Dozen Opzetter' : 'Dekselaar Opzetter';

    /* Check & Verify is admin-only. De stap wordt voor operators verborgen
       zodat het werkflow-overzicht klopt met wat ze daadwerkelijk kunnen. */
    const steps = [
      { label:t('cfg_title'), done: canContinue,                        active: state.stage===1 },
      { label:t('section_pick'),   done: state.stage===2 && !!state.section, active: state.stage===2 && !checkState.active }
    ];
    if(isAdmin()){
      steps.push({ label:t('check_verify').replace('⊙ ',''), done: false, active: checkState.active, checkActive: checkState.active });
    }

    return `
      <div class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-label">${t('ombouw_session')}</div>
          <div class="flow-card">
            <div class="flow-card-row">
              <div class="flow-block">
                <div class="flow-block-label">${t('from')}</div>
                <div class="flow-block-value ${state.fromBiscuit?'':'dim'}">${fromLabel}${state.fromFormat?` · ${fromFmt}`:''}</div>
              </div>
              <div class="flow-arrow-col">→</div>
              <div class="flow-block">
                <div class="flow-block-label">${t('to')}</div>
                <div class="flow-block-value ${state.toBiscuit?'amber':'dim'}">${toLabel}${state.toFormat?` · ${toFmt}`:''}</div>
              </div>
            </div>
          </div>
          ${sectionLabel?`<div class="section-tag"><div class="tag-dot"></div>${escapeHtml(sectionLabel)}</div>`:''}

        <div class="sidebar-sep"></div>

          <div class="sidebar-label" style="padding:0 2px;margin-bottom:10px">${t('workflow')}</div>
          ${steps.map((s,i)=>`
            <div class="step-item${s.done?' done':''}${s.active&&!s.done?' active':''}${s.checkActive?' check-active':''}">
              <div class="step-num">${s.done?'✓':i+1}</div>
              <div class="step-text">${s.label}</div>
            </div>`).join('')}
        </div>
      </div>`;

  function render(){
    const shell       = document.getElementById('app-shell');
    /* Veiligheidsslot: Check Mode is admin-only. Als de rol geen admin
       (meer) is — bv. uitgelogd tijdens een check of herstelde sessie —
       sluit Check Mode automatisch zodat de operator het nooit ziet. */
    if(checkState.active && !isAdmin()){
      checkState.active = false;
      checkState.showSummary = false;
      checkState.pendingSave = null;
      checkState.statusParam = null;
      removeConfirmOverlay();
    }
    const canContinue = state.fromBiscuit&&state.fromFormat&&state.toBiscuit&&state.toFormat;
    const rows        = getRows();
    const visibleRows = filterRows(rows, state.onlyChanges);

    let bcParts = [];
    if(state.stage>=1){
      const modeLabel = state.appMode==='status' ? t('mode_status') : state.appMode==='ombouw' ? t('mode_ombouw') : t('module_ombouwen');
      bcParts.push(`<span class="bc-item${state.stage===1&&!checkState.active?' active':''}">${modeLabel}</span>`);
    }
    if(state.stage>=2) bcParts.push(`<span class="bc-sep"> › </span><span class="bc-item${state.stage===2&&!checkState.active&&!state.section?' active':''}">${t('section_pick')}</span>`);

    if(checkState.active) bcParts.push(`<span class="bc-sep"> › </span><span class="bc-item active" style="color:#06b6d4">${t('module_check')}</span>`);
    const bc = bcParts.join('');

    let mainContent = '';

    if(state.loading){
      mainContent = `<div class="loading-screen"><div class="loading-bar-wrap"><div class="loading-bar-fill"></div></div><div class="loading-label">${t('sys_init')}</div></div>`;
    }
