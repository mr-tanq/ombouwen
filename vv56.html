  /* ── Ploeg-rooster ──
     10-daagse cyclus, anker 2026-07-11, expliciet Europe/Amsterdam (DST-veilig
     via Intl). Diensten: 07–15 ochtend, 15–23 middag, 23–07 nacht. 00:00–06:59
     hoort bij de nachtdienst die de vorige dag om 23:00 startte. */
  const PLOEG_CYCLE = [
    {morning:'Ron',      afternoon:'Fouad',    night:'Michel'},
    {morning:'Ron',      afternoon:'Fouad',    night:'Michel'},
    {morning:'Mohammed', afternoon:'Ron',      night:'Fouad'},
    {morning:'Mohammed', afternoon:'Ron',      night:'Fouad'},
    {morning:'Barry',    afternoon:'Mohammed', night:'Ron'},
    {morning:'Barry',    afternoon:'Mohammed', night:'Ron'},
    {morning:'Michel',   afternoon:'Barry',    night:'Mohammed'},
    {morning:'Michel',   afternoon:'Barry',    night:'Mohammed'},
    {morning:'Fouad',    afternoon:'Michel',   night:'Barry'},
    {morning:'Fouad',    afternoon:'Michel',   night:'Barry'}
  ];
  /* Toont een (UTC/ISO) timestamp in de lokale tijd van Nederland
     (Europe/Amsterdam), bv. "13-07 14:32". DST wordt automatisch verrekend. */
  function fmtLocalTime(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso).slice(0,16).replace('T',' ');
    try{
      const fmt = new Intl.DateTimeFormat('nl-NL', {
        timeZone:'Europe/Amsterdam', day:'2-digit', month:'2-digit',
        hour:'2-digit', minute:'2-digit', hour12:false
      });
      const p = {};
      fmt.formatToParts(d).forEach(x=>{ if(x.type!=='literal') p[x.type]=x.value; });
      return `${p.day}-${p.month} ${p.hour}:${p.minute}`;
    }catch(e){ return String(iso).slice(0,16).replace('T',' '); }
  }
  function amsterdamParts(date){
    const fmt = new Intl.DateTimeFormat('en-CA', {
      timeZone:'Europe/Amsterdam', year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', hour12:false
    });
    const p = {};
    fmt.formatToParts(date).forEach(x=>{ if(x.type!=='literal') p[x.type]=x.value; });
    let hour = parseInt(p.hour,10); if(hour===24) hour=0;
    return { y:+p.year, m:+p.month, d:+p.day, hour };
  }
  function getActivePloeg(date){
    date = date || new Date();
    const p = amsterdamParts(date);
    let shift, sy=p.y, sm=p.m, sd=p.d;
    if(p.hour >= 7 && p.hour < 15){ shift='morning'; }
    else if(p.hour >= 15 && p.hour < 23){ shift='afternoon'; }
    else {
      shift='night';
      if(p.hour < 7){ /* na middernacht → dienst startte gisteren 23:00 */
        const prev = new Date(Date.UTC(p.y, p.m-1, p.d));
        prev.setUTCDate(prev.getUTCDate()-1);
        sy=prev.getUTCFullYear(); sm=prev.getUTCMonth()+1; sd=prev.getUTCDate();
      }
    }
    const diff = Math.round((Date.UTC(sy,sm-1,sd) - Date.UTC(2026,6,11)) / 86400000);
    const offset = ((diff % 10) + 10) % 10;   /* veilige modulo, ook vóór anker */
    const name = PLOEG_CYCLE[offset][shift];
    return { name, label: name + ' Ploeg',
             shiftDate: sy + '-' + String(sm).padStart(2,'0') + '-' + String(sd).padStart(2,'0') };
  }

  /* ── Ombouw-sessies + machine-status (Fase 2) ──
     Eén sessie per productwissel binnen een lijngroep; meerdere machines
     delen de sessie. machineStates[machineKey] = status-rij. Multi-device
     via Supabase; lokaal gecachet zodat de UI direct reageert. */
  let activeSession = null;          // { id, line_group, from_combo, to_combo, ... }
  let machineStates = {};            // machineKey -> { status, ... }

  function machineKeyFor(section, line){
    return section + '|' + (line || '');
  }
  function currentComboLabels(){
    const from = state.fromBiscuit ? (biscuitLabel(state.fromBiscuit) + ' ' + (state.fromFormat||'')).trim() : '';
    const to   = state.toBiscuit ? (biscuitLabel(state.toBiscuit) + ' ' + (state.toFormat||'')).trim() : '';
    return { from, to };
  }

  /* Haal (of maak) de actieve sessie voor de huidige groep + combo. */
  async function ensureSession(){
    if(!sb || !auth.signedIn) return null;
    const grp = state.selectedLineGroup || PILOT_GROUP;
    const { from, to } = currentComboLabels();
    if(activeSession && activeSession.line_group===grp &&
       activeSession.from_combo===from && activeSession.to_combo===to &&
       activeSession.status==='active'){
      return activeSession;
    }
    try{
      /* Bestaat er al een actieve sessie voor deze groep+combo? */
      const { data: found } = await sb.from('ombouw_sessions')
        .select('*').eq('line_group', grp).eq('status','active')
        .eq('from_combo', from).eq('to_combo', to)
        .order('created_at', { ascending:false }).limit(1);
      if(found && found.length){ activeSession = found[0]; }
      else {
        const row = {
          line_group: grp, from_combo: from, to_combo: to,
          ploeg: getActivePloeg().name, status:'active',
          created_by: operatorDisplayName() || '', created_by_id: auth.userId || null
        };
        const { data: ins, error } = await sb.from('ombouw_sessions').insert(row).select().single();
        if(error) throw error;
        activeSession = ins;
      }
      await loadMachineStates();
      return activeSession;
    }catch(e){ return null; }
  }

  async function loadMachineStates(){
    machineStates = {};
    if(!sb || !activeSession) return;
    try{
      const { data } = await sb.from('machine_states')
        .select('*').eq('session_id', activeSession.id);
      (data||[]).forEach(m=>{ machineStates[m.machine_key] = m; });
    }catch(e){}
  }

  function machineStatusFor(section, line){
    const m = machineStates[machineKeyFor(section, line)];
    return m ? m.status : 'not_started';
  }

  /* Statusvolgorde: toon de minst-voltooide machine, want de sectie is pas
     "klaar" als álle machines klaar zijn. */
  const STATUS_RANK = { running:0, paused:1, timed:2, not_started:3, completed_reported:4, completed:5 };
  function sectionStatusBadge(section){
    const lines = (section === 'cavanna' || section === 'robertpack') ? groupLines() : [''];
    let worst = null;
    lines.forEach(ln=>{
      const st = machineStatusFor(section, ln);
      if(worst === null || STATUS_RANK[st] < STATUS_RANK[worst]) worst = st;
    });
    if(!worst || worst === 'not_started') return '';
    const map = {
      running:            { cls:'run',  txt:t('ms_running') },
      paused:             { cls:'pause',txt:t('ms_paused') },
      timed:              { cls:'timed',txt:t('ms_timed') },
      completed:          { cls:'done', txt:'✅ ' + t('ms_completed') },
      completed_reported: { cls:'rep',  txt:'✅ ' + t('ms_completed_rep') }
    };
    const b = map[worst];
    return b ? `<span class="ms-badge ms-${b.cls}">${escapeHtml(b.txt)}</span>` : '';
  }

  /* Welke lijn hoort bij de machine die nu in de status-lijst staat? */
  function currentStatusLine(){
    if(state.section === 'cavanna') return state.cavannaLine || groupLines()[0] || '';
    if(state.section === 'robertpack') return state.robertpackLine || groupLines()[0] || '';
    return '';
  }
  /* Verstreken tijd als mm:ss of h:mm:ss. */
  function fmtDuration(sec){
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    const pad = n=> String(n).padStart(2,'0');
    return h > 0 ? (h + ':' + pad(m) + ':' + pad(s)) : (pad(m) + ':' + pad(s));
  }
  /* Timerbalk. Alleen operators zien knoppen; admin ziet niets hier (die ziet
     status + historie elders). Cloud vereist. */
  function renderTimerBar(){
    if(!sb || !auth.signedIn || isAdmin()) return '';
    const line = currentStatusLine();
    const m = machineStates[machineKeyFor(state.section, line)];
    const st = m ? m.status : 'not_started';
    if(st === 'completed' || st === 'completed_reported') return '';  /* klaar → geen timer */
    if(st === 'timed'){
      /* Tijd vastgezet, wacht op Check & Verify. Toon de vaste tijd + optie
         om opnieuw te meten mocht dat nodig zijn. */
      return `<div class="timer-bar is-timed">
        <span class="timer-clock" data-status="timed">${fmtDuration(machineElapsedSec(m))}</span>
        <span class="timer-timed-tag">${escapeHtml(t('timer_timed'))}</span>
        <button class="timer-btn timer-restart" data-action="timer-restart" title="${escapeHtml(t('timer_restart_hint'))}">↻ ${escapeHtml(t('timer_restart'))}</button>
      </div>`;
    }
    if(st === 'not_started'){
      return `<div class="timer-bar">
        <span class="timer-label">${escapeHtml(t('timer_ready'))}</span>
        <button class="timer-btn timer-start" data-action="timer-start">▶ ${escapeHtml(t('timer_start'))}</button>
      </div>`;
    }
    const elapsed = machineElapsedSec(m);
    const running = st === 'running';
    return `<div class="timer-bar ${running?'is-running':'is-paused'}">
      <span class="timer-clock" id="timer-clock" data-start="${m.started_at||''}" data-paused="${m.paused_at||''}" data-ptotal="${m.paused_total_sec||0}" data-status="${st}">${fmtDuration(elapsed)}</span>
      ${running
        ? `<button class="timer-btn timer-pause" data-action="timer-pause">⏸ ${escapeHtml(t('timer_pause'))}</button>`
        : `<span class="timer-paused-tag">${escapeHtml(t('timer_paused'))}</span><button class="timer-btn timer-resume" data-action="timer-resume">▶ ${escapeHtml(t('timer_resume'))}</button>`}
      <button class="timer-btn timer-stop" data-action="timer-stop" title="${escapeHtml(t('timer_stop_hint'))}">⏹ ${escapeHtml(t('timer_stop'))}</button>
    </div>`;
  }

  function machineAfrondLabel(){
    const st = machineStatusFor(state.section, currentStatusLine());
    return (st === 'completed' || st === 'completed_reported') ? ('✅ ' + t('ms_completed')) : t('ombouw_afronden');
  }
  function machineStatusLine(){
    const m = machineStates[machineKeyFor(state.section, currentStatusLine())];
    if(!m || (m.status !== 'completed' && m.status !== 'completed_reported')) return '';
    const when = m.completed_at || m.updated_at || '';
    const parts = [
      m.completed_by || '',
      m.ploeg ? (m.ploeg + ' Ploeg') : '',
      when ? fmtLocalTime(when) : ''
    ].filter(Boolean);
    return `<div class="machine-status-line">${m.status==='completed_reported'?'⚠️ ':'✅ '}${escapeHtml(t('ms_done_by'))} ${escapeHtml(parts.join(' · '))}</div>`;
  }

  /* Zet/actualiseer een machine-status (upsert op session+machine_key). */
  async function setMachineStatus(section, line, status, extra){
    const sess = await ensureSession();
    if(!sess) return null;
    const key = machineKeyFor(section, line);
    const base = {
      session_id: sess.id, machine_key: key, section: section, line: line || '',
      label: getSectionTitle(section) + (line ? ' ' + line : ''),
      status: status, updated_at: new Date().toISOString()
    };
    const row = Object.assign(base, extra || {});
    try{
      const { data, error } = await sb.from('machine_states')
        .upsert(row, { onConflict:'session_id,machine_key' }).select().single();
      if(error) throw error;
      machineStates[key] = data;
      return data;
    }catch(e){ return null; }
  }

  /* ── Timer per machine (Fase 3) ──
     Alleen operators timen. Netto verstreken tijd = (nu − started_at) − pauzes.
     Pauzeduur wordt intern bijgehouden (paused_total_sec) maar NERGENS getoond.
     Crashveilig: alles staat in machine_states in de cloud; na refresh wordt
     de tijd opnieuw uit started_at/paused_at berekend. */
  function genClientId(){
    return 'ct_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }
  /* Netto verstreken seconden voor een lopende/gepauzeerde machine. */
  function machineElapsedSec(m){
    if(!m || !m.started_at) return 0;
    const start = new Date(m.started_at).getTime();
    let pausedTotal = m.paused_total_sec || 0;
    let endRef;
    if(m.status === 'paused' && m.paused_at){
      endRef = new Date(m.paused_at).getTime();   /* bevroren op pauzemoment */
    } else if(m.status === 'completed' || m.status === 'completed_reported' || m.status === 'timed'){
      return m.duration_sec || 0;
    } else {
      endRef = Date.now();
    }
    const gross = Math.max(0, Math.round((endRef - start) / 1000));
    return Math.max(0, gross - pausedTotal);
  }
  async function timerStart(section, line){
    const now = new Date().toISOString();
    return setMachineStatus(section, line, 'running', {
      client_timing_id: genClientId(),
      started_at: now, ended_at: null, duration_sec: null,
      paused_at: null, paused_total_sec: 0,
      started_by: operatorDisplayName() || '', started_by_id: auth.userId || null,
      ploeg: getActivePloeg().name, had_timer: true
    });
  }
  async function timerPause(section, line){
    const m = machineStates[machineKeyFor(section, line)];
    if(!m || m.status !== 'running') return null;
    return setMachineStatus(section, line, 'paused', { paused_at: new Date().toISOString() });
  }
  async function timerResume(section, line){
    const m = machineStates[machineKeyFor(section, line)];
    if(!m || m.status !== 'paused' || !m.paused_at) return null;
    /* Tel de zojuist verstreken pauze op bij het interne pauzetotaal. */
    const pausedSec = Math.max(0, Math.round((Date.now() - new Date(m.paused_at).getTime())/1000));
    const newTotal = (m.paused_total_sec || 0) + pausedSec;
    return setMachineStatus(section, line, 'running', { paused_at: null, paused_total_sec: newTotal });
  }
  /* Stop → annuleren: meting weggooien, machine terug naar not_started. */
  async function timerCancel(section, line){
    return setMachineStatus(section, line, 'not_started', {
      client_timing_id: null, started_at: null, ended_at: null, duration_sec: null,
      paused_at: null, paused_total_sec: 0,
      started_by: null, started_by_id: null, had_timer: false
    });
  }
  /* Stop → ombouw klaar: tijd bevriezen en bewaren. Machine wordt 'timed'
     (tijd vast, wacht op Check & Verify + afronden). Nog NIET completed. */
  async function timerFinish(section, line){
    const m = machineStates[machineKeyFor(section, line)];
    if(!m) return null;
    const netSec = machineElapsedSec(m);
    return setMachineStatus(section, line, 'timed', {
      ended_at: new Date().toISOString(),
      duration_sec: netSec,
      paused_at: null,
      had_timer: true
    });
  }

  /* Stop-dialoog: waarom stopt de operator de timer? */
  function renderStopDialog(){
    const ex = document.getElementById('stop-overlay'); if(ex) ex.remove();
    const line = currentStatusLine();
    const m = machineStates[machineKeyFor(state.section, line)];
    const elapsed = m ? fmtDuration(machineElapsedSec(m)) : '0:00';
    const div = document.createElement('div');
    div.className = 'check-confirm-overlay'; div.id = 'stop-overlay';
    div.innerHTML = `
      <div class="check-confirm-box">
        <div class="stop-dialog-title">${escapeHtml(t('timer_stop_q'))}</div>
        <div class="stop-dialog-time">⏱ ${elapsed}</div>
        <button class="stop-choice stop-finish" data-action="timer-finish-confirm">
          <span class="stop-choice-ico">✓</span>
          <span class="stop-choice-txt"><b>${escapeHtml(t('timer_stop_done'))}</b><span>${escapeHtml(t('timer_stop_done_sub'))}</span></span>
        </button>
        <button class="stop-choice stop-cancel" data-action="timer-cancel-confirm">
          <span class="stop-choice-ico">✕</span>
          <span class="stop-choice-txt"><b>${escapeHtml(t('timer_stop_wrong'))}</b><span>${escapeHtml(t('timer_stop_wrong_sub'))}</span></span>
        </button>
        <button class="btn-ghost" data-action="stop-dialog-close" style="width:100%;margin-top:4px">${escapeHtml(t('close'))}</button>
      </div>`;
    document.body.appendChild(div);
    const close = ()=> div.remove();
    div.addEventListener('click', e=>{ if(e.target===div) close(); });
    div.querySelector('[data-action="stop-dialog-close"]').addEventListener('click', close);
    /* De keuze-knoppen worden door de globale actie-handler afgehandeld. */
    div.querySelectorAll('[data-action]').forEach(b=>{
      const act = b.getAttribute('data-action');
      if(act==='timer-finish-confirm' || act==='timer-cancel-confirm'){
        b.addEventListener('click', ()=>{
          const line = currentStatusLine();
          if(act==='timer-finish-confirm'){ close(); timerFinish(state.section, line).then(()=>{ showToast(t('timer_finished'),'ok'); render(); }); }
          else { close(); timerCancel(state.section, line).then(()=>{ showToast(t('timer_cancelled'),'ok'); render(); }); }
        });
      }
    });
  }

  function operatorDisplayName(){
    const n = [auth.firstName, auth.lastName].filter(Boolean).join(' ').trim();
    return n || auth.username || auth.email || '';
  }
  /* Kort label voor de topbar-badge: username (of e-mail-prefix voor admin). */
  function userBadgeLabel(){
    if(isAdmin()) return auth.username || (auth.email ? auth.email.split('@')[0] : 'Admin');
    return auth.username || 'Operator';
  }
  /* Interne e-mail voor het Supabase Auth-systeem: operators loggen in met
     username, wij vertalen dat naar <username>@pally-ombouwen.nl.
     (Supabase weigert .local als ongeldig, daarom een echt domeinformaat.) */
  function usernameToEmail(u){
    return normalizeUsername(u) + '@pally-ombouwen.nl';
  }
  /* Username-regels: alleen kleine letters, cijfers en _ (geen @, punten,
     spaties). Zo kan het nooit een e-mailadres zijn en blijft de interne
     login geldig. */
  function normalizeUsername(u){
    return String(u||'').trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  }
  function isValidUsername(u){
    const n = normalizeUsername(u);
    return n.length >= 3 && n === String(u||'').trim().toLowerCase();
  }

  /* Haalt het volledige profiel op: rol, status en naam. Een gebruiker
     zonder profielrij of niet-goedgekeurd blijft zonder schrijfrecht. */
  async function fetchProfile(userId){
    if(!sb || !userId) return null;
    try{
      const { data, error } = await sb.from('profiles')
        .select('role, status, first_name, last_name, username').eq('id', userId).single();
      if(error) return null;
      return data || null;
    }catch(e){ return null; }
  }
  async function resolveRole(userId){
    const p = await fetchProfile(userId);
    return (p && p.role === 'admin') ? 'admin' : 'operator';
  }

  function applyProfileToAuth(userId, email, profile){
    auth.userId = userId || '';
    auth.email = email || '';
    auth.role = (profile && profile.role === 'admin') ? 'admin' : 'operator';
    auth.firstName = (profile && profile.first_name) || '';
    auth.lastName  = (profile && profile.last_name) || '';
    auth.username  = (profile && profile.username) || '';
    auth.signedIn = true;
  }
  function clearAuth(){
    auth.role = 'operator'; auth.email = ''; auth.userId = '';
    auth.username = ''; auth.firstName = ''; auth.lastName = '';
    auth.signedIn = false; auth.showLogin = false;
    auth.authView = 'login'; auth.loginError = ''; auth.busy = false;
  }

  async function refreshAuthFromSession(){
    if(!sb){ clearAuth(); return; }
    try{
      const { data } = await sb.auth.getSession();
      if(data && data.session && data.session.user){
        const u = data.session.user;
        const prof = await fetchProfile(u.id);
        /* Geen profielrij? Nooit stil binnenlaten. Sessie sluiten. */
        if(!prof){
          try{ await sb.auth.signOut(); }catch(e){}
          clearAuth();
          return;
        }
        /* Niet-goedgekeurde operator? Sessie sluiten — mag nog niet werken. */
        if(prof.role !== 'admin' && prof.status !== 'approved'){
          try{ await sb.auth.signOut(); }catch(e){}
          clearAuth();
          return;
        }
        applyProfileToAuth(u.id, u.email || '', prof);
      } else {
        clearAuth();
      }
    }catch(e){ clearAuth(); }
  }

  async function doLogin(email, password){
    auth.busy = true; auth.loginError = ''; render();
    /* Geen cloud → geen login mogelijk. Offline = strikt alleen-lezen. */
    if(!sb){
      auth.busy = false;
      auth.role = 'operator'; auth.email = '';
      auth.loginError = t('login_offline_readonly');
      render();
      return;
    }
    try{
      const { data, error } = await sb.auth.signInWithPassword({ email: email, password: password });
      if(error) throw error;
      const uid = data && data.user && data.user.id;
      const role = await resolveRole(uid);
      auth.email = (data && data.user && data.user.email) || email;
      if(role !== 'admin'){
        /* Ingelogd, maar geen admin-rechten in profiles → geen schrijfrecht.
           We loggen weer uit zodat er geen half-bevoorrechte sessie blijft. */
        try{ await sb.auth.signOut(); }catch(e){}
        auth.role = 'operator'; auth.email = '';
        auth.busy = false; auth.loginError = t('err_not_admin');
        render();
        return;
      }
      const prof = await fetchProfile(uid);
      applyProfileToAuth(uid, (data && data.user && data.user.email) || email, prof || { role:'admin' });
      auth.role = 'admin';
      auth.showLogin = false; auth.busy = false; auth.loginError = '';
      showToast(t('loggedin_as') + auth.email, 'ok');
      pullFromCloud(true).then(()=> render());
      render();
    }catch(err){
      auth.busy = false;
      auth.loginError = (err && err.message) === 'Invalid login credentials'
        ? t('err_bad_login')
        : (t('err_login_failed') + ((err && err.message) || '?'));
      render();
    }
  }

  /* ── Operator login: username + PIN ── */
  async function doOperatorLogin(username, pin){
    auth.busy = true; auth.loginError = ''; render();
    if(!sb){ auth.busy=false; auth.loginError = t('login_offline_readonly'); render(); return; }
    const uname = String(username||'').trim();
    if(!uname || !pin){ auth.busy=false; auth.loginError = t('err_fill_all'); render(); return; }
    try{
      const email = usernameToEmail(uname);
      const { data, error } = await sb.auth.signInWithPassword({ email: email, password: String(pin) });
      if(error) throw error;
      const uid = data && data.user && data.user.id;
      const prof = await fetchProfile(uid);
      /* Geen profielrij? Weigeren (nooit stil binnenlaten). */
      if(!prof){
        try{ await sb.auth.signOut(); }catch(e){}
        clearAuth();
        auth.busy=false;
        auth.loginError = t('err_account_pending');
        render();
        return;
      }
      /* Nog niet goedgekeurd door admin? Geen toegang. */
      if(prof.role !== 'admin' && prof.status !== 'approved'){
        try{ await sb.auth.signOut(); }catch(e){}
        clearAuth();
        auth.busy=false;
        auth.loginError = prof.status === 'rejected' ? t('err_account_rejected') : t('err_account_pending');
        render();
        return;
      }
      applyProfileToAuth(uid, (data && data.user && data.user.email) || email, prof);
      auth.busy=false; auth.loginError=''; auth.showLogin=false;
      showToast(t('welcome_back') + ' ' + operatorDisplayName(), 'ok');
      pullFromCloud(true).then(()=> render());
      render();
    }catch(err){
      auth.busy=false;
      auth.loginError = (err && err.message)==='Invalid login credentials'
        ? t('err_bad_login_op') : (t('err_login_failed') + ((err && err.message)||'?'));
      render();
    }
  }

  /* ── Registratie nieuwe operator (status 'pending' → admin keurt goed) ── */
  async function doOperatorRegister(fields){
    auth.busy = true; auth.loginError = ''; render();
    if(!sb){ auth.busy=false; auth.loginError = t('login_offline_readonly'); render(); return; }
    const first = String(fields.first||'').trim();
    const last  = String(fields.last||'').trim();
    const uname = String(fields.username||'').trim();
    const pin   = String(fields.pin||'').trim();
    if(!first || !last || !uname || !pin){ auth.busy=false; auth.loginError = t('err_fill_all'); render(); return; }
    if(!isValidUsername(uname)){ auth.busy=false; auth.loginError = t('err_username_invalid'); render(); return; }
    if(!/^\d{6,}$/.test(pin)){ auth.busy=false; auth.loginError = t('err_pin_short'); render(); return; }
    const unameClean = normalizeUsername(uname);
    try{
      /* Username vrij? (RPC, veilig voor anon) */
      try{
        const { data: avail } = await sb.rpc('username_available', { uname: unameClean });
        if(avail === false){ auth.busy=false; auth.loginError = t('err_username_taken'); render(); return; }
      }catch(e){ /* RPC ontbreekt? ga door; unique-index vangt duplicaat alsnog */ }

      const email = usernameToEmail(unameClean);
      const { error } = await sb.auth.signUp({
        email: email, password: pin,
        options: { data: { first_name: first, last_name: last, username: unameClean } }
      });
      if(error) throw error;
      /* Direct uitloggen: het account is 'pending' tot de admin het goedkeurt. */
      try{ await sb.auth.signOut(); }catch(e){}
      clearAuth();
      auth.busy=false; auth.loginError=''; auth.authView='login';
      showToast(t('register_pending'), 'ok');
      render();
    }catch(err){
      auth.busy=false;
      const msg = (err && err.message) || '';
      auth.loginError = /already registered|already exists/i.test(msg)
        ? t('err_username_taken') : (t('err_register_failed') + (msg||'?'));
      render();
    }
  }

  async function doLogout(){
    /* Geen stil dataverlies: als er nog niet-gesynchroniseerde admin-
       wijzigingen in de wachtrij staan, blokkeer het uitloggen en vraag
       eerst te synchroniseren. */
    const pending = loadQueue().length;
    if(pending > 0){
      showToast(t('logout_pending', { n: pending }), 'warn');
      flushSyncQueue().then(()=> render());
      return;
    }
    if(sb){ try{ await sb.auth.signOut(); }catch(e){} }
    clearAuth();
    auth.showLogin = false; auth.authView = 'login';
    showToast(t('loggedout'), 'ok');
    /* Verse officiële cloud-waarden ophalen zodat de operator-sessie de
       laatste stand toont (geen wachtrij om te wissen — die was leeg). */
    if(sb){ pullFromCloud(true).then(()=> render()); }
    render();
  }

  /* Centrale schrijf-gate: roep dit aan vóór elke schrijfactie. */
  function requireAdmin(message){
    if(isAdmin()) return true;
    auth.showLogin = true;
    auth.loginError = '';
    render();
    showToast(message || t('admin_required'), 'warn');
    return false;
  }

  /* ── WAARDE MELDEN (operator-suggestie, GEEN officiële wijziging) ──
     Een operator kan melden dat een waarde verkeerd lijkt. Dit schrijft
     NOOIT naar current_values/versions/audit — alleen naar de aparte
     tabel 'value_reports'. Een admin bekijkt meldingen later en past ze
     handmatig toe via de normale Check/Save flow indien gewenst. */
  let reportParam = null;

  function openReport(param, current){
    reportParam = { param: param, current: current };
    renderReportOverlay();
  }
  function closeReport(){
    reportParam = null;
    const el = document.getElementById('report-overlay');
    if(el) el.remove();
  }

  function renderReportOverlay(){
    const ex = document.getElementById('report-overlay');
    if(ex) ex.remove();
    if(!reportParam) return;
    const div = document.createElement('div');
    div.className = 'photo-overlay';
    div.id = 'report-overlay';
    div.innerHTML = `
      <div class="photo-box" style="max-width:440px">
        <div class="photo-header">
          <span class="photo-title">⚠ ${t('report_title')}</span>
          <button class="photo-close" data-action="report-close" aria-label="${t('close')}">✕</button>
        </div>
        <div class="photo-body" style="align-items:stretch;gap:12px">
          <div class="report-param">${escapeHtml(reportParam.param)}</div>
          <div class="report-current">${t('col_current')}: <b>${escapeHtml(reportParam.current||'—')}</b></div>
          <input type="text" class="login-input" id="report-suggest" placeholder="${t('report_suggest_ph')}">
          <textarea class="confirm-note" id="report-comment" placeholder="${t('report_comment_ph')}"></textarea>
          <div class="report-hint">${t('report_disclaimer')}</div>
          <button class="btn-primary" data-action="report-submit">${t('report_send')}</button>
        </div>
      </div>`;
    document.body.appendChild(div);
    div.addEventListener('click', e=>{ if(e.target===div) closeReport(); });
    div.querySelector('[data-action="report-close"]').addEventListener('click', closeReport);
    div.querySelector('[data-action="report-submit"]').addEventListener('click', submitReport);
    const si = document.getElementById('report-suggest'); if(si) si.focus();
  }

  async function submitReport(){
    if(!reportParam) return;
    const suggestEl = document.getElementById('report-suggest');
    const commentEl = document.getElementById('report-comment');
    const suggested = suggestEl ? suggestEl.value.trim() : '';
    const comment = commentEl ? commentEl.value.trim() : '';
    if(!suggested && !comment){ showToast(t('report_empty'), 'warn'); return; }

    const lgCtx = lineGroupContext();
    const entry = {
      afdeling: lgCtx.afdeling, line_group: lgCtx.lineGroup, line_label: lgCtx.lineLabel,
      section: getSectionTitle(state.section),
      line: state.section==='cavanna'?state.cavannaLine:state.section==='robertpack'?state.robertpackLine:'',
      product: biscuitLabel(state.toBiscuit), format: state.toFormat || '',
      param: reportParam.param,
      current_value: reportParam.current || '',
      suggested_value: suggested, comment: comment,
      created_at: new Date().toISOString(),
      created_by: operatorDisplayName() || ('operator-' + (navigator.language||'') ),
      ploeg: getActivePloeg().name
    };

    if(!sb){ showToast(t('report_need_cloud'), 'err'); return; }
    try{
      const { error } = await sb.from('value_reports').insert(entry);
      if(error) throw error;
      showToast(t('report_sent'), 'ok');
      closeReport();
    }catch(err){
      console.warn('[submitReport] failed:', err && err.message);
      showToast(t('report_fail') + ((err && err.message) || ''), 'err');
    }
  }

  /* ── ADMIN: meldingen + backup import ── */
  let pendingReports = [];

  /* ── OMBOUW-TIJDMETING (SMED) ──
     Meet hoe lang een ombouw duurt per product-paar + sectie. Geeft de
     fabriek harde data: welke ombouw kost de meeste tijd. De lopende meting
     wordt lokaal bewaard (overleeft refresh); afgeronde metingen gaan naar
     de cloud-tabel 'ombouw_timings'. Admin-only. */
  let activeTiming = null;     // { startedAt, fromCombo, toCombo, section, line }
  let timingTick = null;       // setInterval handle voor live teller
  let machineTick = null;      // setInterval handle voor machine-timer klok
  let recentTimings = [];      // laatste afgeronde metingen (uit cloud)

  function loadActiveTiming(){
    try{ const r = localStorage.getItem('pally_active_timing'); activeTiming = r ? JSON.parse(r) : null; }
    catch(e){ activeTiming = null; }
  }
  function saveActiveTiming(){
    try{
      if(activeTiming) localStorage.setItem('pally_active_timing', JSON.stringify(activeTiming));
      else localStorage.removeItem('pally_active_timing');
    }catch(e){}
  }

  function startTiming(){
    if(!requireAdmin()) return;
    activeTiming = {
      startedAt: Date.now(),
      lineGroup: state.selectedLineGroup || '',
      fromCombo: biscuitLabel(state.fromBiscuit) + ' ' + (state.fromFormat||''),
      toCombo: biscuitLabel(state.toBiscuit) + ' ' + (state.toFormat||''),
      section: getSectionTitle(state.section),
      line: state.section==='cavanna'?state.cavannaLine:state.section==='robertpack'?state.robertpackLine:''
    };
    saveActiveTiming();
    showToast(t('timing_started'), 'ok');
    render();
  }

  /* Afgeronde metingen die (nog) niet naar de cloud konden (offline of
     fout) worden lokaal bewaard en bij de volgende gelegenheid verstuurd. */
  function loadPendingTimings(){
    try{ return JSON.parse(localStorage.getItem('pally_pending_timings') || '[]'); }
    catch(e){ return []; }
  }
  function savePendingTimings(arr){
    try{ localStorage.setItem('pally_pending_timings', JSON.stringify(arr||[])); }catch(e){}
  }
  async function flushPendingTimings(){
    if(!sb || !isAdmin()) return;
    let q = loadPendingTimings();
    if(!q.length) return;
    const remaining = [];
    for(const rec of q){
      try{
        const { error } = await sb.from('ombouw_timings').insert(rec);
        if(error) throw error;
      }catch(e){ remaining.push(rec); }
    }
    savePendingTimings(remaining);
  }

  async function stopTiming(){
    if(!requireAdmin()) return;
    if(!activeTiming) return;
    const ended = Date.now();
    const durationSec = Math.round((ended - activeTiming.startedAt) / 1000);
    const rec = {
      line_group: activeTiming.lineGroup || '',
      from_combo: activeTiming.fromCombo, to_combo: activeTiming.toCombo,
      section: activeTiming.section, line: activeTiming.line || '',
      started_at: new Date(activeTiming.startedAt).toISOString(),
      ended_at: new Date(ended).toISOString(),
      duration_sec: durationSec,
      created_by: operatorDisplayName() || '',
      ploeg: getActivePloeg().name
    };
    activeTiming = null; saveActiveTiming();
    showToast(t('timing_done', { d: formatDuration(durationSec) }), 'ok');
    render();
    if(sb){
      try{
        const { error } = await sb.from('ombouw_timings').insert(rec);
        if(error) throw error;
        await flushPendingTimings();   /* eerdere gestrande metingen meenemen */
        await loadTimings();
        render();
      }catch(err){
        console.warn('[stopTiming] failed:', err && err.message);
        /* NIET weggooien: lokaal bewaren en later opnieuw proberen. */
        savePendingTimings([...loadPendingTimings(), rec]);
        showToast(t('timing_save_fail') + t('timing_queued_note'), 'warn');
      }
    } else {
      /* Offline: meting lokaal bewaren; wordt verstuurd zodra cloud terug is. */
      savePendingTimings([...loadPendingTimings(), rec]);
      showToast(t('timing_queued_note'), 'warn');
    }
  }

  function cancelTiming(){
    if(!requireAdmin()) return;
    activeTiming = null; saveActiveTiming();
    showToast(t('timing_cancelled'), 'ok');
    render();
  }

  async function loadTimings(){
    if(!sb || !isAdmin()) return;
    try{
      /* 1) Klassieke metingen uit ombouw_timings. */
      const { data, error } = await sb.from('ombouw_timings')
        .select('*').order('ended_at', { ascending:false }).limit(100);
      if(error) throw error;
      let rows = (data || []).map(r=> Object.assign({ _src:'timing' }, r));

      /* 2) Nieuwe timer-metingen uit machine_states (Fase 3+): afgeronde
         machines mét timer. Zo tellen ze mee in KPI, dashboard en tijden. */
      try{
        const { data: machines } = await sb.from('machine_states')
          .select('*').eq('had_timer', true)
          .in('status', ['completed','completed_reported','timed'])
          .order('ended_at', { ascending:false }).limit(200);
        if(machines && machines.length){
          /* Sessies erbij voor van→naar combo. */
          const sIds = [...new Set(machines.map(m=>m.session_id).filter(Boolean))];
          let sById = {};
          if(sIds.length){
            const { data: sess } = await sb.from('ombouw_sessions').select('*').in('id', sIds);
            (sess||[]).forEach(x=>{ sById[x.id] = x; });
          }
          machines.forEach(m=>{
            if(!(m.duration_sec > 0)) return;   /* zonder echte duur niet meetellen */
            const s = sById[m.session_id] || {};
            rows.push({
              _src:'machine', id:'ms_'+m.id,
              duration_sec: m.duration_sec,
              ended_at: m.ended_at || m.completed_at || m.updated_at,
              from_combo: s.from_combo || '', to_combo: s.to_combo || '',
              section: m.section || '', line: m.line || '',
              line_group: s.line_group || ''
            });
          });
        }
      }catch(e){ /* machine_states nog niet aanwezig? klassieke metingen blijven werken. */ }

      /* Nieuwste eerst, op einddatum. */
      rows.sort((a,b)=> new Date(b.ended_at||0) - new Date(a.ended_at||0));
      recentTimings = rows;
    }catch(err){
      console.warn('[loadTimings] failed:', err && err.message);
      recentTimings = [];
    }
  }

  function formatDuration(sec){
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    if(h>0) return h+'u ' + String(m).padStart(2,'0') + 'm';
    if(m>0) return m+'m ' + String(s).padStart(2,'0') + 's';
    return s+'s';
  }

  let lastReportCount = -1;   /* -1 = nog niet geladen; voorkomt toast bij eerste load */

  async function loadReports(){
    if(!sb || !isAdmin()) return;
    try{
      const { data, error } = await sb.from('value_reports')
        .select('*').order('created_at', { ascending:false }).limit(200);
      if(error) throw error;
      const prev = lastReportCount;
      pendingReports = data || [];
      /* Nieuwe melding(en) sinds vorige keer? Toon een toast (niet bij de
         allereerste load, en alleen als het aantal is toegenomen). */
      if(prev >= 0 && pendingReports.length > prev){
        const nieuw = pendingReports.length - prev;
        showToast(t('new_reports').replace('{n}', nieuw), 'warn');
      }
      lastReportCount = pendingReports.length;
    }catch(err){
      console.warn('[loadReports] failed:', err && err.message);
      pendingReports = [];
    }
  }

  /* ── DASHBOARD: visuele analyse van ombouw-tijden (admin-only) ──
     Bouwt op dezelfde recentTimings data. Toont KPI's, een balkgrafiek van
     gemiddelde tijd per ombouw-paar, en een maand-trend. Puur SVG, geen libs. */
  function renderDashboard(){
    const ex = document.getElementById('dashboard-overlay');
    if(ex) ex.remove();
    if(!isAdmin()) return;

    const T = recentTimings.slice();
    const fmt = s => formatDuration(s);

    /* KPI's */
    const total = T.length;
    const allDur = T.map(r=>r.duration_sec||0).filter(x=>x>0);
    const avgAll = allDur.length ? Math.round(allDur.reduce((a,b)=>a+b,0)/allDur.length) : 0;
    /* deze maand vs vorige maand */
    const now = new Date();
    const ym = d => { const x=new Date(d); return x.getFullYear()*12 + x.getMonth(); };
    const curYM = now.getFullYear()*12 + now.getMonth();
    const thisMonth = T.filter(r=> r.ended_at && ym(r.ended_at)===curYM).map(r=>r.duration_sec||0).filter(x=>x>0);
    const prevMonth = T.filter(r=> r.ended_at && ym(r.ended_at)===curYM-1).map(r=>r.duration_sec||0).filter(x=>x>0);
    const avgThis = thisMonth.length ? Math.round(thisMonth.reduce((a,b)=>a+b,0)/thisMonth.length) : 0;
    const avgPrev = prevMonth.length ? Math.round(prevMonth.reduce((a,b)=>a+b,0)/prevMonth.length) : 0;
    const trendPct = (avgPrev && avgThis) ? Math.round((avgThis-avgPrev)/avgPrev*100) : 0;

    /* Balkgrafiek: gemiddelde per ombouw-paar (top 8 traagste) */
    const groups = {};
    T.forEach(r=>{
      const key = (r.from_combo||'?') + ' → ' + (r.to_combo||'?');
      if(!groups[key]) groups[key]=[];
      groups[key].push(r.duration_sec||0);
    });
    const bars = Object.keys(groups).map(k=>{
      const arr = groups[k].filter(x=>x>0);
      const avg = arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : 0;
      return { key:k, avg, n:groups[k].length };
    }).sort((a,b)=>b.avg-a.avg).slice(0,8);
    const maxAvg = bars.length ? Math.max(...bars.map(b=>b.avg)) : 1;

    const barsSvg = bars.length ? bars.map((b,i)=>{
      const w = Math.max(2, Math.round(b.avg/maxAvg*100));
      return `
        <div class="dash-bar-row">
          <div class="dash-bar-label" title="${escapeHtml(b.key)}">${escapeHtml(b.key)}</div>
          <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${w}%"></div></div>
          <div class="dash-bar-val">${fmt(b.avg)} <span class="dash-bar-n">·${b.n}×</span></div>
        </div>`;
    }).join('') : `<div class="photo-empty">${t('timings_none')}</div>`;

    /* Maand-trend: laatste 6 maanden gemiddelde */
    const byMonth = {};
    T.forEach(r=>{
      if(!r.ended_at) return;
      const d=new Date(r.ended_at); const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      if(!byMonth[key]) byMonth[key]=[];
      if(r.duration_sec>0) byMonth[key].push(r.duration_sec);
    });
    const months = [];
    for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
    const monthAvgs = months.map(m=>{ const a=byMonth[m]||[]; return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0; });
    const maxMonth = Math.max(1, ...monthAvgs);
    const trendSvg = `
      <div class="dash-trend">
        ${months.map((m,i)=>{
          const h = monthAvgs[i] ? Math.max(4, Math.round(monthAvgs[i]/maxMonth*90)) : 0;
          const lbl = m.slice(5)+'/'+m.slice(2,4);
          return `<div class="dash-trend-col">
            <div class="dash-trend-bar-wrap"><div class="dash-trend-bar" style="height:${h}px" title="${monthAvgs[i]?fmt(monthAvgs[i]):'—'}"></div></div>
            <div class="dash-trend-val">${monthAvgs[i]?fmt(monthAvgs[i]):'—'}</div>
            <div class="dash-trend-lbl">${lbl}</div>
          </div>`;
        }).join('')}
      </div>`;

    const trendBadge = avgPrev && avgThis
      ? `<span class="dash-trend-badge ${trendPct<=0?'good':'bad'}">${trendPct<=0?'▼':'▲'} ${Math.abs(trendPct)}%</span>`
      : '';

    const div = document.createElement('div');
    div.className = 'photo-overlay';
    div.id = 'dashboard-overlay';
    div.innerHTML = `
      <div class="photo-box" style="max-width:640px">
        <div class="photo-header">
          <span class="photo-title">📊 ${t('dashboard_title')}</span>
          <button class="photo-close" data-action="dash-close" aria-label="${t('close')}">✕</button>
        </div>
        <div class="photo-body" style="align-items:stretch;gap:14px">
          <div class="dash-kpis">
            <div class="dash-kpi"><div class="dash-kpi-val">${total}</div><div class="dash-kpi-lbl">${t('dash_total')}</div></div>
            <div class="dash-kpi"><div class="dash-kpi-val">${avgAll?fmt(avgAll):'—'}</div><div class="dash-kpi-lbl">${t('dash_avg_all')}</div></div>
            <div class="dash-kpi"><div class="dash-kpi-val">${avgThis?fmt(avgThis):'—'} ${trendBadge}</div><div class="dash-kpi-lbl">${t('dash_this_month')}</div></div>
          </div>
          <div>
            <div class="health-key" style="margin-bottom:8px">${t('dash_slowest')}</div>
            <div class="dash-bars">${barsSvg}</div>
          </div>
          <div>
            <div class="health-key" style="margin-bottom:8px">${t('dash_trend')}</div>
            ${trendSvg}
          </div>
        </div>
      </div>`;
    document.body.appendChild(div);
    div.addEventListener('click', e=>{ if(e.target===div) div.remove(); });
    div.querySelector('[data-action="dash-close"]').addEventListener('click', ()=> div.remove());
  }

  async function resolveReport(id){
    if(!requireAdmin()) return;
    if(!sb) return;
    try{
      const { error } = await sb.from('value_reports').delete().eq('id', id);
      if(error) throw error;
      pendingReports = pendingReports.filter(r=> String(r.id)!==String(id)); lastReportCount = pendingReports.length;
      showToast(t('report_resolved'), 'ok');
      renderReportsPanel();
      render();
    }catch(err){
      showToast(t('report_fail') + ((err && err.message) || ''), 'err');
    }
  }

  /* Zoek het interne section-id en biscuit-id terug uit de opgeslagen
     labels van een melding, binnen de juiste lijngroep. */
  function reportContextFromReport(r){
    const grp = r.line_group || PILOT_GROUP;
    const cfg = GROUP_CONFIG[grp] || GROUP_CONFIG[PILOT_GROUP];
    if(!cfg) return null;
    /* section: titel → id */
    let sectionId = null;
    Object.keys(cfg.sectionTitles || {}).forEach(id=>{
      if(cfg.sectionTitles[id] === r.section) sectionId = id;
    });
    /* product: label → id */
    let biscuitId = null;
    (cfg.biscuits || []).forEach(b=>{ if(b.label === r.product) biscuitId = b.id; });
    if(!sectionId || !biscuitId) return null;
    return { grp, sectionId, biscuitId, format: r.format || '', line: r.line || '' };
  }

  async function applyReport(id){
    if(!requireAdmin()) return;
    const r = pendingReports.find(x=> String(x.id)===String(id));
    if(!r){ return; }
    const val = (r.suggested_value || '').trim();
    if(!val){ showToast(t('report_apply_noval'), 'warn'); return; }
    if(isPlaceholderValue(val)){ showToast(t('save_placeholder_blocked'), 'warn'); return; }

    const ctx = reportContextFromReport(r);
    if(!ctx){ showToast(t('report_apply_ctxfail'), 'err'); return; }

    /* Store-sleutel exact opbouwen voor de context van de melding
       (onafhankelijk van wat er nu open staat in de UI). */
    const sk = buildStoreKeyForGroup(ctx.grp, ctx.sectionId, ctx.biscuitId, ctx.format, ctx.line);

    const store = getStore();
    if(!store.currentValues[sk]) store.currentValues[sk] = {};
    const oldVal = store.currentValues[sk][r.param] != null ? store.currentValues[sk][r.param] : (r.current_value || '');
    store.currentValues[sk][r.param] = String(val);

    /* Audit + versie bijwerken, met de context van de melding */
    const auditEntry = {
      ts: nowStr(),
      afdeling: r.afdeling || '', lineGroup: ctx.grp, lineLabel: r.line_label || '',
      section: r.section, line: ctx.line || '',
      toBiscuit: r.product, toFormat: ctx.format,
      param: r.param, old: String(oldVal), new_: String(val),
      note: t('report_applied_note'), action:'saved', changedBy: operatorDisplayName() || ''
    };
    store.auditLog.unshift(auditEntry);

    if(!store.versions[sk]) store.versions[sk] = [];
    const versionToPush = {
      v: (store.versions[sk].length + 1), ts: nowStr(), locked:true,
      changes: [{ param:r.param, old:String(oldVal), new_:String(val), note:t('report_applied_note') }],
      vid: (Date.now().toString(36) + Math.random().toString(36).slice(2,8))
    };
    store.versions[sk].unshift(versionToPush);
    saveStore(store);

    setSyncStatus('syncing');
    try{
      await Promise.all([
        pushSavedValue(sk, r.param, val),
        pushAuditEntry(auditEntry),
        pushVersion(sk, versionToPush)
      ]);
    }catch(e){}

    /* Melding is verwerkt → verwijder uit de lijst en cloud */
    try{ if(sb) await sb.from('value_reports').delete().eq('id', id); }catch(e){}
    pendingReports = pendingReports.filter(x=> String(x.id)!==String(id)); lastReportCount = pendingReports.length;

    showToast(t('report_applied') + ' ' + escapeHtml(r.param) + ' → ' + escapeHtml(val), 'ok');
    setSyncStatus(loadQueue().length ? 'queued' : (navigator.onLine ? 'synced' : 'offline'));
    renderReportsPanel();
    render();
  }

  /* ── BACKUP IMPORT / RESTORE (admin-only) ── */
  function handleBackupFile(file){
    if(!requireAdmin()) return;
    const reader = new FileReader();
    reader.onload = function(){
      let data;
      try{ data = JSON.parse(reader.result); }
      catch(e){ showToast(t('import_invalid'), 'err'); return; }
      /* validatie: verwachte structuur */
      if(!data || data.app !== 'pally-ombouwen' || typeof data.currentValues !== 'object'){
        showToast(t('import_invalid'), 'err'); return;
      }
      const counts = {
        cv: Object.keys(data.currentValues||{}).length,
        ver: Object.keys(data.versions||{}).length,
        aud: (data.auditLog||[]).length,
        ph: Object.keys(data.photoRegistry||{}).length
      };
      showImportConfirm(data, counts);
    };
    reader.onerror = function(){ showToast(t('import_invalid'), 'err'); };
    reader.readAsText(file);
  }

  function showImportConfirm(data, counts){
    const ex = document.getElementById('import-overlay');
    if(ex) ex.remove();
    const div = document.createElement('div');
    div.className = 'photo-overlay';
    div.id = 'import-overlay';
    div.innerHTML = `
      <div class="photo-box" style="max-width:440px">
        <div class="photo-header">
          <span class="photo-title">⬆ ${t('import_title')}</span>
          <button class="photo-close" data-action="import-close" aria-label="${t('close')}">✕</button>
        </div>
        <div class="photo-body" style="align-items:stretch;gap:10px">
          <div class="health-row"><span class="health-key">${t('col_value')}s</span><span class="health-val">${counts.cv}</span></div>
          <div class="health-row"><span class="health-key">${t('tab_versions').replace('◷ ','')}</span><span class="health-val">${counts.ver}</span></div>
          <div class="health-row"><span class="health-key">${t('tab_log').replace('≡ ','')}</span><span class="health-val">${counts.aud}</span></div>
          <div class="health-row"><span class="health-key">Foto's</span><span class="health-val">${counts.ph}</span></div>
          <div class="report-hint">${t('import_explain')}</div>
          <button class="btn-primary" data-action="import-merge">${t('import_merge')}</button>
          <button class="btn-ghost photo-del" data-action="import-replace">${t('import_replace')}</button>
        </div>
      </div>`;
    document.body.appendChild(div);
    div.addEventListener('click', e=>{ if(e.target===div) div.remove(); });
    div.querySelector('[data-action="import-close"]').addEventListener('click', ()=> div.remove());
    div.querySelector('[data-action="import-merge"]').addEventListener('click', ()=>{ applyBackup(data, 'merge'); div.remove(); });
    div.querySelector('[data-action="import-replace"]').addEventListener('click', ()=>{
      if(confirm(t('import_replace_confirm'))){ applyBackup(data, 'replace'); div.remove(); }
    });
  }

  function applyBackup(data, mode){
    if(!requireAdmin()) return;
    const store = getStore();
    if(mode === 'replace'){
      store.currentValues = data.currentValues || {};
      store.versions = data.versions || {};
      store.auditLog = data.auditLog || [];
    } else { /* merge: voeg toe zonder bestaande te wissen */
      const cv = store.currentValues || {};
      Object.keys(data.currentValues||{}).forEach(sk=>{
        cv[sk] = Object.assign({}, data.currentValues[sk], cv[sk]); /* bestaande lokale wint */
      });
      store.currentValues = cv;
      const ver = store.versions || {};
      Object.keys(data.versions||{}).forEach(sk=>{ if(!ver[sk]) ver[sk] = data.versions[sk]; });
      store.versions = ver;
      const seen = new Set((store.auditLog||[]).map(e=> e.ts+'|'+e.param));
      (data.auditLog||[]).forEach(e=>{ if(!seen.has(e.ts+'|'+e.param)) store.auditLog.push(e); });
    }
    saveStore(store);
    showToast(t('import_done'), 'ok');
    /* optioneel naar cloud pushen */
    if(sb && isAdmin() && confirm(t('import_push_cloud'))){
      pushImportedToCloud(store).then(()=> render());
    } else {
      render();
    }
  }

  async function pushImportedToCloud(store){
    if(!sb || !isAdmin()) return;
    try{
      const cv = store.currentValues || {};
      for(const sk of Object.keys(cv)){
        for(const pk of Object.keys(cv[sk])){
          await pushSavedValue(sk, pk, cv[sk][pk], true);
        }
      }
      showToast(t('import_pushed'), 'ok');
    }catch(err){
      showToast(t('sync_err') + ((err && err.message)||''), 'err');
    }
  }

  /* Kolomindex (1-based, A=1) → app-kolom voor live waarden. */
  const CAV_LIVE_COLS = {
    6:  { biscuit:'koffiekoek', format:'5x4' },   /* F */
    8:  { biscuit:'koffiekoek', format:'5x5' },   /* H = XXL */
    12: { biscuit:'theekokos',  format:'4x4' },   /* L */
    16: { biscuit:'richtea',    format:'5x6' }    /* P */
  };

  function cavTextColor(bg){
    if(!bg) return '#000';
    const r=parseInt(bg.slice(0,2),16), g=parseInt(bg.slice(2,4),16), b=parseInt(bg.slice(4,6),16);
    /* luminantie → donkere achtergrond = witte tekst */
    return (0.299*r+0.587*g+0.114*b) < 140 ? '#fff' : '#000';
  }

  /* Live waarde voor een cel (kolomindex + parameternaam uit kolom B van die rij). */
  function cavLiveValue(colIdx, paramName, line){
    const m = CAV_LIVE_COLS[colIdx];
    if(!m || !paramName) return null;
    const store = getStore();
    const sk = `${state.selectedLineGroup||PILOT_GROUP}|cavanna|${m.biscuit}|${packageFormat('cavanna', m.biscuit, m.format)}|${line||''}`;
    let base = null;
    if(state.data){
      const dataKey = (m.biscuit==='theekokos') ? 'theekokos' : m.format;
      const src = (String(line)==='10') ? state.data.cavanna10 : state.data.cavanna9;
      const vals = (src && src.values && src.values[dataKey]) || {};
      if(vals[paramName] != null) base = vals[paramName];
    }
    const v = getOfficialValue(store, sk, paramName, base);
    return (v==null||v==='') ? null : String(v);
  }

  /* Echte PDF-download (jsPDF + autotable) met dezelfde kleuren als de print. */
  function pdfCavannaSheet(line){
    if(!requireAdmin()) return;
    const jsPDFctor = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : (window.jsPDF || null);
    if(!jsPDFctor || !window.jspdf){ showToast(t('pdf_lib_missing'), 'warn'); return; }
    const sheetKey = (String(line)==='10') ? 'CAV 10' : 'CAV 9';
    const g = CAV_GRID[sheetKey];
    if(!g){ return; }

    const doc = new jsPDFctor({ orientation:'landscape', unit:'mm', format:'a4' });

    /* Bouw rijen: [#, Parameter, Type, Koffiekoek(F), XXL(H), Thee/Kokos(L), RichTea(P)]
       plus celkleuren onthouden voor didParseCell. */
    const head = [['#','Parameter','Type','Koffiekoek 220','XXL','Thee / Kokos','Rich Tea']];
    const bodyData = [];
    const colorMap = {};   /* "r_c" → hexkleur */
    let outR = 0;
    for(let r=1; r<=g.maxrow; r++){
      const rc = g.cells[r-1];
      const num = (rc[0]&&rc[0][0])?rc[0][0].trim():'';
      const nm  = (rc[1]&&rc[1][0])?rc[1][0].trim():'';
      const ty  = (rc[2]&&rc[2][0])?rc[2][0].trim():'';
      /* sectiekop: kolom A gevuld, B leeg */
      if(num && !nm){
        bodyData.push([{content:num, colSpan:7, styles:{fillColor:[217,200,169],fontStyle:'bold',halign:'left'}}]);
        outR++; continue;
      }
      if(!num && !nm) continue; /* lege/continuatie-rij overslaan in PDF */
      const paramName = (num?num+' ':'')+nm;
      const cells = [num, nm, ty];
      [6,8,12,16].forEach(ci=>{
        let v = (rc[ci-1]&&rc[ci-1][0])?rc[ci-1][0]:'';
        const lv = cavLiveValue(ci, paramName, line);
        if(lv!=null) v = lv;
        const bg = (rc[ci-1]&&rc[ci-1][1])?rc[ci-1][1]:'';
        if(bg) colorMap[outR+'_'+cells.length] = bg;
        cells.push(String(v));
      });
      bodyData.push(cells);
      outR++;
    }

    doc.autoTable({
      head: head, body: bodyData, startY: 12, margin:{ left:6, right:6, top:10 },
      styles:{ fontSize:6, cellPadding:0.8, lineColor:[150,150,150], lineWidth:0.1, overflow:'linebreak' },
      headStyles:{ fillColor:[229,231,235], textColor:[0,0,0], fontSize:6, fontStyle:'bold' },
      columnStyles:{ 0:{cellWidth:9}, 1:{cellWidth:58,halign:'left'}, 2:{cellWidth:20}, 3:{cellWidth:'auto'}, 4:{cellWidth:'auto'}, 5:{cellWidth:'auto'}, 6:{cellWidth:'auto'} },
      didParseCell: function(data){
        if(data.section!=='body') return;
        const key = data.row.index+'_'+data.column.index;
        const hex = colorMap[key];
        if(hex){
          const r=parseInt(hex.slice(0,2),16),gg=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
          data.cell.styles.fillColor=[r,gg,b];
          data.cell.styles.textColor = (0.299*r+0.587*gg+0.114*b)<140 ? [255,255,255] : [0,0,0];
          data.cell.styles.fontStyle='bold';
        }
      }
    });
    doc.setFontSize(11); doc.text('Cavanna '+line, 6, 9);
    const stamp = new Date().toISOString().slice(0,10);
    doc.save('Cavanna-'+line+'-'+stamp+'.pdf');
    showToast(t('pdf_done'), 'ok');
  }

  function printCavannaSheet(line){
    if(!requireAdmin()) return;
    const sheetKey = (String(line)==='10') ? 'CAV 10' : 'CAV 9';
    const g = CAV_GRID[sheetKey];
    if(!g){ showToast('Geen sjabloon', 'warn'); return; }

    /* Merge-info verwerken: welke cellen overslaan + rowspan/colspan op ankercel. */
    const skip = {}, span = {};
    (g.merges||[]).forEach(rng=>{
      const m = rng.match(/([A-Z]+)(\d+):([A-Z]+)(\d+)/);
      if(!m) return;
      const c2i = s => { let n=0; for(const ch of s) n=n*26+(ch.charCodeAt(0)-64); return n; };
      const c1=c2i(m[1]), r1=+m[2], c2=c2i(m[3]), r2=+m[4];
      span[`${r1}_${c1}`] = { rs:(r2-r1+1), cs:(c2-c1+1) };
      for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){ if(r===r1&&c===c1) continue; skip[`${r}_${c}`]=1; }
    });

    /* Zichtbare kolommen: sla lege spacer-kolommen D(4),J(10),O(15) over voor nettere print. */
    const HIDE_COLS = { };  /* niets verbergen → 100%% getrouw */
    const NCOLS = 18;

    let bodyRows = '';
    for(let r=1; r<=g.maxrow; r++){
      const rowCells = g.cells[r-1];
      /* parameternaam van deze rij = kolom B (index 2) */
      const paramNum = (rowCells[0] && rowCells[0][0]) ? rowCells[0][0].trim() : '';
      const paramNm  = (rowCells[1] && rowCells[1][0]) ? rowCells[1][0].trim() : '';
      const paramName = (paramNum ? paramNum + ' ' : '') + paramNm;
      let tds = '';
      for(let c=1; c<=NCOLS; c++){
        if(HIDE_COLS[c]) continue;
        if(skip[`${r}_${c}`]) continue;
        const cell = rowCells[c-1] || ['',''];
        let val = cell[0]||'';
        const bg = cell[1]||'';
        /* Live overschrijven voor hoofd-waardekolommen op parameter-rijen */
        if(CAV_LIVE_COLS[c] && paramNm){
          const lv = cavLiveValue(c, paramName, line);
          if(lv!=null) val = lv;
        }
        const sp = span[`${r}_${c}`] || {rs:1,cs:1};
        const attrs = (sp.rs>1?` rowspan="${sp.rs}"`:'') + (sp.cs>1?` colspan="${sp.cs}"`:'');
        const style = bg ? ` style="background:#${bg};color:${cavTextColor(bg)}"` : '';
        tds += `<td${attrs}${style}>${escapeHtml(val)}</td>`;
      }
      bodyRows += `<tr>${tds}</tr>`;
    }

  function exportBackup(){
    if(!requireAdmin()) return;
    try{
      const store = getStore();
      const backup = {
        app: 'pally-ombouwen', version: APP_VERSION, exported_at: new Date().toISOString(),
        exported_by: auth.email || '',

        currentValues: store.currentValues || {},

        auditLog: store.auditLog || [],
        photoRegistry: photoRegistry || {}
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0,10);
      a.href = url; a.download = 'pally-ombouwen-backup-' + stamp + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
      showToast(t('backup_done'), 'ok');
    }catch(err){
      showToast(t('backup_fail') + ((err && err.message) || ''), 'err');

  /* Mini-sparkline (inline SVG) van een reeks waarden — geen libraries. */
  function adminSparkline(vals){
    if(!vals || vals.length < 2) return '';
    const w = 76, h = 24;
    const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    const span = (max - min) || 1;
    const step = w / (vals.length - 1);
    const pts = vals.map((v,i)=> (i*step).toFixed(1) + ',' + (h - 3 - ((v - min)/span) * (h - 6)).toFixed(1)).join(' ');
    return `<svg class="admin-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  /* Korte relatieve tijd voor ISO-datums ("2u geleden"); anders de string zelf. */
  function adminShortWhen(s){
    if(!s) return '';
    const d = new Date(s);
    if(isNaN(d.getTime())) return String(s).replace(/ \d{4},/, ','); /* "10 jul, 21:26" */
    const mins = Math.round((Date.now() - d.getTime())/60000);
    if(mins < 1) return t('admin_now');
    if(mins < 60) return mins + 'm';
    const hrs = Math.round(mins/60);
    if(hrs < 24) return hrs + t('admin_hours_short');
    const days = Math.round(hrs/24);
    return days + t('admin_days_short');
  }

  /* Activiteiten-feed: recentste waarde-wijzigingen (audit) + afgeronde
     ombouw-metingen, gemengd en gesorteerd. Alleen-lezen — raakt niets aan. */
  function adminActivityItems(){
    const items = [];
    const store = getStore();
    (store.auditLog||[]).slice(0,8).forEach(e=>{
      items.push({ sort: new Date(e.ts).getTime() || 0, kind:'change',
        param:e.param||'', old:e.old||'', new_:e.new_||'',
        who:(e.changedBy||'').split('@')[0], when: adminShortWhen(e.ts),
        line: e.line ? (getSectionTitle(e.section)+' '+e.line) : (e.section||'') });
    });
    /* Afgeronde ombouwen (machine-status) — met operator, ploeg, machine,
       productwissel en of er een timer liep of alleen Check & Verify. */
    ombouwHistory.slice(0,8).forEach(r=>{
      items.push({ sort: new Date(r.completed_at).getTime() || 0, kind:'ombouw',
        machine: r.machine,
        reported: r.status === 'completed_reported',
        dur: r.had_timer ? formatDuration(r.duration_sec||0) : '',
        checkOnly: !r.had_timer,
        who: r.operator || '', ploeg: r.ploeg || '',
        combo: ((r.from_combo||'') + ' → ' + (r.to_combo||'')).trim(),
        when: adminShortWhen(r.completed_at) });
    });
    items.sort((a,b)=> b.sort - a.sort);
    return items.slice(0,6);
  }

    /* KPI's: klikbare cijfers, met sparkline en maand-trend. */
    const durations = recentTimings.map(r=>r.duration_sec||0).filter(x=>x>0);
    const avgSec = durations.length ? Math.round(durations.reduce((a,b)=>a+b,0)/durations.length) : 0;
    /* Sparkline: laatste 10 metingen, oud → nieuw. */
    const sparkVals = recentTimings.slice(0,10).map(r=>r.duration_sec||0).filter(x=>x>0).reverse();
    /* Trend: gemiddelde deze maand t.o.v. vorige maand (sneller = groen ▼). */
    const ymOf = d => { const x=new Date(d); return isNaN(x)?null:(x.getFullYear()*12+x.getMonth()); };
    const curYM = ymOf(new Date());
    const avgOf = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
    const thisM = avgOf(recentTimings.filter(r=>r.ended_at && ymOf(r.ended_at)===curYM).map(r=>r.duration_sec||0).filter(x=>x>0));
    const prevM = avgOf(recentTimings.filter(r=>r.ended_at && ymOf(r.ended_at)===curYM-1).map(r=>r.duration_sec||0).filter(x=>x>0));
    let trendHtml = '';
    if(thisM && prevM){
      const pct = Math.round(((thisM - prevM) / prevM) * 100);
      if(pct !== 0){

  /* Bindt de acties van het admin-scherm (na render). */
  function bindAdminScreen(){
    const root = document.getElementById('app-shell');
    if(!root) return;
    const eb = root.querySelector('[data-action="export-backup"]');
    if(eb) eb.addEventListener('click', exportBackup);
    const pe = root.querySelector('[data-action="print-excel"]');
    if(pe) pe.addEventListener('click', showPrintChooser);
    const ql = root.querySelector('[data-action="qr-links"]');
    if(ql) ql.addEventListener('click', renderQrLinksPanel);
    const vo = root.querySelector('[data-action="view-operators"]');
    if(vo) vo.addEventListener('click', renderOperatorsPanel);
    const vh = root.querySelector('[data-action="view-history"]');
    if(vh) vh.addEventListener('click', ()=>{ loadOmbouwHistory().then(()=> renderHistoryPanel()); renderHistoryPanel(); });
    /* view-reports/dashboard/timings kunnen twee keer voorkomen (KPI + tegel),
       dus bind ze allemaal. */
    root.querySelectorAll('[data-action="view-reports"]').forEach(el=> el.addEventListener('click', renderReportsPanel));
    root.querySelectorAll('[data-action="view-timings"]').forEach(el=> el.addEventListener('click', renderTimingsPanel));
    root.querySelectorAll('[data-action="view-dashboard"]').forEach(el=> el.addEventListener('click', renderDashboard));
    const imp = root.querySelector('[data-action="import-backup"]');
    const fileInp = document.getElementById('backup-file-input');
    if(imp && fileInp){
      imp.addEventListener('click', ()=> fileInp.click());
      fileInp.addEventListener('change', e=>{
        const f = e.target.files && e.target.files[0];
        if(f) handleBackupFile(f);
        e.target.value = '';
      });
    }
  }

  /* ── Ombouw-historie (Fase 4) ──
     Alle afgeronde machines (status completed / completed_reported) uit
     machine_states, met bijbehorende sessie-info voor productwissel. */
  let ombouwHistory = [];      // ruwe rijen (machine + sessie)
  let historyFilters = { ploeg:'', operator:'', section:'', line:'', product:'', date:'' };

  async function loadOmbouwHistory(){
    ombouwHistory = [];
    if(!sb || !isAdmin()) return;
    try{
      const { data: machines } = await sb.from('machine_states')
        .select('*').in('status', ['completed','completed_reported'])
        .order('completed_at', { ascending:false }).limit(500);
      if(!machines || !machines.length) return;
      /* Sessies erbij halen voor van→naar combo. */
      const sessIds = [...new Set(machines.map(m=>m.session_id).filter(Boolean))];
      let sessById = {};
      if(sessIds.length){
        const { data: sessions } = await sb.from('ombouw_sessions')
          .select('*').in('id', sessIds);
        (sessions||[]).forEach(s=>{ sessById[s.id] = s; });
      }
      ombouwHistory = machines.map(m=>{
        const s = sessById[m.session_id] || {};
        return {
          id: m.id,
          section: m.section || '', line: m.line || '',
          machine: m.label || (getSectionTitle(m.section) + (m.line?(' '+m.line):'')),
          status: m.status,
          operator: m.completed_by || m.started_by || '',
          ploeg: m.ploeg || s.ploeg || '',
          from_combo: s.from_combo || '', to_combo: s.to_combo || '',
          product: (s.to_combo || '').trim(),
          line_group: s.line_group || '',
          completed_at: m.completed_at || m.updated_at || '',
          had_timer: !!m.had_timer,
          duration_sec: m.duration_sec || 0
        };
      });
    }catch(e){ ombouwHistory = []; }
  }

  function historyFilterOptions(){
    const uniq = (arr)=> [...new Set(arr.filter(Boolean))].sort();
    return {
      ploeg:    uniq(ombouwHistory.map(r=>r.ploeg)),
      operator: uniq(ombouwHistory.map(r=>r.operator)),
      section:  uniq(ombouwHistory.map(r=>r.section)),
      line:     uniq(ombouwHistory.map(r=>r.line)),
      product:  uniq(ombouwHistory.map(r=>r.product))
    };
  }
  function filteredHistory(){
    const f = historyFilters;
    return ombouwHistory.filter(r=>{
      if(f.ploeg    && r.ploeg    !== f.ploeg) return false;
      if(f.operator && r.operator !== f.operator) return false;
      if(f.section  && r.section  !== f.section) return false;
      if(f.line     && String(r.line) !== String(f.line)) return false;
      if(f.product  && r.product  !== f.product) return false;
      if(f.date){
        /* Datumfilter op lokale (NL) datum YYYY-MM-DD. */
        const d = new Date(r.completed_at);
        if(isNaN(d.getTime())) return false;
        const nl = new Intl.DateTimeFormat('en-CA', { timeZone:'Europe/Amsterdam', year:'numeric', month:'2-digit', day:'2-digit' }).format(d);
        if(nl !== f.date) return false;
      }
      return true;
    });
  }

  /* ═══════════════════════════════════════
     TOASTS — zichtbare meldingen i.p.v. console.warn
  ═══════════════════════════════════════ */
  function showToast(msg, type){
    try{
      var t = document.createElement('div');
      t.className = 'pally-toast ' + (type || '');
      t.textContent = msg;
      document.body.appendChild(t);

  /* ═══════════════════════════════════════
     SYNC QUEUE — mislukte writes gaan in een wachtrij
     (localStorage) en worden automatisch opnieuw geprobeerd.
     Geen stille dataverliezen meer.
  ═══════════════════════════════════════ */
  const QUEUE_KEY_BASE = 'pally_sync_queue';
  /* #3: wachtrij per gebruiker. Op een gedeelde tablet mag admin B nooit de
     gequeuede wijzigingen van admin A wegschrijven onder zijn eigen account. */
  function queueKey(){ return auth.userId ? (QUEUE_KEY_BASE + ':' + auth.userId) : QUEUE_KEY_BASE; }
  function loadQueue(){ try{ return JSON.parse(localStorage.getItem(queueKey())||'[]'); }catch(e){ return []; } }
  function saveQueue(q){ try{ localStorage.setItem(queueKey(), JSON.stringify(q)); }catch(e){} }
  function enqueue(op){
    const q = loadQueue(); q.push(op); saveQueue(q);
    setSyncStatus('queued');
  }
  let flushing = false;
  async function flushSyncQueue(){
    if(flushing || !sb || !navigator.onLine) return;
    /* Extra slot: alleen admin mag de wachtrij wegschrijven. Een operator
       (of een achtergebleven wachtrij na rolwissel) synct nooit. */
    if(!isAdmin()) return;
    let q = loadQueue();
    if(!q.length) return;
    flushing = true;
    setSyncStatus('syncing');
    const remaining = [];
    let authBlocked = false;
    for(const op of q){
      let ok = false;
      try{
        if(op.t==='value')   ok = await pushSavedValue(op.a, op.b, op.c, true);
        if(op.t==='audit')   ok = await pushAuditEntry(op.a, true);
        if(op.t==='version') ok = await pushVersion(op.a, op.b, true);
      }catch(e){ ok = false; }
      if(!ok) remaining.push(op);
    }
    saveQueue(remaining);
    flushing = false;

    /* Als er nog items vastzitten en de gebruiker niet (meer) is ingelogd,
       is de oorzaak vrijwel zeker dat RLS de schrijfactie blokkeert.
       Vraag dan opnieuw inloggen i.p.v. stil te blijven proberen. */
    if(remaining.length && sb && !isAdmin()){
      authBlocked = true;
    }

    if(remaining.length){
      setSyncStatus('queued');
      if(authBlocked){
        showToast('⚠ ' + remaining.length + ' — ' + t('not_saved_relogin'), 'err');
      }
    } else {
      setSyncStatus('synced');
      if(q.length) showToast(t('sync_all_done'), 'ok');
    }
  }
  setInterval(flushSyncQueue, 30000);

  /* ═══════════════════════════════════════
     SYNC STATUS
  ═══════════════════════════════════════ */
  let syncStatus = 'idle';
  function setSyncStatus(s){
    syncStatus = s;
    const el = document.getElementById('sync-indicator');
    if(!el) return;
    const qn = loadQueue().length;
    const cfg = ({
      idle:    { color:'#475569', label:'·' },
      syncing: { color:'#f59e0b', label:'⟳ Sync…' },
      synced:  { color:'#22c55e', label:'✓ Synced' },
      queued:  { color:'#f59e0b', label:'⟳ ' + qn + ' in wachtrij' },
      offline: { color:'#64748b', label:'⊘ Offline' },
      error:   { color:'#ef4444', label:'! Sync fout' }
    })[s] || {color:'#475569', label:'·'};
    el.style.color = cfg.color;
    el.style.borderColor = cfg.color + '40';
    el.textContent = cfg.label;
  }

  /* Sync diagnose: test elke tabel apart en toon het exacte foutbericht,
     zodat duidelijk is of het probleem RLS, een ontbrekende tabel of een
     kolom-mismatch is. */
  let lastSyncErrorShown = '';
  async function diagnoseSync(){
    if(!sb) return;
    const lines = [];
    for(const t of ['current_values','versions','audit_log']){
      try{
        const { error } = await sb.from(t).select('*').limit(1);
        lines.push(t + ': ' + (error ? 'FOUT — ' + error.message : 'OK'));
      }catch(e){
        lines.push(t + ': FOUT — ' + ((e && e.message) || 'onbekend'));
      }
    }
    showFatal('SYNC DIAGNOSE\n' + lines.join('\n'));
  }

  let lastPullAt = 0;
  let lastPullStr = '—';
  let pullInFlight = null;
  /* throttled pull: slaat een nieuwe pull over als er recent al één was,
     tenzij force=true. Voorkomt dubbele refetch + geflikker bij snel klikken. */
  async function pullFromCloud(force){
    if(!sb){ setSyncStatus(loadQueue().length ? 'queued' : 'offline'); return; }
    if(pullInFlight) return pullInFlight;
    if(!force && (Date.now() - lastPullAt) < 8000) return;
    pullInFlight = doPullFromCloud().finally(()=>{ pullInFlight = null; lastPullAt = Date.now(); });
    return pullInFlight;
  }

  async function doPullFromCloud(){
    if(!sb){ setSyncStatus(loadQueue().length ? 'queued' : 'offline'); return; }
    await flushSyncQueue();
    setSyncStatus('syncing');
    try {
      const [cv, vs, al] = await Promise.all([
        sb.from('current_values').select('*'),
        sb.from('versions').select('*').order('id', { ascending:false }),
        sb.from('audit_log').select('*').order('id', { ascending:false }).limit(500)
      ]);
      if(cv.error) throw cv.error;
      if(vs.error) throw vs.error;
      if(al.error) throw al.error;

      const store = getStore();
      store.currentValues = {};
      (cv.data || []).forEach(row => {
        if(!store.currentValues[row.store_key]) store.currentValues[row.store_key] = {};
        store.currentValues[row.store_key][row.param_key] = row.value;
      });
      store.versions = {};
      (vs.data || []).forEach(row => {
        if(!store.versions[row.store_key]) store.versions[row.store_key] = [];
        store.versions[row.store_key].push({
          v: row.v, ts: row.ts, changes: row.changes, locked: row.locked, vid: row.vid || null
        });
      });
      store.auditLog = (al.data || []).map(row => ({
        ts: row.ts, section: row.section, line: row.line,
        afdeling: row.afdeling || '', lineGroup: row.line_group || '', lineLabel: row.line_label || '',
        toBiscuit: row.to_biscuit, toFormat: row.to_format,
        param: row.param, old: row.old_value, new_: row.new_value,
        note: row.note || '', action: row.action, changedBy: row.changed_by || ''
      }));

      /* Nog-niet-gesynchroniseerde lokale wijzigingen uit de wachtrij
         opnieuw toepassen, anders zou de pull ze lokaal wissen.
         ALLEEN voor admin — een operator mag nooit oude wachtrij-waarden
         als officiële lokale waarden te zien krijgen. */
      if(isAdmin()){
        loadQueue().forEach(op => {
          if(op.t==='value'){
            if(!store.currentValues[op.a]) store.currentValues[op.a] = {};
            store.currentValues[op.a][op.b] = op.c;
          }
          if(op.t==='audit'){
            store.auditLog.unshift(op.a);
          }
          if(op.t==='version'){
            if(!store.versions[op.a]) store.versions[op.a] = [];
            const arr = store.versions[op.a];
            const i = arr.findIndex(v => v.v === op.b.v);
            if(i >= 0) arr[i] = op.b; else arr.unshift(op.b);
          }
        });
      }

      saveStore(store);
      await loadPhotoRegistry();
      if(isAdmin()) await loadReports();
      if(isAdmin()){ await flushPendingTimings(); await loadTimings(); }
      lastPullStr = nowStr();
      lastSyncErrorShown = '';   /* #33: reset, zodat dezelfde fout later opnieuw meldt */
      setSyncStatus(loadQueue().length ? 'queued' : 'synced');
    } catch(err){
      console.warn('[pullFromCloud] failed:', err && err.message);
      const msg = (err && err.message) || 'onbekende fout';
      if(msg !== lastSyncErrorShown){
        lastSyncErrorShown = msg;
        /* #26: operators zien een simpele melding, geen ruwe DB/RLS-fouten. */
        if(isAdmin()){ showToast(t('sync_err') + msg, 'err'); diagnoseSync(); }
        else { showToast(t('sync_err_simple'), 'err'); }
      }
      setSyncStatus(navigator.onLine ? 'error' : 'offline');
    }
  }

  async function pushSavedValue(storeKey, paramKey, value, fromQueue){
    /* Harde gate: alleen admin mag schrijven of in de wachtrij plaatsen. */
    if(!isAdmin()) return false;
    if(!sb){
      if(!fromQueue) enqueue({ t:'value', a:storeKey, b:paramKey, c:String(value) });
      return false;
    }
    try {
      const { error } = await sb.from('current_values').upsert({
        store_key: storeKey, param_key: paramKey, value: String(value),
        updated_at: new Date().toISOString(), updated_by: auth.email || ''
      }, { onConflict: 'store_key,param_key' });
      if(error) throw error;
      return true;
    } catch(err){
      console.warn('[pushSavedValue] failed:', err && err.message);
      if(!fromQueue){
        enqueue({ t:'value', a:storeKey, b:paramKey, c:String(value) });
        showToast(t('not_synced') + ((err && err.message) || '?') + t('will_retry'), 'warn');
      }
      return false;
    }
  }

  async function pushAuditEntry(entry, fromQueue){
    if(!isAdmin()) return false;
    if(!sb){
      if(!fromQueue) enqueue({ t:'audit', a:entry });
      return false;
    }
    try {
      const { error } = await sb.from('audit_log').insert({
        ts: entry.ts, section: entry.section, line: entry.line || '',
        afdeling: entry.afdeling || '', line_group: entry.lineGroup || '', line_label: entry.lineLabel || '',
        to_biscuit: entry.toBiscuit, to_format: entry.toFormat,
        param: entry.param, old_value: entry.old, new_value: entry.new_,
        note: entry.note || '', action: entry.action, changed_by: entry.changedBy || ''
      });
      if(error) throw error;
      return true;
    } catch(err){
      console.warn('[pushAuditEntry] failed:', err && err.message);
      if(!fromQueue) enqueue({ t:'audit', a:entry });
      return false;
    }
  }

  async function pushVersion(storeKey, version, fromQueue){
    if(!isAdmin()) return false;
    if(!sb){
      if(!fromQueue) enqueue({ t:'version', a:storeKey, b:JSON.parse(JSON.stringify(version)) });
      return false;
    }
    try {
      /* Elke lokaal aangemaakte versie heeft een unieke vid. We matchen op
         vid (niet op v-nummer), zodat een versie van admin A nooit verward
         wordt met die van admin B die toevallig hetzelfde v-nummer koos. */
      let existing = null;
      if(version.vid){
        const { data, error: selErr } = await sb
          .from('versions').select('id,v')
          .eq('store_key', storeKey).eq('vid', version.vid).limit(1);
        if(selErr) throw selErr;
        existing = data;
      }

      if(existing && existing.length){
        const { error } = await sb.from('versions').update({
          ts: version.ts, changes: version.changes, locked: !!version.locked
        }).eq('id', existing[0].id);
        if(error) throw error;
      } else {
        /* Nieuwe versie: bepaal het echte volgende v-nummer uit de cloud
           (MAX(v)+1). Zo overschrijven twee admins die tegelijk opslaan
           elkaars versie niet stilletjes. */
        let vNum = version.v;
        try {
          const { data: maxRows } = await sb
            .from('versions').select('v')
            .eq('store_key', storeKey).order('v', { ascending:false }).limit(1);
          if(maxRows && maxRows.length) vNum = Math.max(version.v, (maxRows[0].v||0) + 1);
        } catch(e){ /* val terug op lokaal v */ }

        const { error } = await sb.from('versions').insert({
          store_key: storeKey, v: vNum, ts: version.ts,
          changes: version.changes, locked: !!version.locked, vid: version.vid || null
        });
        if(error) throw error;

        /* Lokale versie bijwerken zodat verdere changes op hetzelfde
           (nu correcte) nummer landen. */
        if(vNum !== version.v){
          version.v = vNum;
          const st = getStore();
          if(st.versions[storeKey] && st.versions[storeKey][0]) st.versions[storeKey][0].v = vNum;
          saveStore(st);
        }
      }
      return true;
    } catch(err){
      console.warn('[pushVersion] failed:', err && err.message);
      if(!fromQueue) enqueue({ t:'version', a:storeKey, b:JSON.parse(JSON.stringify(version)) });
      return false;
    }
  }

  const CONFIGURED_GROUPS = ['choco-9-10','choco-7-8']; /* heeft navigeerbare structuur */

  const COLOR_MAP = {
