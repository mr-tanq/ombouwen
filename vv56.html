    .flow-block { padding: 11px 13px; }
    .flow-block + .flow-block { border-left: 1px solid var(--border); }
    .flow-block-label { font-family: var(--mono); font-size: 10px; color: var(--text-3); letter-spacing: .16em; text-transform: uppercase; margin-bottom: 4px; }
    .flow-block-value { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flow-block-value.dim   { color: var(--text-3); font-weight: 400; }
    .flow-block-value.amber { color: var(--amber); }
    .flow-arrow-col { display: flex; align-items: center; justify-content: center; padding: 0 9px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--surface-1); font-family: var(--mono); font-size: 11px; color: var(--text-3); }
    .section-tag { margin-top: 7px; display: flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: .06em; }
    .tag-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 6px var(--amber-glow); flex-shrink: 0; }
    .sidebar-sep { height: 1px; background: var(--border); margin: 0 18px 22px; }
    .step-list { display: flex; flex-direction: column; gap: 3px; padding: 0 18px; }
    .step-item {
      display: flex; align-items: center; gap: 11px; padding: 10px 11px;
      border-radius: 8px; cursor: default; border: 1px solid transparent; transition: all .18s ease;
    }
    .step-item.done        { background: rgba(34,197,94,.05);  border-color: rgba(34,197,94,.1); }
    .step-item.active      { background: rgba(245,158,11,.05); border-color: rgba(245,158,11,.12); }
    .step-item.check-active{ background: rgba(6,182,212,.05);  border-color: rgba(6,182,212,.15); }
    .step-num {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      width: 22px; height: 22px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      border: 1px solid var(--border-2); color: var(--text-3); background: var(--surface-1); transition: all .18s ease;
    }
    .step-item.done        .step-num { background: rgba(34,197,94,.15);  border-color: rgba(34,197,94,.3);   color: var(--green); }
    .step-item.active      .step-num { background: rgba(245,158,11,.1);  border-color: rgba(245,158,11,.25); color: var(--amber); }
    .step-item.check-active .step-num{ background: rgba(6,182,212,.1);   border-color: rgba(6,182,212,.28);  color: #06b6d4; box-shadow: 0 0 8px rgba(6,182,212,.2); }
    .step-text { font-size: 13px; color: var(--text-3); font-weight: 500; }
    .step-item.done        .step-text { color: rgba(34,197,94,.75); }
    .step-item.active      .step-text { color: var(--text); }
    .step-item.check-active .step-text{ color: rgba(6,182,212,.9); }

    .main { display: flex; flex-direction: column; min-width: 0; }
    .breadcrumb {
      border-bottom: 1px solid var(--border); padding: 0 var(--breadcrumb-x); height: 38px;
      display: flex; align-items: center; gap: 8px; background: var(--chrome-2);
    }
    .bc-item { font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: .06em; }
    .bc-item.active { color: rgba(var(--ink),.6); }
    .bc-sep { font-family: var(--mono); font-size: 11px; color: var(--text-3); opacity: .4; }

    /* ── MOBILE FLOW BAR (samenvatting Van → Naar als sidebar verborgen is) ── */
    .mobile-flowbar {
      display: none; font-family: var(--mono); font-size: 12px; color: var(--text-2);
      padding: 9px 14px; border-bottom: 1px solid var(--border);
      background: rgba(var(--ink),.02); letter-spacing: .03em;
      gap: 7px; align-items: center; flex-wrap: wrap;
    }
    .mobile-flowbar b { color: var(--amber); font-weight: 700; }
    .mobile-flowbar .mf-sep { color: var(--text-3); }

    .content { flex: 1; padding: var(--content-top) var(--content-x) var(--content-bottom); animation: fadeUp .22s cubic-bezier(.16,1,.3,1) both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .content-header { margin-bottom: 28px; }
    .content-title  { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -.04em; margin-bottom: 5px; line-height: 1.15; }
    .content-sub    { font-size: 13px; color: var(--text-2); line-height: 1.6; max-width: 480px; }

    .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    .panel {
      border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1);
      overflow: hidden; position: relative; backdrop-filter: blur(10px); transition: border-color .18s;
    }
    .panel::before { content:''; position:absolute; inset:0; border-radius:12px; background: linear-gradient(135deg,rgba(var(--ink),.02) 0%,transparent 60%); pointer-events:none; }
    .panel:hover { border-color: var(--border-2); }
    .panel-header { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: rgba(var(--ink),.015); }
    .panel-title { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: rgba(var(--ink),.4); }
    .panel-badge { margin-left: auto; display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.2); color: var(--green); letter-spacing: .1em; }
    .panel-badge::before { content:''; width:4px; height:4px; border-radius:50%; background: var(--green); display:inline-block; flex-shrink:0; }
    .panel-body { padding: 18px; }
    .field-label { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; margin-top: 16px; }
    .field-label:first-child { margin-top: 0; }

    .chip-row, .chipRow { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      font-size: 13px; font-weight: 500; padding: 9px 14px; border-radius: 7px;
      border: 1px solid var(--border-2); background: var(--surface-1); color: var(--text-2);
      display: inline-flex; align-items: center; gap: 8px;
      transition: all .14s cubic-bezier(.16,1,.3,1); position: relative; overflow: hidden;
    }
    .chip:hover { background: var(--surface-3); color: var(--text); border-color: var(--border-3); transform: translateY(-1px); }
    .chip.active { background: rgba(245,158,11,.09); border-color: rgba(245,158,11,.28); color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,.07); }
    .chipInner { display: inline-flex; align-items: center; gap: 8px; }

    .actions-bar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding-top: 22px; border-top: 1px solid var(--border); }
    .btn-ghost { font-size: 13px; font-weight: 500; padding: 9px 17px; border-radius: 8px; border: 1px solid var(--border-2); background: transparent; color: var(--text-2); transition: all .14s ease; }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-3); }
    .btn-ghost:disabled { opacity: .25; cursor: not-allowed; }
    .btn-primary { font-size: 13px; font-weight: 700; padding: 9px 20px; border-radius: 8px; color: #000; background: var(--amber); border: none; transition: all .16s cubic-bezier(.16,1,.3,1); }
    .btn-primary:hover:not(:disabled) { background: #fbbf24; box-shadow: 0 0 22px var(--amber-glow); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .18; cursor: not-allowed; }

    .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .section-card {
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface-1);
      padding: 18px 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
      transition: all .18s cubic-bezier(.16,1,.3,1);
      position: relative;
      overflow: hidden;
    }
    .section-card::before { content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(var(--ink),.015) 0%,transparent 60%); pointer-events:none; }
    .section-card:hover { border-color: var(--border-3); background: var(--surface-2); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    .section-card-title { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
    .section-card-desc { font-size: 12px; color: var(--text-3); line-height: 1.4; }
    .section-card-footer { width: 100%; display: flex; align-items: center; justify-content: flex-end; padding-top: 8px; border-top: 1px solid var(--border); margin-top: auto; }
    .section-header-logo { height: 32px; width: auto; object-fit: contain; opacity: .9; filter: brightness(1.15); }
    .section-card-arrow { font-size: 14px; color: var(--text-3); transition: color .14s, transform .14s; }

    /* Logo + SVG fallback: fallback is verborgen tot het logo faalt */
    .section-card-logo-wrap { width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .section-card-logo { max-width: 100%; max-height: 100%; object-fit: contain; }
    .section-card-logo-fallback { display: none; width: 40px; height: 40px; border: 1px solid var(--border-2); border-radius: 9px; background: var(--surface-2); align-items: center; justify-content: center; }
    .section-card-logo-fallback svg { width: 18px; height: 18px; stroke: rgba(var(--ink),.4); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .section-card-logo-wrap.logo-failed .section-card-logo { display: none; }
    .section-card-logo-wrap.logo-failed .section-card-logo-fallback { display: flex; }

    .toggle-row { display: flex; gap: 6px; margin-bottom: 20px; }
    .toggleBtn { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--border-2); background: var(--surface-1); color: var(--text-3); letter-spacing: .1em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 7px; transition: all .14s ease; }
    .toggleBtn:hover { color: var(--text-2); background: var(--surface-2); }
    .toggleBtn.active { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.22); color: var(--amber); }
    .lineToggle { display: inline-flex; align-items: center; gap: 7px; }

    .view-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 14px; flex-wrap: wrap; }
    .view-header-left  { display: flex; align-items: center; gap: 13px; }
    .view-header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn-back { width: 36px; height: 36px; border-radius: 7px; border: 1px solid var(--border-2); background: var(--surface-1); color: rgba(var(--ink),.4); display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all .14s ease; flex-shrink: 0; }
    .btn-back:hover { background: var(--surface-3); color: var(--text); }
    .view-title { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -.03em; }
    .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 20px; border: 1px solid var(--border-2); background: var(--surface-1); font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--text-2); letter-spacing: .02em; }

    .mode-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
    .view-actions { display: flex; gap: 5px; flex-wrap: wrap; }
    .view-action-btn { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 9px 14px; border-radius: 7px; border: 1px solid var(--border-2); background: var(--surface-1); color: var(--text-3); display: inline-flex; align-items: center; gap: 7px; transition: all .14s ease; letter-spacing: .08em; text-transform: uppercase; }
    .view-action-btn:hover { background: var(--surface-3); color: var(--text); }
    .view-action-btn.active { background: rgba(59,130,246,.08); border-color: rgba(59,130,246,.22); color: var(--blue); }
    .view-action-btn.check-btn.active { background: rgba(34,197,94,.08); border-color: rgba(34,197,94,.22); color: var(--green); }
    .mode-pills { display: flex; gap: 3px; }
    .mode-btn { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-3); transition: all .12s ease; }
    .mode-btn:hover { color: var(--text-2); }
    .mode-btn.active { background: var(--surface-2); border-color: var(--border-2); color: var(--text); }

    .value-table { border: 1px solid var(--border); border-radius: 11px; overflow: hidden; background: var(--surface-1); }
    .value-table-header { display: grid; grid-template-columns: minmax(140px,1.4fr) minmax(70px,1fr) 26px minmax(70px,1fr); padding: 9px 18px; border-bottom: 1px solid var(--border); background: rgba(var(--ink),.02); }
    .value-table-col { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); }
    .value-table-col.center { text-align: center; }
    .value-rows { display: flex; flex-direction: column; }
    .value-row { display: grid; grid-template-columns: minmax(140px,1.4fr) minmax(70px,1fr) 26px minmax(70px,1fr); padding: 11px 18px; border-bottom: 1px solid var(--border); align-items: center; gap: 10px; transition: background .11s ease; }
    .value-row:last-child { border-bottom: none; }
    .value-row:hover { background: rgba(var(--ink),.02); }
    .value-key { font-size: 13px; color: rgba(var(--ink),.7); display: flex; align-items: center; gap: 8px; min-width: 0; padding-right: 8px; }
    .value-key-text { white-space: normal; word-break: break-word; line-height: 1.4; }
    .param-num { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--amber); background: rgba(245,158,11,.07); border: 1px solid rgba(245,158,11,.2); border-radius: 4px; padding: 2px 6px; flex-shrink: 0; letter-spacing: .04em; align-self: flex-start; margin-top: 1px; }
    .value-cell { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--slate); }
    .value-cell.is-new { color: var(--blue); font-weight: 600; }
    .value-sep  { font-family: var(--mono); font-size: 11px; color: var(--text-3); text-align: center; opacity: .4; }
    /* Pijltje bij een echte wijziging: iets duidelijker, zonder rij-highlight */
    .value-sep.changed { opacity: 1; color: var(--amber); font-weight: 700; }
    /* Subtiele teller boven de lijst */
    .changes-count { padding: 7px 18px; font-size: 11.5px; color: var(--text-3); border-bottom: 1px solid var(--border); }
    .changes-count .changes-num { color: var(--amber); font-weight: 800; font-size: 15px; font-family: var(--mono); }
    /* Dashboard */
    .dash-kpis { display: flex; gap: 10px; }
    .dash-kpi { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 12px; text-align: center; }
    .dash-kpi-val { font-family: var(--mono); font-size: 20px; font-weight: 800; color: var(--text); }
    .dash-kpi-lbl { font-size: 11px; color: var(--text-3); margin-top: 4px; }
    .dash-trend-badge { font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 6px; vertical-align: middle; }
    .dash-trend-badge.good { color: #22c55e; background: rgba(34,197,94,.14); }
    .dash-trend-badge.bad  { color: #ef4444; background: rgba(239,68,68,.14); }
    .dash-bars { display: flex; flex-direction: column; gap: 7px; }
    .dash-bar-row { display: grid; grid-template-columns: minmax(90px,1.4fr) 2fr auto; gap: 10px; align-items: center; }
    .dash-bar-label { font-size: 11px; color: var(--slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dash-bar-track { background: var(--surface-2); border-radius: 6px; height: 18px; overflow: hidden; }
    .dash-bar-fill { height: 100%; background: linear-gradient(90deg, var(--amber), #f59e0b); border-radius: 6px; transition: width .4s ease; }
    .dash-bar-val { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--text); white-space: nowrap; }
    .dash-bar-n { color: var(--text-3); font-weight: 400; font-size: 10px; }
    .dash-trend { display: flex; gap: 6px; align-items: flex-end; padding-top: 8px; }
    .dash-trend-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .dash-trend-bar-wrap { height: 94px; display: flex; align-items: flex-end; width: 100%; justify-content: center; }
    .dash-trend-bar { width: 60%; min-height: 2px; background: linear-gradient(180deg, var(--blue), #3b82f6); border-radius: 4px 4px 0 0; }
    .dash-trend-val { font-family: var(--mono); font-size: 9px; color: var(--slate); }
    .dash-trend-lbl { font-size: 9px; color: var(--text-3); }

    /* ── STATUS-MODUS ── */
    .value-table-header.status-header,
    .value-row.status-row { grid-template-columns: minmax(160px,2fr) 1fr auto; }
    .status-check-btn {
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      padding: 7px 13px; border-radius: 7px;
      border: 1px solid rgba(6,182,212,.25); background: rgba(6,182,212,.06);
      color: #06b6d4; transition: all .14s ease; white-space: nowrap;
    }
    .status-check-btn:hover { background: rgba(6,182,212,.14); border-color: rgba(6,182,212,.45); }
    .value-table-header.status-header.no-check,
    .value-row.status-row.no-check { grid-template-columns: minmax(160px,2fr) 1fr; }
    .mode-choice-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
    .mode-choice-card { padding: 26px 22px; gap: 12px; }
    .mode-choice-icon {
      width: 52px; height: 52px; border-radius: 13px; display: flex;
      align-items: center; justify-content: center; font-size: 24px;
      border: 1px solid var(--border-2); margin-bottom: 4px;
    }
    .mode-choice-icon.ombouw { color: var(--amber); background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.25); }
    .mode-choice-icon.status { color: #06b6d4;     background: rgba(6,182,212,.08);  border-color: rgba(6,182,212,.25); }

    .player-wrap { display: grid; grid-template-columns: 1fr 268px; gap: 14px; align-items: start; }
    .player-main { border: 1px solid var(--border); border-radius: 13px; background: var(--surface-1); overflow: hidden; position: relative; }
    .player-main::before { content:''; position:absolute; inset:0; background: linear-gradient(135deg,rgba(var(--ink),.012) 0%,transparent 50%); pointer-events:none; }
    .player-top-bar { padding: 11px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(var(--ink),.02); }
    .player-counter { font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: .1em; flex-shrink: 0; }
    .player-progress-track { flex: 1; height: 2px; border-radius: 1px; background: rgba(var(--ink),.06); margin: 0 18px; overflow: hidden; position: relative; }
    .player-progress-fill { height: 100%; background: linear-gradient(90deg, rgba(245,158,11,.5), var(--amber)); border-radius: 1px; transition: width .32s cubic-bezier(.16,1,.3,1); box-shadow: 0 0 8px var(--amber-glow); position: relative; }
    .player-progress-fill::after { content:''; position:absolute; right:0; top:-2px; bottom:-2px; width:4px; background:#fff; border-radius:2px; box-shadow:0 0 6px var(--amber); opacity:.7; }
    .player-body { padding: 32px; }
    .player-key { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); margin-bottom: 9px; }
    .player-label { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -.04em; line-height: 1.15; margin-bottom: 30px; display: flex; align-items: center; gap: 13px; flex-wrap: wrap; }
    .player-num { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--amber); background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.22); border-radius: 5px; padding: 3px 9px; flex-shrink: 0; }
    .player-values { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
    .player-val-block { flex: 1; min-width: 110px; }
    .player-val-label { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); margin-bottom: 7px; }
    .player-val-box { border: 1px solid var(--border-2); border-radius: 8px; background: rgba(var(--ink),.02); padding: 14px 18px; font-family: var(--mono); font-size: 18px; font-weight: 600; color: rgba(var(--ink),.6); min-height: 56px; display: flex; align-items: center; gap: 9px; transition: all .18s ease; }
    .player-val-box.new-val { border-color: rgba(59,130,246,.22); background: rgba(59,130,246,.06); color: var(--blue); }
    .player-arrow-sep { font-family: var(--mono); font-size: 15px; color: var(--text-3); flex-shrink: 0; margin-top: 24px; opacity: .4; }
    .player-controls { padding: 13px 22px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; background: rgba(var(--ink),.01); }
    .player-sidebar { border: 1px solid var(--border); border-radius: 13px; background: var(--surface-1); overflow: hidden; }
    .player-sidebar-header { padding: 10px 14px; border-bottom: 1px solid var(--border); background: rgba(var(--ink),.02); }
    .player-sidebar-title { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); }
    .mini-list { display: flex; flex-direction: column; max-height: 420px; overflow-y: auto; }
    .mini-list::-webkit-scrollbar { width: 2px; }
    .mini-list::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 1px; }
    .mini-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; width: 100%; text-align: left; }
    .mini-row:last-child { border-bottom: none; }
    .mini-row:hover { background: var(--surface-2); }
    .mini-row.active { background: rgba(245,158,11,.05); border-left: 2px solid var(--amber); padding-left: 10px; }
    .mini-num { font-family: var(--mono); font-size: 10px; color: var(--text-3); width: 20px; flex-shrink: 0; }
    .mini-row.active .mini-num { color: var(--amber); }
    .mini-key { font-size: 12px; color: rgba(var(--ink),.4); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-row.active .mini-key { color: rgba(var(--ink),.85); font-weight: 600; }
    .mini-check { font-size: 10px; color: var(--green); }

    .richValue  { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .richText   { font-weight: 600; }
    .colorDots  { display: inline-flex; gap: 4px; align-items: center; }
    .colorDot   { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(var(--ink),.1); display: inline-block; }
    .colorDot.wit   { border-color: rgba(var(--ink),.4); }
    .colorDot.grijs { border-color: rgba(var(--ink),.2); }
    .colorDot.blauw { background: #3b82f6 !important; border-color: rgba(59,130,246,.5); }

    .loading-screen { display: flex; align-items: center; justify-content: center; flex: 1; padding: 80px; flex-direction: column; gap: 14px; }
    .loading-bar-wrap { width: 180px; height: 2px; background: var(--border-2); border-radius: 1px; overflow: hidden; }
    .loading-bar-fill { height: 100%; width: 40%; background: linear-gradient(90deg, transparent, var(--amber), transparent); border-radius: 1px; animation: sweep 1.6s ease-in-out infinite; }
    @keyframes sweep { 0%{transform:translateX(-200%)} 100%{transform:translateX(500%)} }
    .loading-label { font-family: var(--mono); font-size: 10px; color: var(--text-3); letter-spacing: .2em; text-transform: uppercase; }

    .emptyNote { padding: 60px 40px; text-align: center; color: var(--text-3); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .emptyNote::before { content:''; display:block; width:36px; height:1px; background: var(--border-2); }

    .check-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 14px; flex-wrap: wrap; }
    .check-header-left  { display: flex; align-items: center; gap: 13px; }
    .check-header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .check-title { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -.03em; }

    .check-player { border: 1px solid var(--border); border-radius: 14px; background: var(--surface-1); overflow: hidden; position: relative; margin-bottom: 14px; }
    .check-player-top { padding: 12px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(var(--ink),.02); }
    .check-player-body { padding: 32px; }
    .check-param-label { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); margin-bottom: 9px; }
    .check-param-name { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: -.04em; line-height: 1.15; margin-bottom: 30px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .check-values-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; margin-bottom: 28px; }
    .check-val-block { display: flex; flex-direction: column; gap: 7px; }
    .check-val-label { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); }
    .check-val-box { border: 1px solid var(--border-2); border-radius: 8px; padding: 16px 20px; font-family: var(--mono); font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; min-height: 62px; transition: all .2s ease; }
    .check-val-box.expected { background: rgba(var(--ink),.02); color: rgba(var(--ink),.7); }
    .check-val-box.actual   { background: rgba(var(--ink),.02); color: rgba(var(--ink),.9); }
    .check-val-box.status-match    { border-color: rgba(34,197,94,.3);  background: rgba(34,197,94,.06);  color: var(--green); }
    .check-val-box.status-mismatch { border-color: rgba(239,68,68,.3);  background: rgba(239,68,68,.06);  color: var(--red); }
    .check-val-box.status-saved    { border-color: rgba(6,182,212,.3);  background: rgba(6,182,212,.06);  color: #06b6d4; }

    .check-arrow { font-family: var(--mono); font-size: 16px; color: var(--text-3); opacity: .4; margin-top: 28px; align-self: center; }
    .check-input-wrap { position: relative; }
    .check-input { width: 100%; border: none; border-radius: 0; background: transparent; color: inherit; font-family: var(--mono); font-size: 22px; font-weight: 700; padding: 0; outline: none; caret-color: #06b6d4; }
    .check-input::placeholder { color: var(--text-3); font-size: 16px; font-weight: 400; }
    .check-val-box:focus-within { border-color: rgba(6,182,212,.35) !important; box-shadow: 0 0 0 3px rgba(6,182,212,.07); }

    .check-status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 20px; border: 1px solid; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .check-status-badge.match    { border-color: rgba(34,197,94,.3);  background: rgba(34,197,94,.08);  color: var(--green); }
    .check-status-badge.mismatch { border-color: rgba(239,68,68,.3);  background: rgba(239,68,68,.08);  color: var(--red); }
    .check-status-badge.saved    { border-color: rgba(6,182,212,.3);  background: rgba(6,182,212,.08);  color: #06b6d4; }
    .check-status-badge.pending  { border-color: var(--border-2); background: var(--surface-1); color: var(--text-3); }
    .check-status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    .check-confirm-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,.75); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; animation: fadeUp .18s cubic-bezier(.16,1,.3,1) both; }
    .check-confirm-box { background: var(--panel); border: 1px solid var(--border-2); border-radius: 16px; padding: 32px 32px 28px; max-width: 440px; width: 90%; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 24px 80px rgba(0,0,0,.8); }
    .check-confirm-title { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -.03em; }
    .check-confirm-body  { font-size: 13px; color: var(--text-2); line-height: 1.65; }
    .check-confirm-vals  { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 9px; border: 1px solid var(--border-2); background: rgba(var(--ink),.025); }
    .check-confirm-val   { font-family: var(--mono); font-size: 16px; font-weight: 700; }
    .check-confirm-val.old { color: var(--slate); }
    .check-confirm-val.new { color: var(--blue); }
    .check-confirm-arr   { font-family: var(--mono); font-size: 13px; color: var(--text-3); opacity: .5; }
    .confirm-note { width: 100%; min-height: 68px; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--border-2); background: rgba(var(--ink),.03); color: var(--text); font: inherit; font-size: 13px; line-height: 1.5; resize: vertical; outline: none; }
    .confirm-note::placeholder { color: var(--text-3); }
    .confirm-note:focus { border-color: rgba(59,130,246,.4); box-shadow: 0 0 0 3px rgba(59,130,246,.07); }
    .check-confirm-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-confirm-save { flex: 1; font-size: 13px; font-weight: 700; padding: 11px 18px; border-radius: 9px; background: var(--blue); color: #fff; border: none; transition: all .15s ease; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .btn-confirm-save:hover { background: #5b9ef8; box-shadow: 0 0 22px rgba(59,130,246,.3); }
    .btn-confirm-skip { font-size: 13px; font-weight: 500; padding: 11px 18px; border-radius: 9px; border: 1px solid var(--border-2); background: transparent; color: var(--text-2); transition: all .14s ease; }
    .btn-confirm-skip:hover { background: var(--surface-2); color: var(--text); }
    .confirm-admin-hint { font-family: var(--mono); font-size: 11px; color: var(--amber); padding: 7px 11px; border-radius: 7px; background: rgba(245,158,11,.07); border: 1px solid rgba(245,158,11,.2); }

    .check-color-btn { flex: 1; padding: 13px 10px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--surface-1); font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: all .15s ease; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .check-color-btn.match { color: var(--green); }
    .check-color-btn.match:hover { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.4); box-shadow: 0 0 14px rgba(34,197,94,.18); }
    .check-color-btn.miss  { color: var(--red); }
    .check-color-btn.miss:hover  { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.4); box-shadow: 0 0 14px rgba(239,68,68,.18); }
    .check-player-nav { padding: 13px 22px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(var(--ink),.01); }

    .check-sidebar { border: 1px solid var(--border); border-radius: 13px; background: var(--surface-1); overflow: hidden; }
    .check-sidebar-header { padding: 10px 14px; border-bottom: 1px solid var(--border); background: rgba(var(--ink),.02); display: flex; align-items: center; justify-content: space-between; }
    .check-mini-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; width: 100%; text-align: left; }
    .check-mini-row:last-child { border-bottom: none; }
    .check-mini-row:hover { background: var(--surface-2); }
    .check-mini-row.active { background: rgba(var(--ink),.03); border-left: 2px solid rgba(var(--ink),.2); padding-left: 10px; }
    .check-mini-num  { font-family: var(--mono); font-size: 10px; color: var(--text-3); width: 20px; flex-shrink: 0; }
    .check-mini-key  { font-size: 12px; color: rgba(var(--ink),.4); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .check-mini-row.active .check-mini-key { color: rgba(var(--ink),.8); font-weight: 600; }
    /* Status nu als glyph (✓ ✕ ↑ ·) i.p.v. alleen kleur — leesbaar bij kleurenblindheid */
    .check-mini-status { font-family: var(--mono); font-size: 13px; font-weight: 700; flex-shrink: 0; width: 16px; text-align: center; }
    .check-mini-status.match    { color: var(--green); }
    .check-mini-status.mismatch { color: var(--red); }
    .check-mini-status.saved    { color: #06b6d4; }
    .check-mini-status.pending  { color: var(--text-3); }

    .check-wrap { display: grid; grid-template-columns: 1fr 264px; gap: 14px; align-items: start; }
    .check-summary-screen { animation: fadeUp .22s cubic-bezier(.16,1,.3,1) both; }
    .check-summary-hero { font-size: 22px; font-weight: 700; letter-spacing: -.03em; color: var(--text); margin-bottom: 6px; }
    .check-summary-sub  { font-size: 13px; color: var(--text-2); margin-bottom: 28px; }
    .check-summary-stats { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
    .check-stat-pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 20px; border: 1px solid; font-family: var(--mono); font-size: 11px; font-weight: 700; }
    .check-stat-pill.ok   { border-color: rgba(34,197,94,.3);  background: rgba(34,197,94,.07);  color: var(--green); }
    .check-stat-pill.miss { border-color: rgba(239,68,68,.3);  background: rgba(239,68,68,.07);  color: var(--red); }
    .check-stat-pill.save { border-color: rgba(59,130,246,.3); background: rgba(59,130,246,.07); color: var(--blue); }
    .check-stat-pill.report { border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.07); color: var(--amber); }
    .check-stat-pill.skip { border-color: rgba(100,116,139,.25); background: rgba(100,116,139,.06); color: var(--slate); }
    .check-stat-pill .sn  { font-size: 15px; }
    .check-changes-title { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--text-3); margin-bottom: 12px; }
    .check-changes-list  { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface-1); margin-bottom: 24px; }
    .check-changes-row   { display: grid; grid-template-columns: minmax(130px,2fr) 110px 22px 110px 28px; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--border); align-items: center; }
    .check-changes-row:last-child { border-bottom: none; }
    .check-changes-row.row-match { background: rgba(34,197,94,.025); }
    .check-changes-row.row-miss  { background: rgba(239,68,68,.03); }
    .check-changes-row.row-saved { background: rgba(6,182,212,.03); }
    .check-changes-row.row-reported { background: rgba(245,158,11,.04); }
    .check-changes-key   { font-size: 12px; color: rgba(var(--ink),.7); display: flex; align-items: center; gap: 8px; }
    .check-changes-from  { font-family: var(--mono); font-size: 12px; color: var(--slate); }
    .check-changes-to    { font-family: var(--mono); font-size: 12px; font-weight: 700; }
    .check-changes-to.match    { color: var(--green); }
    .check-changes-to.mismatch { color: var(--red); }
    .check-changes-to.saved    { color: #06b6d4; }
    .check-changes-to.pending  { color: var(--text-3); }
    .check-changes-sep   { font-family: var(--mono); font-size: 11px; color: var(--text-3); opacity: .4; text-align: center; }
    .check-changes-status { font-family: var(--mono); font-size: 12px; font-weight: 700; text-align: center; }
    .check-changes-status.match    { color: var(--green); }
    .check-changes-status.mismatch { color: var(--red); }
    .check-changes-status.saved    { color: #06b6d4; }
    .check-changes-status.reported { color: var(--amber); }
    .check-summary-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-save-finish { font-size: 13px; font-weight: 700; padding: 10px 22px; border-radius: 9px; background: var(--green); color: #000; border: none; transition: all .15s ease; display: inline-flex; align-items: center; gap: 7px; }
    .btn-save-finish:hover { box-shadow: 0 0 22px rgba(34,197,94,.3); transform: translateY(-1px); }

    .tab-bar { display: flex; gap: 3px; margin-bottom: 22px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
    .tab-btn { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 9px 16px; border-radius: 6px 6px 0 0; border: 1px solid transparent; border-bottom: none; background: transparent; color: var(--text-3); cursor: pointer; transition: all .14s ease; margin-bottom: -1px; }
    .tab-btn:hover { color: var(--text-2); }
    .tab-btn.active { background: var(--surface-2); border-color: var(--border-2); border-bottom-color: var(--surface-2); color: var(--text); }

    .version-list { display: flex; flex-direction: column; gap: 10px; }
    .version-card { border: 1px solid var(--border); border-radius: 11px; background: var(--surface-1); overflow: hidden; transition: border-color .15s; }
    .version-card:hover { border-color: var(--border-2); }
    .version-card-header { padding: 11px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: rgba(var(--ink),.02); cursor: pointer; width: 100%; text-align: left; }
    .version-badge { font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.2); color: var(--amber); letter-spacing: .08em; flex-shrink: 0; }
    .version-badge.latest { background: rgba(34,197,94,.1); border-color: rgba(34,197,94,.2); color: var(--green); }
    .version-meta { font-family: var(--mono); font-size: 11px; color: var(--text-2); flex: 1; }
    .version-date { font-family: var(--mono); font-size: 11px; color: var(--text-3); flex-shrink: 0; }
    .version-change-count { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border-2); color: var(--text-3); flex-shrink: 0; }
    .version-body { padding: 14px 18px; display: none; }
    .version-body.open { display: block; }
    .version-param-list { display: flex; flex-direction: column; gap: 2px; }
    .version-param-row { display: grid; grid-template-columns: 1fr 100px 20px 100px auto; gap: 8px; padding: 7px 10px; border-radius: 6px; align-items: center; }
    .version-param-row:hover { background: rgba(var(--ink),.02); }
    .version-param-name { font-size: 12px; color: rgba(var(--ink),.6); display: flex; align-items: center; gap: 7px; }
    .version-param-val  { font-family: var(--mono); font-size: 11px; color: var(--slate); }
    .version-param-val.new { color: var(--blue); font-weight: 600; }
    .version-param-sep  { font-family: var(--mono); font-size: 10px; color: var(--text-3); opacity: .4; text-align: center; }
    .restore-btn { font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 5px 10px; border-radius: 5px; border: 1px solid var(--border-2); background: var(--surface-1); color: var(--text-2); transition: all .14s ease; white-space: nowrap; }
    .restore-btn:hover { background: rgba(59,130,246,.12); border-color: rgba(59,130,246,.35); color: var(--blue); }

    .audit-list { display: flex; flex-direction: column; gap: 8px; }
    .audit-entry { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); padding: 14px 18px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; transition: border-color .14s; }
    .audit-entry:hover { border-color: var(--border-2); }
    .audit-icon { width: 32px; height: 32px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; }
    .audit-icon.match    { background: rgba(34,197,94,.1);  border: 1px solid rgba(34,197,94,.2); }
    .audit-icon.mismatch { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.2); }
    .audit-icon.saved    { background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.2); }
    .audit-icon.warn     { background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.2); }
    .audit-icon.skipped  { background: rgba(100,116,139,.1); border: 1px solid rgba(100,116,139,.2); }
    .audit-body { min-width: 0; }
    .audit-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
    .audit-meta { font-family: var(--mono); font-size: 11px; color: var(--text-3); line-height: 1.6; }
    .audit-change { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; margin-top: 4px; }
    .audit-old { color: var(--slate); }
    .audit-arr { color: var(--text-3); opacity: .5; }
    .audit-new { color: var(--blue); font-weight: 700; }
    .audit-note { margin-top: 5px; font-size: 12px; color: var(--text-2); font-style: italic; padding: 5px 9px; border-radius: 5px; background: rgba(var(--ink),.03); border-left: 2px solid var(--border-2); }
    .audit-timestamp { font-family: var(--mono); font-size: 10px; color: var(--text-3); white-space: nowrap; flex-shrink: 0; letter-spacing: .04em; }

    .empty-state { padding: 48px 32px; text-align: center; color: var(--text-3); font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .empty-state::before { content:''; display:block; width:32px; height:1px; background: var(--border-2); }

    /* ── TOASTS (zichtbare sync/foutmeldingen) ── */
    .pally-toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 9000;
      background: var(--panel-2); border: 1px solid var(--border-3); color: var(--text);
      font-size: 13px; font-weight: 600; padding: 12px 18px; border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,.6); max-width: 92vw; text-align: center;
      animation: fadeUp .2s ease; transition: opacity .3s ease;
    }
    .pally-toast.ok   { border-color: rgba(34,197,94,.45); }
    .pally-toast.warn { border-color: rgba(245,158,11,.5); }
    .pally-toast.err  { border-color: rgba(239,68,68,.5); }
    .pally-toast.out  { opacity: 0; }

    /* ── TOEGANKELIJKHEID ── */
    :where(button, input, textarea, [tabindex]):focus-visible {
      outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 6px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    /* Touch targets: minimaal 44px op touch-apparaten */
    @media (pointer: coarse) {
      .mini-row, .check-mini-row { min-height: 44px; }
      .mode-btn, .view-action-btn, .toggleBtn, .tab-btn, .btn-ghost, .btn-primary, .chip,
      .btn-confirm-save, .btn-confirm-skip, .restore-btn, .role-badge { min-height: 44px; }
      .btn-back { width: 44px; height: 44px; }
      .admin-refresh { width: 44px; height: 44px; }
      .status-check-btn { min-height: 40px; }
      .version-card-header { min-height: 48px; }
    }

/* ── TABLET ── */
    @media (max-width: 900px) {
      :root { --topbar-x: 14px; --breadcrumb-x: 14px; --content-x: 16px; --content-top: 24px; --content-bottom: 40px; }
      .body { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .mobile-flowbar.show { display: flex; }
      .panel-grid { grid-template-columns: 1fr; gap: 12px; }
      .section-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .player-wrap, .check-wrap { grid-template-columns: 1fr; }
      .player-sidebar, .check-sidebar { display: none; }
      .value-table-header, .value-row { grid-template-columns: minmax(100px,1.3fr) minmax(48px,1fr) 22px minmax(48px,1fr); }
      .value-table-header.status-header, .value-row.status-row { grid-template-columns: minmax(110px,1.6fr) 1fr auto; }
      .mode-choice-grid { grid-template-columns: 1fr; }
      .version-param-row { grid-template-columns: 1fr 80px 18px 80px auto; }
      .topbar { gap: 8px; }
      .topbar-brand-wrap { gap: 8px; min-width: 0; flex: 1; }
      .topbar-brand { min-width: 0; overflow: hidden; flex: 1; gap: 9px; }
      .topbar-name { font-size: 11px; letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .topbar-sep, .topbar-module, .topbar-version { display: none; }
      .topbar-right { gap: 6px; flex-shrink: 0; }
      .sync-indicator { padding: 4px 8px; font-size: 10px; }
      .role-badge { padding: 5px 9px; font-size: 10px; letter-spacing: .06em; }

    /* ── MOBILE ── */
    @media (max-width: 600px) {

      .panel-grid { grid-template-columns: 1fr; }
      .section-grid { grid-template-columns: 1fr; gap: 8px; }
      .section-card { padding: 14px 16px; flex-direction: row; align-items: center; gap: 14px; }
      .section-card-logo-wrap { width: 56px; height: 56px; }
      .section-card-title { font-size: 15px; }
      .section-card-desc { font-size: 12px; }
      .section-card > div:nth-child(2), .section-card > div:nth-child(3) { flex: 1; min-width: 0; }
      .section-card-footer { display: none; }
      .view-header { gap: 8px; }
      .view-header-right { width: 100%; gap: 6px; }
      .pill { font-size: 11px; padding: 4px 9px; }
      .actions-bar { flex-wrap: wrap; gap: 8px; }
      .check-header-right { width: 100%; }
      .check-values-grid { grid-template-columns: 1fr; }
      .check-arrow { display: none; }
      .check-param-name { font-size: 20px; }
      .check-val-box { font-size: 18px; padding: 14px 16px; }
      .preset-btn { min-width: 70px; font-size: 14px; padding: 14px 10px; }
      .player-body { padding: 22px 18px; }
      .player-label { font-size: 19px; }
      .player-val-box { font-size: 15px; padding: 12px 14px; }
      .player-values { flex-direction: column; gap: 12px; }
      .player-arrow-sep { display: none; }
      .check-summary-stats { gap: 6px; }
      .check-stat-pill { font-size: 10px; padding: 5px 10px; }
      .check-changes-row { grid-template-columns: minmax(90px,2fr) 70px 16px 70px 22px; padding: 10px 12px; gap: 6px; font-size: 11px; }
      .tab-btn { padding: 8px 11px; font-size: 10px; letter-spacing: .06em; }
      .login-box { padding: 24px 22px; }
      .check-confirm-box { padding: 24px 22px; }
    }

    .check-values-stacked { display: flex; flex-direction: column; gap: 14px; margin-bottom: 0; }

    /* ═══ MOBIEL PREMIUM (hele app) ═══ */
    @keyframes sheetUp { from { transform: translateY(48px); opacity: .5; } to { transform: none; opacity: 1; } }
    @media (max-width: 640px){
      /* 1) Dialogen worden bottom-sheets — native app-gevoel.
         Dekt: foto's, meldingen, tijden, dashboard, QR-links, print-keuze,
         waarde-melden en de check-bevestiging. */
      .photo-overlay { align-items: flex-end; padding: 0; }
      .photo-box { max-width: 100% !important; width: 100%; max-height: 88vh;
        border-radius: 20px 20px 0 0; border-left: none; border-right: none; border-bottom: none;
        padding-bottom: env(safe-area-inset-bottom, 0);
        animation: sheetUp .3s cubic-bezier(.32,.72,.24,1) both; }
      .photo-box::before { content: ''; display: block; width: 38px; height: 4px; border-radius: 2px;
        background: rgba(var(--ink),.2); margin: 9px auto 1px; flex-shrink: 0; }
      .check-confirm-overlay { align-items: flex-end; }
      .check-confirm-box { max-width: 100%; width: 100%; border-radius: 20px 20px 0 0;
        border-left: none; border-right: none; border-bottom: none;
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0));
        animation: sheetUp .3s cubic-bezier(.32,.72,.24,1) both; }
      .login-overlay { align-items: flex-end; padding: 0; }
      .login-box { max-width: 100%; width: 100%; border-radius: 20px 20px 0 0;
        border-left: none; border-right: none; border-bottom: none;
        padding-bottom: calc(26px + env(safe-area-inset-bottom, 0));
        animation: sheetUp .3s cubic-bezier(.32,.72,.24,1) both; }
      /* 2) iOS zoom-fix: inputs onder 16px triggeren auto-zoom bij focus */
      .search-input, .confirm-note { font-size: 16px; }
      /* 3) Toast boven de home-indicator, breder leesbaar */
      .pally-toast { bottom: calc(16px + env(safe-area-inset-bottom, 0)); width: calc(100% - 28px); max-width: none; }
      /* 4) Scroll-comfort: overlay-inhoud scrolt soepel, achtergrond blijft stil */
      .photo-overlay, .check-confirm-overlay, .login-overlay { overscroll-behavior: contain; }
      .photo-body { -webkit-overflow-scrolling: touch; }
    }
    /* 5) Druk-feedback op alle keuzekaarten en knoppen (voelbaar, premium) */
    @media (pointer: coarse){
      .section-card:active, .mode-btn:active, .admin-tile:active, .admin-melding:active,
      .toggleBtn:active, .preset-btn:active, .status-check-btn:active, .view-action-btn:active,
      .btn-primary:active, .btn-ghost:active, .check-mini-row:active, .mini-row:active {
        transform: scale(.982); transition: transform .08s ease; }
    }
    /* 6) Zeer smal: logo = merk (tekst weg), rechterknoppen ademen */
    @media (max-width: 520px){
      .topbar-name { display: none; }
      .topbar-brand, .topbar-brand-wrap { flex: 0 0 auto; }
      .topbar-right { gap: 7px; }
    }
    .check-values-stacked .check-val-block { width: 100%; }

    .preset-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 0; }
    .preset-btn { flex: 1; min-width: 80px; padding: 16px 12px; border: 1px solid var(--border-2); background: var(--surface-2); border-radius: 8px; font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--text-2); cursor: pointer; transition: all .14s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-align: center; line-height: 1.3; }
    .preset-btn:hover { background: var(--surface-3); color: var(--text); border-color: var(--border-3); }
    .preset-btn.selected-match { background: rgba(34,197,94,.14); border-color: rgba(34,197,94,.5); color: var(--green); box-shadow: 0 0 0 2px rgba(34,197,94,.12); }
    .preset-btn.selected-miss { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.45); color: var(--red); box-shadow: 0 0 0 2px rgba(239,68,68,.1); }

    .seq-display { background: var(--black); border: 1px solid var(--border-2); border-radius: 8px; padding: 14px 16px; font-family: var(--mono); font-size: 13px; color: var(--text-2); letter-spacing: .06em; word-break: break-all; line-height: 1.8; margin-bottom: 10px; }
    .seq-confirm { display: flex; gap: 8px; }
    /* Afdeling / lijnkeuze */
    .afdeling-block { margin-bottom: 26px; }
    .afdeling-title { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--text-3); margin-bottom: 12px; }
    .mode-choice-card.no-data { opacity: .55; }
    .mode-choice-card.no-data:hover { opacity: .8; }
    .line-group-chip { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border-2); background: var(--surface-1); color: var(--text-2); font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .04em; cursor: pointer; transition: all .14s ease; }
    .line-group-chip:hover { background: var(--surface-2); color: var(--text); }
    .line-group-chip-x { opacity: .6; }
    .bc-linegroup { background: transparent; border: none; cursor: pointer; color: #f59e0b; font-family: var(--mono); font-size: inherit; letter-spacing: inherit; padding: 0; }
    .bc-linegroup:hover { text-decoration: underline; }
    .no-data-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 70px 20px; border: 1px dashed var(--border-2); border-radius: 14px; text-align: center; }
    .no-data-icon { font-size: 34px; margin-bottom: 12px; }
    .no-data-text { color: var(--text-2); font-size: 14px; }
    /* Zoekveld */
    .search-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .search-input { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 9px; border: 1px solid var(--border-2); background: var(--surface-1); color: var(--text); font-family: var(--mono); font-size: 13px; outline: none; transition: border-color .14s ease; }
    .search-input:focus { border-color: rgba(245,158,11,.5); }
    .search-input::placeholder { color: var(--text-3); }
    .search-clear { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text-3); cursor: pointer; }
    .search-clear:hover { color: var(--text); }
    .search-count { font-family: var(--mono); font-size: 11px; color: var(--text-3); white-space: nowrap; }
    @media print { .search-row { display: none !important; } }
    .preset-edit-btn {
      display: block; width: 100%; margin-top: 10px; padding: 10px;
      font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .04em;
      border-radius: 8px; border: 1px dashed var(--border-2); background: transparent;
      color: var(--text-3); cursor: pointer; transition: all .14s ease;
    }
    .preset-edit-btn:hover { color: var(--text); border-color: var(--text-3); background: var(--surface-1); }
    @media (pointer: coarse){ .preset-edit-btn { min-height: 44px; } }
    .seq-confirm .preset-btn { font-size: 13px; padding: 12px 10px; }

    /* ── PRINT (lijst op papier als backup) ── */
    @media print {
      html, body { background: #fff !important; color: #000 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .topbar, .breadcrumb, .mobile-flowbar, .sidebar, .mode-bar, .toggle-row,
      .actions-bar, .view-header .btn-back, .view-action-btn, .pally-toast,
      #pally-error-box { display: none !important; }
      /* Interactieve bediening hoort niet op papier */
      .status-check-btn, .report-btn, .timing-bar, .health-btn,
      .preset-edit-btn, .sync-indicator, .role-badge, .lang-picker { display: none !important; }
      .body { display: block; }
      .content { padding: 0; animation: none; }
      .value-table, .value-row, .value-table-header { border-color: #bbb !important; background: #fff !important; }
      .value-key, .value-key-text, .value-cell, .view-title, .pill { color: #000 !important; }
      .value-cell.is-new { color: #1d4ed8 !important; }
      .param-num { color: #92400e !important; background: #fff !important; border-color: #d97706 !important; }
      .pill { border-color: #bbb !important; background: #fff !important; }
      .richText { color: #000 !important; }

      /* Gekleurde bolletjes MOETEN hun kleur behouden bij printen.
         Browsers laten standaard achtergrondkleuren weg om inkt te sparen;
         print-color-adjust:exact dwingt af dat ze toch geprint worden. */
      .colorDot, .colorDots, .richValue {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .colorDot {
        border: 1px solid #555 !important;
        box-shadow: none !important;
      }
      /* Witte bol: op wit papier onzichtbaar zonder donkere rand */
      .colorDot.wit { background: #fff !important; border: 1px solid #000 !important; }
      .colorDot.grijs { background: #64748b !important; border-color: #475569 !important; }
      .colorDot.blauw { background: #3b82f6 !important; border-color: #1d4ed8 !important; }
    }

    /* ── SAFE-AREA (notch / afgeronde hoeken) ──
       Staat als laatste, ná alle media queries. Gebruikt max(var, env)
       zodat de safe-area de normale padding (uit de variabelen per
       breakpoint) NOOIT verkleint — alleen vergroot bij een echte notch. */
    @supports (padding: max(0px, env(safe-area-inset-left))) {
      .topbar {
        padding-left: max(var(--topbar-x), env(safe-area-inset-left));
        padding-right: max(var(--topbar-x), env(safe-area-inset-right));
      }
      .breadcrumb {
        padding-left: max(var(--breadcrumb-x), env(safe-area-inset-left));
        padding-right: max(var(--breadcrumb-x), env(safe-area-inset-right));
      }
      .content {
        padding-left: max(var(--content-x), env(safe-area-inset-left));
        padding-right: max(var(--content-x), env(safe-area-inset-right));
        padding-bottom: max(var(--content-bottom), env(safe-area-inset-bottom));
      }
    }
  </style>
