<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pally · Ombouwen</title>

  <!-- ── Mobiele weergave (geen externe bestanden nodig) ── -->
  <meta name="theme-color" id="meta-theme" content="#000000">
  <script>/* Thema vóór eerste paint toepassen — voorkomt donker/licht flits */
    try{
      var _th = localStorage.getItem('pally_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', _th);
      if(_th === 'light'){ document.currentScript.previousElementSibling.content = '#eef0f3'; }
    }catch(e){}
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ombouwen">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      /* Layout-padding als variabelen, zodat safe-area ze nooit verkleint
         maar alleen verhoogt bij een notch (zie @supports onderaan). */
      --topbar-x: 32px;
      --breadcrumb-x: 32px;
      --content-x: 36px;
      --content-top: 36px;
      --content-bottom: 56px;
      --ink:         255,255,255;
      --chrome:      rgba(0,0,0,.9);
      --chrome-2:    rgba(0,0,0,.4);
      --chrome-3:    rgba(0,0,0,.6);
      --panel:       #0d0d0d;
      --panel-2:     #111111;
      --black:       #000000;
      --bg:          #000000;
      --surface:     rgba(var(--ink),.03);
      --surface-1:   rgba(var(--ink),.03);
      --surface-2:   rgba(var(--ink),.055);
      --surface-3:   rgba(var(--ink),.08);
      --border:      rgba(var(--ink),.07);
      --border-2:    rgba(var(--ink),.12);
      --border-3:    rgba(var(--ink),.18);
      --amber:       #f59e0b;
      --amber-dim:   rgba(245,158,11,.15);
      --amber-glow:  rgba(245,158,11,.3);
      --blue:        #3b82f6;
      --blue-dim:    rgba(59,130,246,.15);
      --blue-glow:   rgba(59,130,246,.3);
      --green:       #22c55e;
      --green-dim:   rgba(34,197,94,.15);
      --green-glow:  rgba(34,197,94,.35);
      --red:         #ef4444;
      --red-dim:     rgba(239,68,68,.15);
      --red-glow:    rgba(239,68,68,.3);
      --slate:       #64748b;
      --text:        #ffffff;
      --text-2:      #94a3b8;
      --text-3:      #475569;
      --mono:        'Geist Mono', monospace;
      --sans:        'Geist', system-ui, sans-serif;
    }
    /* ── LICHT THEMA ── alles stroomt via variabelen; --ink flipt de washes */
    html[data-theme="light"] {
      --ink:         15,23,42;
      --chrome:      rgba(255,255,255,.88);
      --chrome-2:    rgba(15,23,42,.045);
      --chrome-3:    rgba(255,255,255,.65);
      --panel:       #ffffff;
      --panel-2:     #ffffff;
      --black:       #eef0f3;
      --bg:          #eef0f3;
      --text:        #0f172a;
      --text-2:      #3f4c5e;
      --text-3:      #64748b;
      --slate:       #475569;
      --amber:       #b45309;
      --amber-dim:   rgba(180,83,9,.12);
      --amber-glow:  rgba(180,83,9,.28);
      --blue:        #1d4ed8;
      --blue-dim:    rgba(29,78,216,.1);
      --blue-glow:   rgba(29,78,216,.25);
      --green:       #15803d;
      --green-dim:   rgba(21,128,61,.12);
      --green-glow:  rgba(21,128,61,.3);
      --red:         #dc2626;
      --red-dim:     rgba(220,38,38,.1);
      --red-glow:    rgba(220,38,38,.25);
    }
    /* Zachtere schaduwen op licht */
    html[data-theme="light"] .photo-box,
    html[data-theme="light"] .check-confirm-box,
    html[data-theme="light"] .login-box { box-shadow: 0 24px 70px rgba(15,23,42,.18); }
    html[data-theme="light"] .pally-toast { box-shadow: 0 12px 36px rgba(15,23,42,.2); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: var(--black); color: var(--text);
      font-family: var(--sans); font-size: 14px; line-height: 1.5;
      min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    img { max-width: 100%; display: block; }

    .shell { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; min-height: 100dvh; position: relative; z-index: 1; }

    .topbar {
      height: 56px; border-bottom: 1px solid var(--border);
      background: var(--chrome); backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--topbar-x); position: sticky; top: 0; z-index: 200;
    }
    .topbar-brand-wrap { display: flex; align-items: center; gap: 14px; }
    .topbar-brand { display: flex; align-items: center; gap: 14px; background: transparent; border: none; cursor: pointer; padding: 4px 6px; margin: -4px -6px; border-radius: 8px; transition: background .14s ease; }
    .topbar-brand:hover { background: var(--surface-1); }
    .topbar-logo {
      width: 30px; height: 30px; border: 1px solid var(--border-2); border-radius: 6px;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: var(--surface-2); flex-shrink: 0;
    }
    .topbar-name { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text); letter-spacing: .14em; text-transform: uppercase; }
    .topbar-sep  { width: 1px; height: 18px; background: var(--border-2); }
    .topbar-module { font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: .18em; text-transform: uppercase; }
    .topbar-version { font-family: var(--mono); font-size: 9px; color: var(--text-3); opacity: .55; letter-spacing: .04em; margin-left: 10px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .sync-indicator {
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .06em; padding: 5px 11px; border-radius: 20px;
      border: 1px solid #47556940; color: #475569;
      transition: all .25s ease; white-space: nowrap; cursor: pointer;
    }
    .sync-indicator:hover { filter: brightness(1.3); }
    .role-badge {
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      padding: 6px 12px; border-radius: 20px; border: 1px solid;
      display: inline-flex; align-items: center; gap: 6px;
      cursor: pointer; transition: all .15s ease;
    }
    .role-badge.operator { color: var(--text-2); border-color: var(--border-2); background: var(--surface-1); }
    .role-badge.operator:hover { color: var(--text); background: var(--surface-2); }
    .role-badge.admin { color: var(--amber); border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.08); }
    .role-badge.admin:hover { background: rgba(245,158,11,.14); }

    /* ── KLIKBAAR PARAM-NUMMER + FOTO ── */
    .param-num-btn { cursor: pointer; transition: all .14s ease; }
    .param-num-btn:hover { background: rgba(245,158,11,.18) !important; border-color: rgba(245,158,11,.45) !important; transform: scale(1.06); }
    .photo-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #06b6d4; margin-left: 6px; vertical-align: middle;
      box-shadow: 0 0 5px rgba(6,182,212,.6);
    }
    .photo-dot.is-video { background: #a855f7; box-shadow: 0 0 5px rgba(168,85,247,.6); }
    .photo-overlay {
      position: fixed; inset: 0; z-index: 650;
      background: rgba(0,0,0,.82); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      animation: fadeUp .16s ease; padding: 16px;
    }
    .photo-box {
      background: var(--panel); border: 1px solid var(--border-2); border-radius: 16px;
      max-width: 560px; width: 100%; max-height: 90vh; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 24px 80px rgba(0,0,0,.8);
    }
    .photo-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--border); background: rgba(var(--ink),.02);
    }
    .photo-title { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
    .photo-close {
      width: 32px; height: 32px; border-radius: 7px; border: 1px solid var(--border-2);
      background: var(--surface-1); color: var(--text-2); font-size: 14px; transition: all .14s ease;
    }
    .photo-close:hover { background: var(--surface-3); color: var(--text); }
    .photo-body { padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; align-items: center; }
    .photo-img { max-width: 100%; max-height: 64vh; border-radius: 10px; border: 1px solid var(--border-2); }
    .photo-meta { font-family: var(--mono); font-size: 11px; color: var(--text-3); text-align: center; }
    .photo-empty { font-size: 13px; color: var(--text-2); text-align: center; padding: 24px 12px; }
    .photo-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .photo-del { color: var(--red) !important; border-color: rgba(239,68,68,.3) !important; }
    .photo-del:hover { background: rgba(239,68,68,.12) !important; }
    .health-row { display: flex; justify-content: space-between; gap: 14px; padding: 10px 2px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .admin-card-desc { font-size: 12px; color: var(--text-3); }
    /* ── Admin-scherm (premium) ── */
    .admin-content { max-width: 800px; }
    /* Entrance: secties glijden zacht binnen (premium gevoel) */
    @keyframes adminFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .admin-content > * { animation: adminFadeUp .38s ease both; }
    .admin-content > *:nth-child(2) { animation-delay: .05s; }
    .admin-content > *:nth-child(3) { animation-delay: .1s; }
    .admin-content > *:nth-child(4) { animation-delay: .15s; }
    .admin-content > *:nth-child(5) { animation-delay: .2s; }
    .admin-content > *:nth-child(6) { animation-delay: .25s; }
    /* Refresh-knop */
    .admin-refresh { flex-shrink: 0; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 11px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-2); cursor: pointer; transition: background .13s ease, border-color .13s ease; }
    .admin-refresh:hover { background: var(--surface-2); border-color: var(--border-3); }
    .admin-refresh svg { width: 15px; height: 15px; }
    .admin-refresh.is-spinning svg { animation: adminSpin .8s linear infinite; }
    @keyframes adminSpin { to { transform: rotate(360deg); } }
    /* Sparkline + trend in KPI's */
    .admin-kpi-numrow { display: flex; align-items: center; gap: 9px; width: 100%; }
    .admin-spark { width: 68px; height: 22px; color: var(--text-3); opacity: .8; flex-shrink: 0; margin-left: auto; margin-right: 2px; }
    .admin-kpi.is-clickable .admin-spark { margin-right: 14px; }
    .admin-trend { font-size: 11px; font-weight: 800; font-family: var(--mono); padding: 2px 7px; border-radius: 9px; }
    .admin-trend.good { color: #22c55e; background: rgba(34,197,94,.1); }
    .admin-trend.bad { color: #ef4444; background: rgba(239,68,68,.1); }
    /* ── Admin: mobiel (smal scherm) ── */
    @media (max-width: 640px){
      .admin-top { gap: 10px; padding-bottom: 15px; margin-bottom: 16px; }
      .admin-hero-title { font-size: 18px; }
      .admin-hero-sub { font-size: 10px; }
      .admin-pill { padding: 5px 9px; font-size: 10px; gap: 5px; }
      .admin-refresh { width: 34px; height: 34px; border-radius: 10px; }
      /* KPI's: verticale opbouw — nummer boven, spark/trend eronder */
      .admin-kpis { gap: 8px; margin-bottom: 20px; }
      .admin-kpi { padding: 13px 8px 12px; border-radius: 14px; align-items: center; }
      .admin-kpi-ico { width: 26px; height: 26px; border-radius: 8px; margin-bottom: 9px; }
      .admin-kpi-ico svg { width: 14px; height: 14px; }
      .admin-kpi-numrow { flex-direction: column; align-items: center; gap: 6px; width: 100%; }
      .admin-kpi-num { font-size: clamp(15px, 5vw, 21px); text-align: center; }
      .admin-spark { width: 100%; max-width: 78px; height: 18px; margin: 0; }
      .admin-kpi.is-clickable .admin-spark { margin: 0; }
      .admin-trend { font-size: 10px; padding: 2px 6px; }
      .admin-kpi-label { font-size: 10px; margin-top: 5px; text-align: center; width: 100%; }
      .admin-kpi.is-clickable::after { display: none; }
      /* Melding-kaart + feed compacter, waarden mogen wrappen */
      .admin-melding { padding: 14px 15px; border-radius: 14px; }
      .admin-melding-title { font-size: 14px; }
      .amv-old, .amv-new { font-size: 14px; }
      .admin-act { padding: 11px 12px; gap: 10px; }
      .admin-act-title { font-size: 12px; white-space: normal; }
      .admin-act-sub { white-space: normal; }
      .admin-section { margin-bottom: 22px; }
      .admin-section-label { margin-bottom: 9px; }
    }
    /* Top-bar: terug + titel + status-pil */
    .admin-top { display: flex; align-items: center; gap: 14px; padding: 4px 0 18px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .admin-top-titles { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .admin-hero-title { font-size: 21px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
    .admin-hero-sub { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .admin-pill { flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); color: var(--text-2); background: var(--surface-1); }
    .admin-pill-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
    .admin-pill.ok { color: #22c55e; border-color: rgba(34,197,94,.28); }
    .admin-pill.ok .admin-pill-dot { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,.6); }
    .admin-pill.warn { color: var(--amber); border-color: rgba(245,158,11,.3); }
    .admin-pill.warn .admin-pill-dot { background: var(--amber); box-shadow: 0 0 6px rgba(245,158,11,.6); }
    /* KPI-rij */
    .admin-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; margin-bottom: 24px; }
    .admin-kpi { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 0; background: linear-gradient(160deg, var(--surface-2), var(--surface-1)); border: 1px solid var(--border); border-radius: 16px; padding: 16px 16px 14px; text-align: left; overflow: hidden; }
    .admin-kpi-ico { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: rgba(var(--ink),.05); color: var(--text-3); margin-bottom: 12px; }
    .admin-kpi-ico svg { width: 16px; height: 16px; }
    .admin-kpi-num { font-size: 27px; font-weight: 800; font-family: var(--mono); color: var(--text); line-height: 1; letter-spacing: -.02em; }
    .admin-kpi-label { font-size: 11px; color: var(--text-3); margin-top: 6px; font-weight: 500; }
    .admin-kpi.is-clickable { cursor: pointer; transition: transform .13s ease, border-color .13s ease; }
    .admin-kpi.is-clickable:hover { transform: translateY(-2px); border-color: var(--border-3); }
    .admin-kpi.is-clickable:active { transform: translateY(0); }
    .admin-kpi.is-clickable::after { content: '›'; position: absolute; top: 13px; right: 14px; font-size: 18px; color: var(--text-3); opacity: .5; }
    .admin-kpi.is-alert { border-color: rgba(245,158,11,.4); background: linear-gradient(160deg, rgba(245,158,11,.12), rgba(245,158,11,.03)); }
    .admin-kpi.is-alert .admin-kpi-num { color: var(--amber); }
    .admin-kpi.is-alert .admin-kpi-ico { background: rgba(245,158,11,.16); color: var(--amber); }
    /* Melding-preview: de recentste melding inline */
    .admin-melding { display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; background: linear-gradient(135deg, rgba(245,158,11,.1), rgba(245,158,11,.02)); border: 1px solid rgba(245,158,11,.45); border-radius: 16px; padding: 17px 18px; cursor: pointer; color: var(--text); box-shadow: 0 0 0 1px rgba(245,158,11,.08), 0 8px 24px -12px rgba(245,158,11,.3); transition: transform .13s ease; }
    .admin-melding:hover { transform: translateY(-2px); }
    .admin-melding:active { transform: translateY(0); }
    .admin-melding-head { display: flex; align-items: center; gap: 10px; }
    .admin-melding-ico { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(245,158,11,.16); color: var(--amber); flex-shrink: 0; }
    .admin-melding-ico svg { width: 18px; height: 18px; }
    .admin-melding-title { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .admin-melding-vals { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; font-family: var(--mono); }
    .amv-old { font-size: 15px; color: var(--slate); }
    .amv-arr { font-size: 13px; color: var(--amber); font-weight: 700; }
    .amv-new { font-size: 15px; color: var(--amber); font-weight: 700; }
    .admin-melding-ctx { font-size: 11px; color: var(--text-3); font-family: var(--mono); }
    .admin-melding-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-3); }
    .admin-melding-all { color: var(--amber); font-weight: 700; }
    .admin-allclear { padding: 15px 18px; border: 1px solid rgba(34,197,94,.22); border-radius: 14px; background: rgba(34,197,94,.05); color: #22c55e; font-size: 13px; font-weight: 600; }
    /* Activiteit-feed */
    .admin-acts { border: 1px solid var(--border); border-radius: 14px; background: var(--surface-1); overflow: hidden; }
    .admin-act { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-bottom: 1px solid var(--border); }
    .admin-act:last-child { border-bottom: none; }
    .admin-act-ico { flex-shrink: 0; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: rgba(var(--ink),.05); color: var(--text-3); }
    .admin-act-ico.ok { background: rgba(34,197,94,.1); color: #22c55e; }
    .admin-act-ico svg { width: 15px; height: 15px; }
    .admin-act-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .admin-act-title { font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .admin-act-title .mono { font-family: var(--mono); color: var(--text); font-weight: 600; }
    .admin-act-sub { font-size: 10.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .admin-act-when { flex-shrink: 0; font-size: 10.5px; color: var(--text-3); font-family: var(--mono); }
    .admin-act-empty { padding: 16px; font-size: 12px; color: var(--text-3); text-align: center; }
    .admin-section { margin-bottom: 26px; }
    .admin-section-label { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); margin-bottom: 11px; }
    .admin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (max-width: 560px){ .admin-grid { grid-template-columns: 1fr; } }
    .admin-tile { display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 15px 16px; cursor: pointer; color: var(--text); transition: transform .13s ease, border-color .13s ease, background .13s ease; }
    .admin-tile:hover { transform: translateY(-2px); border-color: var(--border-3); background: var(--surface-2); }
    .admin-tile:active { transform: translateY(0); background: var(--surface-3); }
    .admin-tile-ico { flex-shrink: 0; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 11px; background: rgba(var(--ink),.05); color: var(--text-2); transition: background .13s ease; }
    .admin-tile:hover .admin-tile-ico { background: rgba(var(--ink),.09); }
    .admin-tile-ico svg { width: 20px; height: 20px; }
    .admin-tile-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .admin-tile-title { font-size: 14px; font-weight: 650; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .admin-tile-sub { font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Machine Hub ── */

    .qrlink-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 12px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 7px; align-items: center; }
    .qrlink-name { font-size: 13px; font-weight: 650; color: var(--text); }
    .qrlink-url { grid-column: 1 / -1; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; order: 3; }
    .qrlink-actions { display: flex; gap: 6px; }
    .qrlink-btn { font-size: 11px; font-weight: 600; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text); cursor: pointer; }

    .health-btn {
      display: inline-flex; align-items: center; justify-content: center;

    .health-btn { position: relative; }
    .notif-badge {
      position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px;

    .report-btn { color: #f59e0b !important; border-color: rgba(245,158,11,.3) !important; padding-left: 12px !important; padding-right: 12px !important; font-size: 15px !important; }
    .report-btn:hover { background: rgba(245,158,11,.12) !important; border-color: rgba(245,158,11,.5) !important; }
    .report-param { font-size: 15px; font-weight: 700; color: var(--text); }
    .report-current { font-size: 13px; color: var(--text-2); }
    .report-hint { font-size: 11px; color: var(--text-3); line-height: 1.5; }
    .report-card { border: 1px solid var(--border-2); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; }
    .report-card-head { font-size: 13px; font-weight: 700; color: var(--text); }
    .report-card-row { font-size: 12px; color: var(--text-2); }
    .report-card-comment { font-size: 12px; color: var(--text-2); font-style: italic; }
    .report-card-meta { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
    .report-resolve { margin-top: 6px; align-self: flex-start; font-size: 12px !important; padding: 6px 12px !important; }
    .report-card-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .report-apply { color: var(--green) !important; border-color: rgba(34,197,94,.4) !important; font-size: 12px !important; padding: 6px 12px !important; }
    .report-apply:hover { background: rgba(34,197,94,.12) !important; }
    /* Ombouw-tijdmeting */
    .timing-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 11px 15px; margin-bottom: 16px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--surface-1); }
    .timing-bar.running { border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.06); }
    .timing-label { font-size: 12px; color: var(--text-3); flex: 1; min-width: 120px; }
    .timing-live { font-family: var(--mono); font-size: 17px; font-weight: 700; color: var(--green); letter-spacing: .02em; }
    .timing-actions { display: flex; gap: 8px; }
    .timing-btn { font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 9px 15px; border-radius: 7px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text); transition: all .14s ease; letter-spacing: .04em; }

    .timing-btn.start:hover { background: rgba(34,197,94,.12); }
    .timing-btn.stop { color: var(--green); border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.1); }

    .timing-btn.cancel { color: var(--text-3); }

    .timing-card { border-bottom: 1px solid var(--border); padding: 9px 2px; }
    .timing-card-top { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
    .timing-card-dur { font-family: var(--mono); font-weight: 700; color: var(--green); }
    .timing-card-meta { font-family: var(--mono); font-size: 10px; color: var(--text-3); margin-top: 2px; }
    @media (pointer: coarse){ .health-btn { width: 44px; height: 44px; } }

    .health-key { color: var(--text-3); font-family: var(--mono); font-size: 11px; letter-spacing: .04em; }
    .health-val { color: var(--text); font-family: var(--mono); font-size: 12px; font-weight: 600; text-align: right; word-break: break-all; }
    @media (pointer: coarse){ .photo-close { width: 44px; height: 44px; } }

    /* ── TAALKIEZER ── */
    .lang-picker { position: relative; }
    .lang-btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--mono); font-size: 12px; font-weight: 700;
      padding: 6px 10px; border-radius: 20px; border: 1px solid var(--border-2);
      background: var(--surface-1); color: var(--text-2); transition: all .14s ease;
    }

      position: absolute; top: calc(100% + 8px); right: 0; z-index: 300;

    .afronden-row { margin: 0 0 14px; }

    .afronden-summary { padding: 13px 22px !important; font-size: 14px !important; }
    /* ── Ombouw-historie (Fase 4) ── */
    .hist-filters { display: flex; flex-wrap: wrap; gap: 7px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
    .hist-filter { font-size: 12px; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--border-2); background: var(--surface-1); color: var(--text); font-family: inherit; }
    .hist-date { color-scheme: dark; }
    .hist-clear { font-size: 12px; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--border-2); background: transparent; color: var(--amber); cursor: pointer; font-weight: 600; }
    .hist-count { font-family: var(--mono); font-size: 13px; color: var(--text-3); font-weight: 700; margin-left: 4px; }
    .hist-row { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: var(--surface-1); }
    .hist-row-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
    .hist-machine { font-size: 14px; font-weight: 700; color: var(--text); }
    .hist-dur { font-family: var(--mono); font-size: 12px; font-weight: 700; color: #22c55e; background: rgba(34,197,94,.1); padding: 3px 9px; border-radius: 8px; }
    .hist-checkonly { font-size: 11px; color: var(--text-3); background: var(--surface-2); padding: 3px 9px; border-radius: 8px; }
    .hist-combo { font-size: 12.5px; color: var(--text-2); font-family: var(--mono); margin-bottom: 4px; }
    .hist-meta { font-size: 11px; color: var(--text-3); }
    /* ── Timerbalk (Fase 3) ── */
    .timer-bar { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-1); }
    .timer-bar.is-running { border-color: rgba(59,130,246,.35); background: rgba(59,130,246,.06); }
    .timer-bar.is-paused  { border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.06); }
    .timer-label { font-size: 13px; color: var(--text-3); margin-right: auto; }
    .timer-clock { font-family: var(--mono); font-size: 22px; font-weight: 800; color: var(--text); margin-right: auto; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
    .is-running .timer-clock { color: #3b82f6; }
    .is-paused .timer-clock { color: var(--amber); }
    .timer-paused-tag { font-size: 11px; font-weight: 700; color: var(--amber); text-transform: uppercase; letter-spacing: .08em; }
    .timer-btn { border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text); }
    .timer-start  { color: #22c55e; border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.1); }
    .timer-pause  { color: var(--amber); border-color: rgba(245,158,11,.4); background: rgba(245,158,11,.1); }
    .timer-resume { color: #3b82f6; border-color: rgba(59,130,246,.4); background: rgba(59,130,246,.1); }
    .timer-stop { color: #ef4444; border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.1); }
    .timer-bar.is-timed { border-color: rgba(148,163,184,.35); background: rgba(148,163,184,.06); }
    .is-timed .timer-clock { color: var(--slate); }
    .timer-timed-tag { font-size: 11px; font-weight: 700; color: var(--slate); text-transform: uppercase; letter-spacing: .06em; margin-right: auto; }
    .timer-restart { color: var(--slate); border-color: var(--border-2); background: var(--surface-2); }
    /* Stop-dialoog keuzes */
    .stop-dialog-title { font-size: 16px; font-weight: 700; color: var(--text); text-align: center; margin-bottom: 6px; }
    .stop-dialog-time { font-family: var(--mono); font-size: 22px; font-weight: 800; color: var(--text); text-align: center; margin-bottom: 18px; }
    .stop-choice { display: flex; align-items: center; gap: 14px; width: 100%; padding: 15px 16px; margin-bottom: 10px; border-radius: 13px; border: 1px solid var(--border-2); background: var(--surface-1); color: var(--text); cursor: pointer; text-align: left; }
    .stop-choice-ico { width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 16px; font-weight: 800; }
    .stop-finish .stop-choice-ico { background: rgba(34,197,94,.14); color: #22c55e; }
    .stop-cancel .stop-choice-ico { background: rgba(239,68,68,.14); color: #ef4444; }
    .stop-choice-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

    .stop-choice-txt span { font-size: 12px; color: var(--text-3); }
    .stop-finish:active, .stop-cancel:active { transform: scale(.98); }
    /* ── Machine-status badges (Fase 2) ── */
    .ms-badge { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; letter-spacing: .02em; margin-right: auto; }
    .ms-run   { color: #3b82f6; background: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.3); }
    .ms-pause { color: var(--amber); background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.3); }
    .ms-done  { color: #22c55e; background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.3); }
    .ms-rep   { color: var(--amber); background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.35); }
    .ms-timed { color: var(--slate); background: rgba(148,163,184,.12); border: 1px solid rgba(148,163,184,.3); }
    .afronden-btn { color: #22c55e !important; border-color: rgba(34,197,94,.4) !important; font-weight: 700 !important; }
    .afronden-btn:hover { background: rgba(34,197,94,.12) !important; }
    .machine-status-line { font-size: 12px; color: #22c55e; font-weight: 600; margin: 0 0 12px; padding: 8px 14px; background: rgba(34,197,94,.07); border: 1px solid rgba(34,197,94,.2); border-radius: 10px; }
    /* ── Pending operators (admin goedkeuring) ── */
    .op-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1); }

    .op-username { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); margin-top: 2px; }

    .op-approve { background: rgba(34,197,94,.12); color: #22c55e; border-color: rgba(34,197,94,.3); }
    .op-reject { background: transparent; color: var(--text-3); }
    .op-reject:hover { color: var(--red); border-color: var(--red); }
    /* ── Welkom / login-scherm (poort) ── */
    .welcome-screen { position: fixed; inset: 0; z-index: 400; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
    .welcome-topbar { position: absolute; top: 0; right: 0; display: flex; gap: 8px; padding: 16px 18px; }
    .welcome-card { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 4px; animation: adminFadeUp .4s ease both; }
    .welcome-logo { width: 66px; height: 66px; border-radius: 18px; border: 1px solid var(--border-2); background: var(--surface-2); display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 32px; margin-bottom: 6px; }
    .welcome-logo img { width: 100%; height: 100%; object-fit: contain; }
    .welcome-brand { font-family: var(--mono); font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: .06em; }
    .welcome-sub { font-size: 13px; color: var(--text-3); text-align: center; margin-bottom: 20px; }
    .wc-fields { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .wc-row2 { display: flex; gap: 10px; }
    .wc-row2 .login-input { flex: 1; min-width: 0; }
    .wc-primary { width: 100%; margin-top: 14px; }
    .wc-switch { width: 100%; margin-top: 12px; background: transparent; border: none; color: var(--amber); font-size: 13px; font-weight: 600; cursor: pointer; padding: 8px; }
    .wc-switch:hover { text-decoration: underline; }
    .wc-admin { margin-top: 22px; background: transparent; border: none; color: var(--text-3); font-size: 12px; cursor: pointer; padding: 6px; }
    .wc-admin:hover { color: var(--text-2); }
    @media (max-width: 480px){ .welcome-card { max-width: 100%; } }
    /* ── LOGIN OVERLAY ── */
    .login-overlay {
      position: fixed; inset: 0; z-index: 600;
      background: rgba(0,0,0,.8); backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      animation: fadeUp .2s ease;
    }
    .login-box {
      background: var(--panel); border: 1px solid var(--border-2); border-radius: 16px;
      padding: 32px; max-width: 380px; width: 90%;
      display: flex; flex-direction: column; gap: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.8);
    }
    .login-title { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -.03em; }
    .login-sub   { font-size: 12px; color: var(--text-2); margin-top: -10px; }
    .login-input {
      width: 100%; padding: 14px 16px; border-radius: 9px;
      border: 1px solid var(--border-2); background: rgba(var(--ink),.03);
      color: var(--text); font-family: var(--mono); font-size: 16px; font-weight: 600;
      outline: none; letter-spacing: .04em;
    }
    .login-input:focus { border-color: rgba(245,158,11,.4); box-shadow: 0 0 0 3px rgba(245,158,11,.08); }
    .login-error { font-family: var(--mono); font-size: 11px; color: var(--red); padding: 6px 10px; border-radius: 6px; background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); }
    .login-actions { display: flex; gap: 8px; }
    .btn-login { flex: 1; font-size: 13px; font-weight: 700; padding: 11px 18px; border-radius: 9px; background: var(--amber); color: #000; border: none; transition: all .15s ease; }
    .btn-login:hover { background: #fbbf24; box-shadow: 0 0 22px var(--amber-glow); }
    .btn-login-cancel { font-size: 13px; font-weight: 500; padding: 11px 18px; border-radius: 9px; border: 1px solid var(--border-2); background: transparent; color: var(--text-2); transition: all .14s ease; }
    .btn-login-cancel:hover { background: var(--surface-2); color: var(--text); }

    .body { display: grid; grid-template-columns: 260px 1fr; }

    .sidebar {
      border-right: 1px solid var(--border); background: var(--chrome-3);
      display: flex; flex-direction: column; padding: 28px 0;
      min-height: calc(100vh - 56px);
      position: sticky; top: 56px; align-self: start;
      max-height: calc(100vh - 56px); overflow-y: auto;
    }

    .sidebar::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 1px; }
    .sidebar-section { padding: 0 18px 22px; }
    .sidebar-label {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: .22em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px;
    }
    .flow-card { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); overflow: hidden; }
