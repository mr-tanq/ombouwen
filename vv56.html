  const biscuitLabel      = id => { const _b = biscuits().find(b=>b.id===id); return _b ? _b.label || '' : ''; };

     Thee/Kokos "4x4" maps to the separate key "theekokos" — NEVER to
     Koffiekoek 5x5. Other products keep their box format unless a formatMap
     override exists. */
  function resolveDataFormat(biscuitId, uiFormat){
    /* Thee/Kokos heeft eigen data onder de key 'theekokos' — nooit samenvoegen
       met Koffiekoek 5x5. Dit is de harde garantie, los van formatMap. */
    if(biscuitId === 'theekokos') return 'theekokos';
    const meta = getBiscuitMeta(biscuitId);
    if(meta && meta.formatMap && meta.formatMap[uiFormat]) return meta.formatMap[uiFormat];

  function buildFlowRows(fromObj, toObj){
    const keys = Array.from(new Set([...Object.keys(fromObj||{}), ...Object.keys(toObj||{})]));
    return keys.map(k => [k, fromObj && fromObj[k] != null ? fromObj[k] : '—', toObj && toObj[k] != null ? toObj[k] : '—']);
  }

  function escapeHtml(v){
    return String(v != null ? v : '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function cleanNumberToken(token){
    let s = String(token).trim();
    if(!s) return s;
    if(!/^[-+]?\d+[\.,]?\d*$/.test(s)) return s;
    const hasComma=s.includes(','), hasDot=s.includes('.');
    const sep = hasComma?',':(hasDot?'.':'');
    let parts = sep ? s.split(sep) : [s];
    let intPart = parts[0].replace(/^0+(\d)/,'$1');
    if(intPart==='') intPart='0';
    if(parts.length===1) return intPart;
    let decPart = parts[1].replace(/0+$/,'');
    if(decPart==='') return intPart;
    return intPart+','+decPart;
  }

  function normalizeDisplayValue(value){
    return String(value != null ? value : '').replace(/\u0392/g,'B')
      .split('/').map(p=>cleanNumberToken(p.trim())).join(' / ');
  }

  function normalizeCompareValue(value){
    return normalizeDisplayValue(value).toLowerCase().replace(/\s+/g,' ').trim();
  }

  const filterRows = (rows, onlyChanges) =>
    onlyChanges ? rows.filter(r=>normalizeCompareValue(r[1])!==normalizeCompareValue(r[2])) : rows;

  const isColorToken = t => colorFromWord(t) !== null;

  function renderColorDot(token){
    const name = colorFromWord(token);
    if(!name) return '';
    const color = COLOR_MAP[name];
    return `<span class="colorDot ${name}" style="background:${color}"></span>`;
  }

  /* Zet elk kleurwoord (waar dan ook in de tekst) om naar een gekleurde stip
     en houdt de omringende tekst intact. Werkt per /-deel en per woord, zodat
     "Wit 10x", "Wit tot merkstreep", "Grijs / Wit 10x" allemaal correct tonen.
     Hele woorden only — "groene band" matcht, "groene" binnen een langer woord
     zonder spatie niet, dus echte tekstwaarden blijven ongemoeid. */
  function renderRichValue(value){
    const norm  = normalizeDisplayValue(value);
    const parts = norm.split('/').map(p=>p.trim()).filter(Boolean);
    if(parts.length && parts.every(isColorToken))
      return `<span class="richValue"><span class="colorDots">${parts.map(renderColorDot).join('')}</span></span>`;

    const renderPart = p => {
      const words = p.split(/\s+/);
      /* Als geen enkel woord een kleur is → gewoon tekst (snelpad). */
      if(!words.some(w => isColorToken(w))) return `<span class="richText">${escapeHtml(p)}</span>`;
      /* Anders: kleurwoorden → stip, rest → tekst, in volgorde. */
      let out = '', buf = [];
      const flush = () => { if(buf.length){ out += `<span class="richText">${escapeHtml(buf.join(' '))}</span>`; buf = []; } };
      words.forEach(w=>{
        if(isColorToken(w)){ flush(); out += renderColorDot(w); }
        else buf.push(w);
      });
      flush();
      return out;
    };

    const html = parts.map(renderPart);
    return `<span class="richValue">${html.join('<span class="richText">/</span>')}</span>`;
  }

  function renderParamKey(key){
    const m = String(key).match(/^(\d+[A-Z]?)\s+(.+)$/);

  const SESSION_KEY = 'pally_session';
  function persistSession(){

  function restoreSession(){

      if(d && d.c) Object.assign(checkState, d.c);

  function loadStore(){ try{ return JSON.parse(localStorage.getItem('pally_store')||'{}'); }catch(e){return {};} }
  function saveStore(s){

       Bewaar de laatste 1000 entries lokaal (de cloud houdt de volledige
       historie). Zo blijft opslaan betrouwbaar. */
    try{

  /* Store-sleutel bevat nu ALTIJD de lijngroep als prefix:

  /* ── Flowpacker-logica (pakket i.p.v. doos) ──
     De Cavanna is een flowpacker: hij verpakt het KOEKJE/PAKKET zelf, dus
     zijn instellingen hangen af van het product, niet van hoeveel pakketten
     in een doos gaan (5x6, 3x6…). Uitzondering: een groter pakket (Koffiekoek
     XXL = 5x5) heeft eigen instellingen.

     PACKAGE_SECTIONS = secties waarvoor dit geldt (per lijngroep uitbreidbaar).
     packageFormatMap = welke doos-formaten samenvallen tot één pakket-sleutel;
       formaten die hier niet staan blijven zichzelf (dus krijgen eigen sleutel). */
  const PACKAGE_SECTIONS = ['cavanna'];
  const PACKAGE_FORMAT_MAP = {
    /* product-id → { doosformaat: pakket-sleutel } */
    richtea:    { '5x6':'pkg', '3x6':'pkg' },
    country:    { '5x6':'pkg', '3x6':'pkg' },
    digestive:  { '5x6':'pkg', '3x6':'pkg' },
    koffiekoek: { '4x4':'pkg', '5x4':'pkg', '5x5':'xxl' },  /* XXL apart */
    theekokos:  { '4x4':'pkg' }
  };

  /* Geeft het opslag-/data-formaat terug. Voor flowpacker-secties collapse
     naar het pakket-formaat; anders het echte doosformaat. */
  function packageFormat(section, biscuitId, uiFormat){
    if(PACKAGE_SECTIONS.indexOf(section) === -1) return uiFormat;
    const m = PACKAGE_FORMAT_MAP[biscuitId];
    if(m && m[uiFormat]) return biscuitId + '-' + m[uiFormat];  /* bv. richtea-pkg, koffiekoek-xxl */
    return uiFormat;
  }

  function buildStoreKeyForGroup(group, section, biscuit, format, line){
    const fmt = packageFormat(section, biscuit, format);
    return `${group || PILOT_GROUP}|${section}|${biscuit}|${fmt}|${line || ''}`;
  }

  function buildStoreKeyFor(section, biscuit, format, line){
    return buildStoreKeyForGroup(state.selectedLineGroup, section, biscuit, format, line);

  /* ══════════════════════════════════════════════════════════════════

  /* #1 Deep-link parser. Leest ?qr=1&group=..&section=..&line=.. uit de URL.
     Retourneert een geldig contextobject of null (ongeldig → normale flow). */
  function parseMachineDeepLink(){
    let params;
    try { params = new URLSearchParams(window.location.search); }
    catch(e){ return null; }
    if(params.get('qr') !== '1') return null;

    const group   = params.get('group') || '';
    const section = params.get('section') || '';
    let   line    = params.get('line') || '';

    const meta = getLineGroupMeta(group);
    if(!meta || CONFIGURED_GROUPS.indexOf(group) === -1) return null;

    const cfg = GROUP_CONFIG[group];
    if(!cfg || cfg.sections.indexOf(section) === -1) return null;

    const needsLine = (section === 'cavanna' || section === 'robertpack');
    if(needsLine){
      const lines = cfg.lines || [];
      if(!line || lines.indexOf(line) === -1) return null;
    } else {
      line = '';
    }
    return { group, section, line, afdeling: meta.afdeling };
  }

  function applyMachineDeepLink(ctx){
    state.selectedAfdeling  = ctx.afdeling;
    state.selectedLineGroup = ctx.group;
    state.appMode           = 'machineHub';
    state.stage             = 2;
    state.section           = ctx.section;
    if(ctx.section === 'cavanna')    state.cavannaLine    = ctx.line;
    if(ctx.section === 'robertpack') state.robertpackLine = ctx.line;
    state.toBiscuit = null; state.toFormat = null;
    state.fromBiscuit = null; state.fromFormat = null;
    state.searchQuery = '';
    state.fromMachineHub = false;
    state.showAdmin = false;
    checkState.active = false; checkState.showSummary = false;
    checkState.results = {}; checkState.stepIndex = 0; checkState.statusParam = null;
  }

  /* Verlaat QR-modus netjes: wis de qr-query uit de browser-URL zodat een
     refresh niet opnieuw de hub opent. Alleen bij bewust verlaten. */
  function clearQrUrl(){
    try{ window.history.replaceState({}, '', window.location.pathname); }catch(e){}
  }

  function getMachineHubCards(){
    const cfg = GROUP_CONFIG[state.selectedLineGroup] || GROUP_CONFIG[PILOT_GROUP];
    const section = state.section;
    const biscuits = cfg.biscuits || [];
    const cards = [];
    biscuits.forEach(b=>{
      const formats = b.formats || [];
      if(section === 'cavanna' && PACKAGE_SECTIONS.indexOf('cavanna') !== -1){
        const groups = {};
        formats.forEach(f=>{
          const pk = packageFormat('cavanna', b.id, f);
          if(!groups[pk]) groups[pk] = [];
          groups[pk].push(f);
        });
        Object.keys(groups).forEach(pk=>{
          const fmts = groups[pk];
          const isXxl = /-xxl$/.test(pk);
          const nameSuffix = (b.id === 'koffiekoek') ? (isXxl ? ' XXL' : ' normaal') : '';
          cards.push({ biscuit:b.id, label:b.label + nameSuffix, formatLabel:fmts.join(' / '), canonicalFormat:fmts[0] });
        });
      } else {
        formats.forEach(f=>{
          cards.push({ biscuit:b.id, label:b.label, formatLabel:f, canonicalFormat:f });
        });
      }
    });
    return cards;
  }

  function openMachineHubCard(card){
    state.appMode = 'status';
    state.stage = 2;
    state.toBiscuit = card.biscuit;
    state.toFormat  = card.canonicalFormat;
    state.fromBiscuit = null; state.fromFormat = null;
    state.searchQuery = '';
    state.fromMachineHub = true;
    checkState.active = false; checkState.showSummary = false;
    checkState.results = {}; checkState.stepIndex = 0; checkState.statusParam = null;
    render();

  /* #6 Admin: overzicht van QR-deep-link URLs voor alle machine-locaties.
     Geen QR-afbeeldingen (die kunnen later uit deze URLs). Links only. */
  function machineLocationsForGroup(group){
    const cfg = GROUP_CONFIG[group];
    if(!cfg) return [];
    const out = [];
    (cfg.sections || []).forEach(sec=>{
      const title = cfg.sectionTitles[sec] || sec;
      const needsLine = (sec === 'cavanna' || sec === 'robertpack');
      if(needsLine){
        (cfg.lines || []).forEach(ln=>{
          out.push({ group, section:sec, line:ln, name:`${title} ${ln}` });
        });
      } else {
        out.push({ group, section:sec, line:'', name:title });
      }
    });
    return out;
  }

  function machineDeepLinkUrl(loc){
    const base = window.location.origin + window.location.pathname;
    let url = `${base}?qr=1&group=${encodeURIComponent(loc.group)}&section=${encodeURIComponent(loc.section)}`;
    if(loc.line) url += `&line=${encodeURIComponent(loc.line)}`;

  /* Oude sleutel (pilot, vóór lijngroepen): sectie|product|formaat|lijn.
     Alleen voor choco-9-10 lezen we die als fallback zodat bestaande
     opgeslagen waarden niet verdwijnen. Nieuwe saves gebruiken altijd
     de nieuwe sleutel. */
  /* Oud sleutel-formaat van de pilot (vóór lijngroepen):
       sectie|product|formaat|lijn   (zonder groep-prefix)
     Alleen voor de pilotgroep (choco-9-10) als fallback gelezen, zodat
     bestaande opgeslagen waarden niet verdwijnen. */
  /* Welke doos-formaten vielen samen tot een pakket-sleutel (voor legacy-lookup).
     Omgekeerde van PACKAGE_FORMAT_MAP: pakket-suffix → lijst doosformaten. */
  const PACKAGE_LEGACY_FORMATS = {
    'richtea-pkg':    ['5x6','3x6'],
    'country-pkg':    ['5x6','3x6'],
    'digestive-pkg':  ['5x6','3x6'],
    'koffiekoek-pkg': ['4x4','5x4'],
    'koffiekoek-xxl': ['5x5'],
    'theekokos-pkg':  ['4x4','theekokos']
  };

  function legacyStoreKeysFrom(newKey){
    if((state.selectedLineGroup || PILOT_GROUP) !== PILOT_GROUP) return [];
    const parts = String(newKey).split('|');
    if(parts.length !== 5) return [];
    const [grp, section, biscuit, fmt, line] = parts;
    const out = [];
    /* (a) oude sleutel zonder groep-prefix: sectie|product|formaat|lijn */
    out.push(parts.slice(1).join('|'));
    /* (b) pre-packageFormat sleutels: het pakket-formaat was toen het echte
       doosformaat. Voeg alle bijbehorende doosformaten toe, mét en zonder
       groep-prefix. Bv. richtea-pkg → 5x6, 3x6. */
    const boxes = PACKAGE_LEGACY_FORMATS[fmt];
    if(boxes){
      boxes.forEach(bf=>{
        out.push(`${grp}|${section}|${biscuit}|${bf}|${line}`);   /* met groep */
        out.push(`${section}|${biscuit}|${bf}|${line}`);           /* zonder groep */
      });
    }
    /* dedup */
    return Array.from(new Set(out)).filter(k => k !== newKey);
  }

  function getOfficialValue(store, storeKey, paramKey, fallback){
    const cv = store.currentValues && store.currentValues[storeKey];
    if(cv && cv[paramKey] != null && cv[paramKey] !== '') return cv[paramKey];
    /* Fallback naar oudere sleutel-formaten, alleen voor de pilotgroep */
    const legacies = legacyStoreKeysFrom(storeKey);
    for(const lk of legacies){
      const lcv = store.currentValues && store.currentValues[lk];
      if(lcv && lcv[paramKey] != null && lcv[paramKey] !== '') return lcv[paramKey];
    }
    return fallback;
  }

  /* buildStoreKey() blijft de TO-sleutel teruggeven (product dat gaat draaien),
     want alle schrijf-/status-paden rekenen daarop. */
  function buildStoreKey(){
    return buildStoreKeyFor(
      state.section,
      state.toBiscuit,
      state.toFormat,
      getLineForSection(state.section)
    );
  }

  function nowStr(){ return new Date().toLocaleString('nl-NL',{timeZone:'Europe/Amsterdam',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

  /* ═══════════════════════════════════════
     FOTO'S PER PARAMETER
     Een foto hoort bij sectie + parameter (bv. "dozen|3 Luchtverdeler"),
     NIET bij het volledige store-key — want de foto toont wáár op de machine
     je iets verstelt, en dat is hetzelfde ongeacht naar welk product je
     omschakelt. Opslag in Supabase Storage (bucket 'param-photos');
     een registry-tabel ('param_photos') houdt bij welke params een foto
     hebben zodat we niet elke keer de hele storage hoeven te listen.
  ═══════════════════════════════════════ */
  /* TODO (productie / officiële company deployment):
     Het 'param-photos' bucket is nu PUBLIEK leesbaar (publicUrl). Voor een
     officiële uitrol bij Pally → maak het bucket PRIVATE en gebruik
     createSignedUrl() met een korte vervaltijd i.p.v. getPublicUrl().
     Dan zijn foto's/video's alleen zichtbaar voor wie de app gebruikt,
     niet voor iedereen met de URL. Schrijven blijft hoe dan ook admin-only
     via RLS. */
  const PHOTO_BUCKET = 'param-photos';
  let photoRegistry = {};   // { "section|param": { url, updated_at, by } }

  function photoKey(param){
    /* Nieuwe media-sleutel bevat de lijngroep; oude pilotfoto's (choco-9-10)
       blijven leesbaar via fallback in getPhoto/hasPhoto. */
    const grp = state.selectedLineGroup || 'choco-9-10';
    return `${grp}|${state.section}|${param}`;
  }
  function legacyPhotoKey(param){
    if((state.selectedLineGroup || 'choco-9-10') !== 'choco-9-10') return null;
    return `${state.section}|${param}`;
  }
  function photoPath(param, ext){
    /* Pad bevat de lijngroep zodat uploads van bv. choco-9-10 en choco-7-8
       elkaar nooit kunnen overschrijven. Veilige bestandsnaam: alleen
       letters/cijfers, rest -> _ */
    const grp = state.selectedLineGroup || PILOT_GROUP;
    const safe = `${state.section}__${param}`.replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    return `${grp}/${state.section}/${safe}.${ext || 'jpg'}`;
  }
  function hasPhoto(param){
    return !!getPhoto(param);
  }
  function getPhoto(param){
    const rec = photoRegistry[photoKey(param)];
    if(rec && rec.url) return rec;
    const lk = legacyPhotoKey(param);
    if(lk){
      const old = photoRegistry[lk];
      if(old && old.url) return old;
    }
    return null;
  }

  async function loadPhotoRegistry(){
    if(!sb) return;
    try{
      const { data, error } = await sb.from('param_photos').select('*');
      if(error) throw error;
      const reg = {};
      (data||[]).forEach(row=>{
        reg[row.pkey] = {
          url: row.url, updated_at: row.updated_at, by: row.updated_by || '',
          mediaType: row.media_type || 'image', path: row.path || ''
        };
      });
      photoRegistry = reg;
    }catch(err){
      console.warn('[loadPhotoRegistry] failed:', err && err.message);
    }
  }

  async function loadData(){
    try{
      /* allSettled: als één JSON-bestand faalt, blijven de andere secties én
         cloud-only lijnen gewoon werken. We tonen alleen een fout als er
         helemaal niets geladen kon worden. */
      const keys = Object.keys(FILES);
      const results = await Promise.allSettled(
        keys.map(async(key)=>{
          const res = await fetch(FILES[key], {cache:'no-store'});
          if(!res.ok) throw new Error('Failed: '+FILES[key]);
          return [key, await res.json()];
        })
      );
      const data = {};
      const failed = [];
      results.forEach((r, i)=>{
        if(r.status === 'fulfilled'){ data[r.value[0]] = r.value[1]; }
        else { failed.push(keys[i]); }
      });
      state.data = data;
      if(failed.length === keys.length){
        /* Niets geladen — pas dan een echte fout tonen. */
        state.error = 'Kon geen data laden.';
      } else {
        state.error = null;
        if(failed.length) console.warn('[loadData] deels mislukt:', failed.join(', '));
      }
    } catch(err){
      state.error = err.message||'Failed to load data.';
    } finally{
      state.loading = false;
      render();
      pullFromCloud(true).then(()=> render());
    }
  }

  function setState(patch){ Object.assign(state,patch); render(); }

  function getRobertPackValuesForFormat(format,col){
    var rp = state.data && state.data.robertpack;
    var byFormat = rp && rp.values && rp.values[format] ? rp.values[format] : {};
    return (byFormat[col]) || {};
  }

  /* FIX: opgeslagen waarden (uit Check Mode / cloud) worden nu óók
     toegepast op de "Nieuw"-kolom in de gewone weergave, zodat
     operators altijd de geldende waarde zien — niet de verouderde
     JSON-waarde. */
  function applySavedValues(rows){
    /* Ombouwen: Huidig (r[1]) toont de officiële waarde van het FROM-product,
       Nieuw (r[2]) die van het TO-product — beide met JSON als fallback.
       Zo is Huidig niet langer een verouderde JSON-waarde wanneer er voor het
       FROM-product een officiële wijziging is opgeslagen. */
    if(!state.section) return rows;

    const store = getStore();
    const line = getLineForSection(state.section);

    const fromSk = (state.fromBiscuit && state.fromFormat)
      ? buildStoreKeyFor(state.section, state.fromBiscuit, state.fromFormat, line)
      : null;

    const toSk = (state.toBiscuit && state.toFormat)
      ? buildStoreKeyFor(state.section, state.toBiscuit, state.toFormat, line)
      : null;

    return rows.map(r => {
      const officialFrom = fromSk ? getOfficialValue(store, fromSk, r[0], r[1]) : r[1];
      const officialTo   = toSk   ? getOfficialValue(store, toSk,   r[0], r[2]) : r[2];
      return [r[0], officialFrom, officialTo];
    });
  }

  /* Voor lijngroepen zonder JSON-databestand: bouw de rijen puur uit
     officieel opgeslagen waarden (FROM- en TO-sleutel). Geen data → geen
     rijen, tot een admin waarden invult via Check & Verify. */
  /* Parameternamen uit het sjabloon van de huidige groep+sectie (indien aanwezig). */
  function templateParamsFor(section){
    const cfg = groupConfig();
    const tpl = cfg.paramTemplates && cfg.paramTemplates[section];
    return Array.isArray(tpl) ? tpl : [];
  }

  function buildFlowRowsFromSaved(){
    if(!state.section) return [];
    const store = getStore();
    const line = getLineForSection(state.section);
    const fromSk = (state.fromBiscuit && state.fromFormat)
      ? buildStoreKeyFor(state.section, state.fromBiscuit, state.fromFormat, line) : null;
    const toSk = (state.toBiscuit && state.toFormat)
      ? buildStoreKeyFor(state.section, state.toBiscuit, state.toFormat, line) : null;
    const fromObj = (fromSk && store.currentValues && store.currentValues[fromSk]) || {};
    const toObj   = (toSk && store.currentValues && store.currentValues[toSk]) || {};
    /* Sleutels = sjabloon-namen + al opgeslagen waarden. Zo verschijnen de
       rijen ook als er nog niets is ingevuld (admin vult via Check). */
    const keys = Array.from(new Set([
      ...templateParamsFor(state.section),
      ...Object.keys(fromObj), ...Object.keys(toObj)
    ]));
    return keys.map(k => [k, fromObj[k] != null ? fromObj[k] : '—', toObj[k] != null ? toObj[k] : '—']);
  }

  function getRows(){
    if(!state.data) return [];
    /* De JSON-databestanden horen uitsluitend bij de datagroep (choco-9-10).
       Andere lijngroepen (bv. 7/8) tonen GEEN JSON-basiswaarden; alleen
       officieel opgeslagen waarden (via Check & Verify) verschijnen daar.
       Zo lekt data van 9/10 nooit naar een andere lijn. */
    if(!lineGroupHasData(state.selectedLineGroup)){
      return applySavedValues(buildFlowRowsFromSaved());
    }
    const fromKey = resolveDataFormat(state.fromBiscuit, state.fromFormat);
    const toKey   = resolveDataFormat(state.toBiscuit,   state.toFormat);
    if(state.section==='cavanna'){
      const src = state.cavannaLine==='10' ? state.data.cavanna10 : state.data.cavanna9;
      return applySavedValues(buildFlowRows((src && src.values && src.values[fromKey])||{}, (src && src.values && src.values[toKey])||{}));
    }
    if(state.section==='robertpack')
      return applySavedValues(buildFlowRows(
        getRobertPackValuesForFormat(fromKey, state.robertpackLine),
        getRobertPackValuesForFormat(toKey,   state.robertpackLine)
      ));
    if(state.section==='dozen')
      return applySavedValues(buildFlowRows((state.data.dozen && state.data.dozen.values && state.data.dozen.values[fromKey] || {}), (state.data.dozen && state.data.dozen.values && state.data.dozen.values[toKey] || {})));
    if(state.section==='dekselaar')
      return applySavedValues(buildFlowRows((state.data.dekselaar && state.data.dekselaar.values && state.data.dekselaar.values[fromKey] || {}), (state.data.dekselaar && state.data.dekselaar.values && state.data.dekselaar.values[toKey] || {})));
    return [];
  }

  /* Check Mode respecteert nu ook het Alles/Wijzigingen-filter.
     In Status-modus zijn het enkele-waarde-rijen (geen Van→Naar, geen
     wijzigingen-filter want er is geen "oude" waarde om mee te vergelijken). */
  function getCheckRows(){
    if(state.appMode==='status'){
      const rows = getStatusRows();
      if(checkState.statusParam){
        const only = rows.filter(r => r[0] === checkState.statusParam);
        if(only.length) return only;
      }
      return rows;
    }
    return filterRows(getRows(), checkState.onlyChanges);
  }

  /* STATUS-MODUS: één waarde per parameter (de geldende waarde) voor
     het gekozen product+formaat+sectie — zonder Van→Naar.
     Rijvorm [param, '', huidigeWaarde] zodat dezelfde renderers/check
     werken; kolom 2 (oud) blijft leeg. */
  function getStatusBaseValues(){
    if(!state.data) return {};
    /* JSON-basiswaarden bestaan alleen voor de datagroep (choco-9-10).
       Andere groepen hebben geen basis; alleen opgeslagen waarden tellen. */
    if(!lineGroupHasData(state.selectedLineGroup)) return {};
    const key = resolveDataFormat(state.toBiscuit, state.toFormat);
    if(state.section==='cavanna'){
      const src = state.cavannaLine==='10' ? state.data.cavanna10 : state.data.cavanna9;
      return (src && src.values && src.values[key]) || {};
    }
    if(state.section==='robertpack')
      return getRobertPackValuesForFormat(key, state.robertpackLine);
    if(state.section==='dozen')
      return (state.data.dozen && state.data.dozen.values && state.data.dozen.values[key]) || {};
    if(state.section==='dekselaar')
      return (state.data.dekselaar && state.data.dekselaar.values && state.data.dekselaar.values[key]) || {};
    return {};
  }

  function getStatusRows(){
    const base = getStatusBaseValues();
    const store = getStore();
    const sk = buildStoreKey();
    const saved = (store.currentValues && store.currentValues[sk]) || {};
    /* Sleutels = JSON-basis (indien aanwezig) + sjabloon-namen (groepen zonder
       JSON) + officieel opgeslagen waarden. */
    const tpl = lineGroupHasData(state.selectedLineGroup) ? [] : templateParamsFor(state.section);
    const keys = Array.from(new Set([...Object.keys(base), ...tpl, ...Object.keys(saved)]));
    return keys.map(k => {
      const val = getOfficialValue(store, sk, k, base[k] != null ? base[k] : '—');
      return [k, '', val];
    });
  }

  function getExpectedValue(paramKey, originalExpected){
    const store = getStore();
    const sk = buildStoreKey();
    return getOfficialValue(store, sk, paramKey, originalExpected);
  }

  /* ── FOTO OVERLAY ── */
  let photoOverlayParam = null;

  function openPhoto(param){
    photoOverlayParam = param;
    renderPhotoOverlay();
  }
  function closePhoto(){
    photoOverlayParam = null;
    const el = document.getElementById('photo-overlay');
    if(el) el.remove();
  }

  function renderPhotoOverlay(){
    const existing = document.getElementById('photo-overlay');
    if(existing) existing.remove();
    if(!photoOverlayParam) return;

    const param = photoOverlayParam;
    const photo = getPhoto(param);
    const admin = isAdmin();

    let inner;
    if(photo && photo.url){
      const isVideo = photo.mediaType === 'video';
      const media = isVideo
        ? `<video class="photo-img" src="${escapeHtml(photo.url)}" controls playsinline preload="metadata"></video>`
        : `<img class="photo-img" src="${escapeHtml(photo.url)}" alt="${escapeHtml(param)}">`;
      inner = `
        ${media}
        <div class="photo-meta">${isVideo?'🎬':'📷'} ${photo.updated_at?escapeHtml(photo.updated_at):''}${photo.by?(' · '+escapeHtml(photo.by)):''}</div>
        ${admin ? `<div class="photo-actions">
          <button class="btn-ghost" data-action="photo-upload-img" data-param="${escapeHtml(param)}">📷 ${t('photo_replace')}</button>
          <button class="btn-ghost" data-action="photo-upload-vid" data-param="${escapeHtml(param)}">🎬 ${t('photo_replace_vid')}</button>
          <button class="btn-ghost photo-del" data-action="photo-delete" data-param="${escapeHtml(param)}">${t('photo_delete')}</button>
        </div>` : ''}`;
    } else {
      inner = admin
        ? `<div class="photo-empty">${t('photo_none')}</div>
           <div class="photo-actions">
             <button class="btn-primary" data-action="photo-upload-img" data-param="${escapeHtml(param)}">${t('photo_add')}</button>
             <button class="btn-ghost" data-action="photo-upload-vid" data-param="${escapeHtml(param)}">${t('photo_add_vid')}</button>
           </div>`
        : `<div class="photo-empty">${t('photo_none_operator')}</div>`;
    }

    const div = document.createElement('div');
    div.className = 'photo-overlay';
    div.id = 'photo-overlay';
    div.innerHTML = `
      <div class="photo-box">
        <div class="photo-header">
          <span class="photo-title">${(photo && photo.mediaType==='video')?'🎬':'📷'} ${escapeHtml(param)}</span>
          <button class="photo-close" data-action="photo-close" aria-label="${t('close')}">✕</button>
        </div>
        <div class="photo-body" id="photo-body">${inner}</div>
        <input type="file" id="photo-file-input" accept="image/*" capture="environment" style="display:none">
        <input type="file" id="video-file-input" accept="video/*" capture="environment" style="display:none">
      </div>`;
    document.body.appendChild(div);

    div.addEventListener('click', e=>{ if(e.target===div) closePhoto(); });
    div.querySelectorAll('[data-action]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const a = el.dataset.action, p = el.dataset.param;
        if(a==='photo-close') closePhoto();
        if(a==='photo-upload-img') triggerPick('photo-file-input');
        if(a==='photo-upload-vid') triggerPick('video-file-input');
        if(a==='photo-delete') deletePhoto(p);
      });
    });
    const imgInput = document.getElementById('photo-file-input');
    if(imgInput){
      imgInput.addEventListener('change', e=>{
        const f = e.target.files && e.target.files[0];
        if(f) uploadMedia(photoOverlayParam, f, 'image');
        e.target.value = '';

  const MAX_VIDEO_MB = 50;
  const MAX_IMAGE_MB = 10;

  async function uploadMedia(param, file, kind){
    if(!requireAdmin(t('photo_admin_only'))) return;
    if(!sb){ showToast(t('photo_need_cloud'), 'err'); return; }

    const isVideo = kind === 'video';
    const limitMB = isVideo ? MAX_VIDEO_MB : MAX_IMAGE_MB;
    if(file.size > limitMB * 1024 * 1024){
      showToast(t('media_too_big', { n: limitMB }), 'err');
      return;
    }

    const body = document.getElementById('photo-body');
    if(body) body.innerHTML = `<div class="photo-empty">${t('photo_uploading')}</div>`;
    try{
      /* extensie uit het bestand halen; bij video val terug op mp4, bij foto jpg */
      let ext = (file.name.split('.').pop() || '').toLowerCase();
      if(!/^[a-z0-9]{2,4}$/.test(ext)) ext = isVideo ? 'mp4' : 'jpg';
      const path = photoPath(param, ext);
      const pkey = photoKey(param);

      /* oude media (mogelijk andere extensie) opruimen zodat er niet
         tegelijk een oude foto én een nieuwe video blijft staan */
      const old = photoRegistry[pkey];
      if(old && old.path && old.path !== path){
        try{ await sb.storage.from(PHOTO_BUCKET).remove([old.path]); }catch(e){}
      }

      const { error: upErr } = await sb.storage.from(PHOTO_BUCKET)
        .upload(path, file, { upsert:true, contentType: file.type || (isVideo?'video/mp4':'image/jpeg') });
      if(upErr) throw upErr;

      const { data: pub } = sb.storage.from(PHOTO_BUCKET).getPublicUrl(path);
      const url = (pub && pub.publicUrl) ? pub.publicUrl : '';

      const { error: regErr } = await sb.from('param_photos').upsert({
        pkey, section: state.section, param, url, path,
        media_type: isVideo ? 'video' : 'image',
        updated_at: nowStr(), updated_by: auth.email || ''
      }, { onConflict: 'pkey' });
      if(regErr) throw regErr;

      /* cache-buster zodat vervangen media direct ververst */
      photoRegistry[pkey] = {
        url: url + '?t=' + Date.now(), updated_at: nowStr(), by: auth.email || '',
        mediaType: isVideo ? 'video' : 'image', path
      };
      showToast(t('photo_saved'), 'ok');
      renderPhotoOverlay();
      render();
    }catch(err){
      console.warn('[uploadMedia] failed:', err && err.message);
      showToast(t('photo_fail') + ((err && err.message) || ''), 'err');
      renderPhotoOverlay();
    }
  }

  async function deletePhoto(param){
    if(!requireAdmin(t('photo_admin_only'))) return;

    try{

  /* Gedeelde opslag-logica voor Check Mode én versie-herstel:
     schrijft currentValues + audit + versie, en synct met wachtrij. */
  /* Context van de gekozen lijngroep voor audit/reports/timings */
  function lineGroupContext(){
    const g = getLineGroupMeta(state.selectedLineGroup) || { afdeling:'', label:'' };
    return { afdeling: g.afdeling || '', lineGroup: state.selectedLineGroup || '', lineLabel: g.label || '' };

  /* Placeholder-waarden mogen NOOIT als officiële waarde worden opgeslagen.
     Dit zijn UI-symbolen (mismatch-kruis, streepje, vinkje) of lege tekst —
     geen echte machine-instelling. Beschermt de data-integriteit. */
  function isPlaceholderValue(v){
    const s = String(v == null ? '' : v).trim();
    if(s === '') return true;
    /* losse symbolen of pijl/streepjes zonder inhoud */
    if(/^[✕✔✓×—–\-→·]+$/.test(s)) return true;
    return false;
  }

  function persistValueChange(paramKey, oldVal, newVal, note){
    if(!requireAdmin()) return false;
    if(isPlaceholderValue(newVal)){
      showToast(t('save_placeholder_blocked'), 'warn');
      return false;
    }
    const store = getStore();
    const sk = buildStoreKey();

    if(!store.currentValues[sk]) store.currentValues[sk] = {};
    store.currentValues[sk][paramKey] = String(newVal);

    const lgCtx = lineGroupContext();
    const auditEntry = {
      ts: nowStr(),
      afdeling: lgCtx.afdeling, lineGroup: lgCtx.lineGroup, lineLabel: lgCtx.lineLabel,
      section: getSectionTitle(state.section),
      line: state.section==='cavanna'?state.cavannaLine:state.section==='robertpack'?state.robertpackLine:'',
      toBiscuit: biscuitLabel(state.toBiscuit), toFormat: state.toFormat,
      param: paramKey,
      old: normalizeDisplayValue(String(oldVal)),
      new_: normalizeDisplayValue(String(newVal)),
      note: note || '', action: 'saved',
      changedBy: operatorDisplayName() || ''
    };
    store.auditLog.unshift(auditEntry);

    if(!store.versions[sk]) store.versions[sk] = [];
    const last = store.versions[sk][0];
    const changeEntry = {
      param: paramKey,
      old: normalizeDisplayValue(String(oldVal)),
      new_: normalizeDisplayValue(String(newVal)),
      note: note || ''
    };
    let versionToPush;
    if(!last || last.locked){
      versionToPush = { v:(store.versions[sk].length+1), ts:nowStr(), changes:[changeEntry], locked:false, vid: (Date.now().toString(36)+Math.random().toString(36).slice(2,8)) };
      store.versions[sk].unshift(versionToPush);
    } else {
      const idx = last.changes.findIndex(c=>c.param===paramKey);
      if(idx>=0) last.changes[idx]=changeEntry; else last.changes.push(changeEntry);
      last.ts = nowStr();
      versionToPush = last;
    }
    saveStore(store);

    setSyncStatus('syncing');
    Promise.all([
      pushSavedValue(sk, paramKey, newVal),
      pushAuditEntry(auditEntry),
      pushVersion(sk, versionToPush)
    ]).then(results => {
      if(results.every(r=>r)) setSyncStatus('synced');
      else setSyncStatus(loadQueue().length ? 'queued' : (navigator.onLine ? 'error' : 'offline'));
    }).catch(()=>{
      setSyncStatus(loadQueue().length ? 'queued' : (navigator.onLine ? 'error' : 'offline'));
    });
    return true;
  }

  async function confirmSave(){
    const p = checkState.pendingSave;
    if(!p) return;

    const noteEl = document.getElementById('confirm-note');
    const note = noteEl ? noteEl.value.trim() : '';

    /* ── Operator-pad ──
       Een operator wijzigt NOOIT de officiële waarde. Als de gecontroleerde
       waarde afwijkt, sturen we die als melding naar de admin, precies zoals
       de 'Waarde melden'-knop. De admin beoordeelt en past eventueel toe. */
    if(!isAdmin()){
      /* Wacht op de melding. Pas als die echt verstuurd is, tonen we
         'reported' — anders zou de operator denken dat het gelukt is. */
      const ok = await submitCheckAsReport(p.paramKey, p.expectedVal, p.actualVal, note);
      if(!ok){
        showToast(t('report_fail') + t('offline'), 'err');
        return;   /* overlay blijft open, operator kan opnieuw proberen */
      }
      checkState.results[p.paramKey] = { status:'reported', expected:p.expectedVal, actual:p.actualVal };
      removeConfirmOverlay();
      const finishAfterOp = checkState._finishAfterSave;
      checkState._finishAfterSave = false;
      if(finishAfterOp){ checkState.showSummary = true; render(); }
      else { advanceCheck(); }
      return;
    }

    /* ── Admin-pad ── officiële waarde daadwerkelijk opslaan */
    if(!requireAdmin(t('login_admin_save'))) return;
    const saved = persistValueChange(p.paramKey, p.expectedVal, p.actualVal, note);
    if(!saved){
      return;
    }
    /* Bewaar óók de oorspronkelijke verwachte waarde, zodat de samenvatting
       "20 → 25" toont en niet "25 → 25" (de officiële waarde is nu al 25). */
    checkState.results[p.paramKey] = { status:'saved', expected:p.expectedVal, actual:p.actualVal };
    removeConfirmOverlay();

    const finishAfter = checkState._finishAfterSave;
    checkState._finishAfterSave = false;

    if(finishAfter){ checkState.showSummary = true; render(); }
    else { advanceCheck(); }
  }

  /* Stuurt een afwijkende Check-waarde als melding naar de admin (operator-pad).
     Hergebruikt dezelfde value_reports-structuur als 'Waarde melden'. */
  async function submitCheckAsReport(paramKey, expectedVal, actualVal, note){
    if(!sb){ showToast(t('report_need_cloud'), 'warn'); return false; }
    const lgCtx = lineGroupContext();
    const entry = {
      afdeling: lgCtx.afdeling, line_group: lgCtx.lineGroup, line_label: lgCtx.lineLabel,
      section: getSectionTitle(state.section),
      line: state.section==='cavanna'?state.cavannaLine:state.section==='robertpack'?state.robertpackLine:'',
      product: biscuitLabel(state.toBiscuit), format: state.toFormat || '',
      param: paramKey,
      current_value: String(expectedVal == null ? '' : expectedVal),
      /* Placeholder (✕/—) telt niet als voorgestelde waarde: laat leeg,
         de opmerking draagt dan de betekenis van de afwijking. */
      suggested_value: isPlaceholderValue(actualVal) ? '' : String(actualVal == null ? '' : actualVal),
      comment: note || t('report_from_check'),
      created_at: new Date().toISOString(),
      created_by: operatorDisplayName() || ('operator-' + (navigator.language||'')),
      ploeg: getActivePloeg().name
    };
    try{
      const { error } = await sb.from('value_reports').insert(entry);
      if(error) throw error;
      showToast(t('report_sent'), 'ok');
      return true;
    }catch(err){
      console.warn('[submitCheckAsReport] failed:', err && err.message);
      showToast(t('report_fail') + ((err && err.message) || ''), 'err');
      return false;
    }
  }

  /* Laatste wijzigingsdatum van een parameter (uit audit log) voor de
     huidige combinatie — geeft '' als de waarde nooit is aangepast.
     Bouwt vertrouwen: de operator ziet of een waarde vers is of oud. */
  /* ── SLIMME PARAMETER-ZOEKFUNCTIE ──
     Zoekt op parameternummer (met prioriteit), parametertekst en waarden.
     Puur lokaal; geen database. Werkt ook voor operators. */
  function extractParamNumber(paramKey){
    const m = String(paramKey||'').trim().match(/^(\d+[A-Za-z]?)\b/);
    return m ? m[1].toLowerCase() : '';
  }
  function normalizeSearch(str){
    return String(str||'').toLowerCase().trim().replace(/\s+/g,' ')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }
  function matchesParamSearch(row, tokens){
    const num  = extractParamNumber(row[0]);
    const hay  = normalizeSearch(row[0]) + ' ' + normalizeSearch(row[1]) + ' ' + normalizeSearch(row[2]);
    return tokens.every(tok => {
      /* Een puur numeriek token (evt. + letter, bv. '12a') moet exact het
         parameternummer zijn — anders zou '3' ook '30' en '13' matchen. */
      if(/^\d+[a-z]?$/.test(tok)) return tok === num;
      return hay.indexOf(tok) !== -1;
    });
  }
  function applyParamSearch(rows, query){
    const q = normalizeSearch(query);
    if(!q) return rows;
    const tokens = q.split(' ').filter(Boolean);
    /* Nummer-prioriteit: is de hele query een nummer (evt. + letter)?
       Toon dan eerst alléén exacte nummer-matches; alleen als die er niet
       zijn, val terug op gewone bevat-zoektocht. */
    if(/^\d+[a-z]?$/.test(q)){
      const exact = rows.filter(r => extractParamNumber(r[0]) === q);
      if(exact.length) return exact;
    }
    return rows.filter(r => matchesParamSearch(r, tokens));
  }

  /* Bepaalt of een FROM→TO rij een échte verandering is (voor het pijltje +
     de teller). Placeholder-waarden (—, leeg) tellen niet als verandering. */
  function isChangedRow(fromVal, toVal){
    const norm = v => String(v==null?'':v).trim().toLowerCase().replace(/\s+/g,' ');
    const a = norm(fromVal), b = norm(toVal);
    const empty = s => s==='' || s==='—' || s==='-' || s==='·';
    if(empty(a) || empty(b)) return false;
    return a !== b;
  }

    return `

        ${changedCount ? `<div class="changes-count">${t('changes_count').replace('{n}', '<b class="changes-num">'+changedCount+'</b>')}</div>` : ''}
        <div class="value-table-header">
          <span class="value-table-col">${t('col_param')}</span>
          <span class="value-table-col">${t('col_current')}</span>
          <span class="value-table-col center"></span>
          <span class="value-table-col">${t('col_new')}</span>
        </div>
        <div class="value-rows">
          ${rows.map(r=>{
            const changed = isChangedRow(r[1], r[2]);
            return `
            <div class="value-row">
              <span class="value-key">${renderParamKey(r[0])}</span>
              <span class="value-cell">${renderRichValue(r[1])}</span>
              <span class="value-sep${changed ? ' changed' : ''}">${changed ? '⟶' : '→'}</span>
              <span class="value-cell is-new">${renderRichValue(r[2])}</span>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  function renderStepPlayer(rows){
    const total = rows.length;
    const cur   = rows[state.stepIndex];
    if(!total||!cur) return `<div class="emptyNote">${t('no_data')}</div>`;
    const pct    = ((state.stepIndex+1)/total*100).toFixed(1);
    const isLast = state.stepIndex >= total-1;
    const miniRows = rows.map((r,i)=>`
      <button class="mini-row${i===state.stepIndex?' active':''}" data-action="jump-step" data-value="${i}">
        <span class="mini-num">${String(i+1).padStart(2,'0')}</span>
        <span class="mini-key">${escapeHtml(r[0])}</span>
        ${i<state.stepIndex?'<span class="mini-check">✓</span>':''}
      </button>`).join('');
    return `
      <div class="player-wrap">
        <div class="player-main">
          <div class="player-top-bar">
            <span class="player-counter">${state.stepIndex+1} / ${total}</span>
            <div class="player-progress-track"><div class="player-progress-fill" style="width:${pct}%"></div></div>
            <span class="player-counter">${pct}%</span>
          </div>
          <div class="player-body">
            <div class="player-key">${t('param_caps')}</div>
            <div class="player-label">${renderPlayerLabel(cur[0])}</div>
            <div class="player-values">
              <div class="player-val-block">
                <div class="player-val-label">${t('col_current')}</div>
                <div class="player-val-box">${renderRichValue(cur[1])}</div>
              </div>
              <div class="player-arrow-sep">→</div>
              <div class="player-val-block">
                <div class="player-val-label">${t('col_new')}</div>
                <div class="player-val-box new-val">${renderRichValue(cur[2])}</div>
              </div>
            </div>
          </div>
          <div class="player-controls">
            <button class="btn-ghost" data-action="prev-step" ${state.stepIndex===0?'disabled':''}>${t('prev')}</button>
            <button class="btn-primary" data-action="next-step">${isLast ? t('finish') : t('next')}</button>
          </div>
        </div>
        <div class="player-sidebar">
          <div class="player-sidebar-header"><div class="player-sidebar-title">${t('steps_overview')}</div></div>
          <div class="mini-list">${miniRows}</div>
        </div>
      </div>`;
  }

  function detectPresetType(expectedVal) {
    var norm = normalizeCompareValue(String(expectedVal));
    if(norm === '-' || norm === '—') return { type:'dash', options:null };
    if(norm === 'ja' || norm === 'nee') return { type:'yn', options:['JA','NEE'] };
    if(norm === 'open' || norm === 'dicht') return { type:'preset', options:['OPEN','DICHT'] };
    if(norm === 'a' || norm === 'b') return { type:'preset', options:['A','B'] };
    if(/^x\d+$/.test(norm)) return { type:'preset', options:['x1','x2','x3','x4','x5','x6','x7','x8'] };
    if(norm === 'uit' || norm === 'in') return { type:'preset', options:['uit','in'] };
    if(/gat$/.test(norm)) return { type:'preset', options:['1ste gat','4de gat'] };
    if(/^nr\.\d+\s*-\s*\d+x$/.test(norm)) return { type:'racetrack', options:null };
    if(norm.indexOf('->') >= 0 || norm.indexOf('<-') >= 0 || /^[x\d\-]+/.test(norm)) {
      if(norm.length > 8) return { type:'sequence', options:null };
    }
    if(norm.length > 20 && !/^[-+]?[\d,./]+$/.test(norm)) return { type:'freetext', options:null };
    return null;
  }

  function buildActualArea(colorMode, boxClass, liveStatus, curKey, actualVal, expectedVal){
    if(colorMode){
      var matchSt    = liveStatus==='match'    ? 'background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.5);' : '';
      var mismatchSt = liveStatus==='mismatch' ? 'background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.5);' : '';
      return '<div class="check-val-box color-confirm ' + boxClass + '" style="flex-direction:column;gap:12px;padding:20px;">'
        + '<div style="font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px">' + t('machine_ok_q') + '</div>'
        + '<div style="display:flex;gap:10px;width:100%">'
        + '<button class="check-color-btn match" data-action="check-color-confirm" data-key="' + escapeHtml(curKey) + '" data-value="match" style="' + matchSt + '">' + t('yes_ok') + '</button>'
        + '<button class="check-color-btn miss"  data-action="check-color-confirm" data-key="' + escapeHtml(curKey) + '" data-value="mismatch" style="' + mismatchSt + '">' + t('no_dev') + '</button>'
        + '</div></div>';
    }

    var preset = detectPresetType(expectedVal);

    /* Als de gebruiker op 'Wijzig' heeft getikt voor deze parameter, negeren
       we de preset-knoppen en tonen we een vrij invoerveld — zodat elke
       waarde (ook racetrack/sequence) handmatig aangepast kan worden. */
    if(checkState.editKeys && checkState.editKeys[curKey]) preset = null;

    if(preset && preset.type === 'dash') {
      var matchSt0 = liveStatus==='match' ? 'selected-match' : '';
      return '<div class="check-val-lbl" style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">' + t('na') + '</div>'
        + '<div class="seq-confirm">'
        + '<button class="preset-btn ' + matchSt0 + '" data-action="check-preset" data-key="' + escapeHtml(curKey) + '" data-value="-" style="font-size:13px;padding:12px 10px;">' + t('na_confirm') + '</button>'
        + '</div>';
    }

    if(preset && preset.type !== 'sequence' && preset.type !== 'racetrack' && preset.type !== 'freetext' && preset.options) {
      var normExp  = normalizeCompareValue(String(expectedVal));
      var btns = preset.options.map(function(opt) {
        var normOpt = normalizeCompareValue(opt);
        var isExp = normOpt === normExp;
        var isSel = liveStatus === 'match' && normalizeCompareValue(actualVal || String(expectedVal)) === normOpt;
        var isMiss = liveStatus === 'mismatch' && normalizeCompareValue(actualVal) === normOpt;
        var cls = isSel ? 'selected-match' : (isMiss ? 'selected-miss' : '');
        return '<button class="preset-btn ' + cls + '" data-action="check-preset" data-key="' + escapeHtml(curKey) + '" data-value="' + escapeHtml(opt) + '">'
          + escapeHtml(opt)
          + (isExp ? '<span style="display:block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-top:3px;">verwacht</span>' : '')
          + '</button>';
      }).join('');
      return '<div class="check-val-lbl" style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">' + t('select_value') + '</div>'
        + '<div class="preset-grid">' + btns + '</div>';
    }

    if(preset && (preset.type === 'racetrack' || preset.type === 'freetext')) {
      var matchSt2 = liveStatus==='match'    ? 'selected-match' : '';
      var missSt2  = liveStatus==='mismatch' ? 'selected-miss'  : '';
      return '<div class="check-val-lbl" style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">' + t('check_on_machine') + '</div>'
        + '<div class="seq-display">' + escapeHtml(normalizeDisplayValue(String(expectedVal))) + '</div>'
        + '<div class="seq-confirm">'
        + '<button class="preset-btn ' + matchSt2 + '" data-action="check-preset" data-key="' + escapeHtml(curKey) + '" data-value="' + escapeHtml(String(expectedVal)) + '" style="font-size:13px;padding:12px 10px;">' + t('value_ok') + '</button>'
        + '<button class="preset-btn ' + missSt2  + '" data-action="check-preset-miss" data-key="' + escapeHtml(curKey) + '" style="font-size:13px;padding:12px 10px;">' + t('deviation') + '</button>'
        + '</div>'
        + '<button class="preset-edit-btn" data-action="check-edit" data-key="' + escapeHtml(curKey) + '">✏️ ' + t('edit_value') + '</button>';
    }

    if(preset && preset.type === 'sequence') {
      var matchSt3 = liveStatus==='match'    ? 'selected-match' : '';
      var missSt3  = liveStatus==='mismatch' ? 'selected-miss'  : '';
      var dispVal  = normalizeDisplayValue(String(expectedVal));
      return '<div class="check-val-lbl" style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">' + t('check_order') + '</div>'
        + '<div class="seq-display" style="font-size:15px;letter-spacing:.12em;">' + escapeHtml(dispVal) + '</div>'
        + '<div class="seq-confirm">'
        + '<button class="preset-btn ' + matchSt3 + '" data-action="check-preset" data-key="' + escapeHtml(curKey) + '" data-value="' + escapeHtml(String(expectedVal)) + '" style="font-size:13px;padding:12px 10px;">' + t('order_ok') + '</button>'
        + '<button class="preset-btn ' + missSt3  + '" data-action="check-preset-miss" data-key="' + escapeHtml(curKey) + '" style="font-size:13px;padding:12px 10px;">' + t('deviation') + '</button>'
        + '</div>'
        + '<button class="preset-edit-btn" data-action="check-edit" data-key="' + escapeHtml(curKey) + '">✏️ ' + t('edit_value') + '</button>';
    }

    /* Vrij invoerveld. Waarden kunnen tekst bevatten (bv. "1 Thee / 5 Kokos"
       of "35 (98 food aid)"), dus het toetsenbord mag NOOIT op alleen-cijfers
       vergrendeld worden. We gebruiken altijd het volledige tekst-toetsenbord;
       een numerieke hint zou letters blokkeren op mobiel. */
    return '<div class="check-val-box ' + boxClass + '">'
      + '<input class="check-input" id="check-actual-input"'
      + ' placeholder="Voer waarde in\u2026"'
      + ' value="' + escapeHtml(actualVal) + '"'
      + ' type="text" inputmode="text" autocomplete="off"'
      + ' data-param="' + escapeHtml(curKey) + '"'
      + ' data-expected="' + escapeHtml(String(expectedVal)) + '">'
      + '</div>';
  }

  function renderCheckMode(checkRows){
    const total = checkRows.length;
    const isStatus = state.appMode==='status';

    /* Alles/Wijzigingen-filter — alleen in Ombouw-modus.
       In Status-modus is er geen "oude" waarde, dus geen filter. */
    const checkToggle = isStatus
      ? `<div class="mode-bar" style="margin-bottom:14px">
           <span style="font-family:var(--mono);font-size:11px;color:#06b6d4">≡ Status-check${checkState.statusParam?' · '+escapeHtml(checkState.statusParam):''}</span>
           <span style="font-family:var(--mono);font-size:11px;color:var(--text-3)">${total} ${total!==1?t('params_count'):t('param_count')}</span>
         </div>`
      : `<div class="mode-bar" style="margin-bottom:14px">
        <div class="mode-pills">
          <button class="mode-btn${!checkState.onlyChanges?' active':''}" data-action="check-show-mode" data-value="all">${t('all')}</button>
          <button class="mode-btn${checkState.onlyChanges?' active':''}" data-action="check-show-mode" data-value="changes">${t('changes')}</button>
        </div>
        <span style="font-family:var(--mono);font-size:11px;color:var(--text-3)">${total} ${total!==1?t('params_count'):t('param_count')}</span>
      </div>`;

    if(!total){
      const secData  = state.section==='cavanna' ? (state.data && state.data.cavanna9) :
                       state.section==='robertpack' ? (state.data && state.data.robertpack) :
                       state.section==='dozen' ? (state.data && state.data.dozen) :
                       (state.data && state.data.dekselaar);
      const fmtKeys  = (secData && secData.values) ? Object.keys(secData.values) : [];
      return checkToggle + `<div class="emptyNote">
        ${isStatus ? t('no_params') : (checkState.onlyChanges ? t('no_changes_switch') : t('no_params'))}<br>
        <span style="font-size:10px;margin-top:8px;display:block">
          Sectie: ${state.section} · Format: ${state.toFormat}<br>
          ${t('param_count_avail')} ${fmtKeys.join(', ')||'—'}
        </span>
      </div>`;
    }

    if(checkState.showSummary) return renderCheckSummary(checkRows);

    if(checkState.stepIndex >= total) checkState.stepIndex = 0;

    const done  = checkRows.filter(r=>(checkState.results[r[0]] && checkState.results[r[0]].status) && (checkState.results[r[0]] && checkState.results[r[0]].status)!=='pending').length;
    const pct   = Math.round(done/total*100);

    const statusGlyph = s => s==='match'?'✓':s==='mismatch'?'✕':s==='saved'?'↑':'·';

    const miniList = checkRows.map(([key],i)=>{
      const s = (checkState.results[key] && checkState.results[key].status) || 'pending';
      return `
        <button class="check-mini-row${i===checkState.stepIndex?' active':''}" data-action="check-jump" data-value="${i}">
          <span class="check-mini-num">${String(i+1).padStart(2,'0')}</span>
          <span class="check-mini-key">${escapeHtml(key)}</span>
          <span class="check-mini-status ${s}">${statusGlyph(s)}</span>
        </button>`;
    }).join('');

    const cur = checkRows[checkState.stepIndex];
    if(!cur) return checkToggle + `<div class="emptyNote">${t('no_params')}</div>`;
    const [curKey, , curExpRaw] = cur;

    const curResult  = checkState.results[curKey] || {};
    const expectedVal= getExpectedValue(curKey, curExpRaw);
    const actualVal  = curResult.actual || '';
    const isLast     = checkState.stepIndex >= total-1;

    const liveStatus = curResult.status || (
      actualVal.trim()
        ? (normalizeCompareValue(String(expectedVal))===normalizeCompareValue(actualVal) ? 'match' : 'mismatch')
        : 'pending'
    );

    const isColorValue = v => {
      const norm  = normalizeDisplayValue(String(v));
      const parts = norm.split('/').map(p=>p.trim()).filter(Boolean);
      return parts.length > 0 && parts.every(isColorToken);
    };
    const colorMode = isColorValue(expectedVal);

    const boxClass    = liveStatus==='match' ? 'status-match' : liveStatus==='mismatch' ? 'status-mismatch' : liveStatus==='saved' ? 'status-saved' : 'actual';
    const badgeLabel  = { match:t('st_match'), mismatch:t('st_mismatch'), saved:t('st_saved'), pending:t('st_wait') };
    const badgeCls    = { match:'match', mismatch:'mismatch', saved:'saved', pending:'pending' };

    const actualArea = buildActualArea(colorMode, boxClass, liveStatus, curKey, actualVal, expectedVal);

    const paramCard = `
      <div class="check-player">
        <div class="check-player-top">
          <span class="player-counter">${checkState.stepIndex+1} / ${total}</span>
          <div class="player-progress-track" style="flex:1;margin:0 18px">
            <div class="player-progress-fill" style="width:${pct}%"></div>
          </div>
          <span class="check-status-badge ${badgeCls[liveStatus]||'pending'}">
            <span class="check-status-dot"></span>${badgeLabel[liveStatus]||t('st_wait')}
          </span>
        </div>

        <div class="check-player-body">
          <div class="check-param-label">${t('param_caps')}</div>
          <div class="check-param-name">${renderPlayerLabel(curKey)}</div>

          ${(function(){
            var _preset = detectPresetType(expectedVal);
            var _isStacked = _preset && (_preset.type==='racetrack'||_preset.type==='freetext'||_preset.type==='sequence'||_preset.type==='dash');
            if(_isStacked) {
              return '<div class="check-values-stacked">'
                + '<div class="check-val-block"><div class="check-val-label">' + t('expected_list') + '</div>'
                + '<div class="check-val-box expected">' + renderRichValue(String(expectedVal)) + '</div></div>'
                + '<div class="check-val-block">' + actualArea + '</div>'
                + '</div>';
            }
            return '<div class="check-values-grid">'
              + '<div class="check-val-block"><div class="check-val-label">' + t('expected_list') + '</div>'
              + '<div class="check-val-box expected">' + renderRichValue(String(expectedVal)) + '</div></div>'
              + '<div class="check-arrow">→</div>'
              + '<div class="check-val-block"><div class="check-val-label">' + t('actual_machine') + '</div>'
              + actualArea + '</div>'
              + '</div>';
          })()}
        </div>

        <div class="check-player-nav">
          <button class="btn-ghost" data-action="check-prev" ${checkState.stepIndex===0?'disabled':''}>${t('prev')}</button>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="player-counter-done" style="font-family:var(--mono);font-size:11px;color:var(--text-3)">${done}/${total}</span>
            ${isLast
              ? `<button class="btn-primary" data-action="check-finish" data-param="${escapeHtml(curKey)}" data-expected="${escapeHtml(String(expectedVal))}" data-status="${liveStatus}">${t('finish')}</button>`
              : `<button class="btn-primary" data-action="check-next"  data-param="${escapeHtml(curKey)}" data-expected="${escapeHtml(String(expectedVal))}" data-status="${liveStatus}">${t('next')}</button>`
            }
          </div>
        </div>
      </div>`;

    return `
      ${checkToggle}
      <div class="check-wrap">
        <div>${paramCard}</div>
        <div class="check-sidebar">
          <div class="check-sidebar-header">
            <span class="player-sidebar-title">${t('col_param')}</span>
            <span style="font-family:var(--mono);font-size:10px;color:var(--text-3)">${pct}%</span>
          </div>
          <div class="mini-list">${miniList}</div>
        </div>
      </div>`;
  }

  function renderCheckSummary(checkRows){
    const saved      = checkRows.filter(([k])=>(checkState.results[k] && checkState.results[k].status)==='saved');
    const reported   = checkRows.filter(([k])=>(checkState.results[k] && checkState.results[k].status)==='reported');
    const mismatches = checkRows.filter(([k])=>(checkState.results[k] && checkState.results[k].status)==='mismatch');
    const matches    = checkRows.filter(([k])=>(checkState.results[k] && checkState.results[k].status)==='match');
    const pending    = checkRows.filter(([k])=>!(checkState.results[k] && checkState.results[k].status) || (checkState.results[k] && checkState.results[k].status)==='pending');

    const allChecked = [...saved, ...reported, ...mismatches, ...matches];

    const changeRows = allChecked.map(([key, , expRaw]) => {
      const r = checkState.results[key];
      const status = (r && r.status) || 'pending';
      /* #9: gebruik de bewaarde oorspronkelijke verwachte waarde als die er is,
         anders val terug op de lijst. Zo toont de samenvatting "20 → 25" en
         niet "25 → 25" nadat de officiële waarde al is bijgewerkt. */
      const expSource = (r && r.expected != null) ? r.expected : getExpectedValue(key, expRaw);
      const expectedDisp = normalizeDisplayValue(String(expSource));
      const expParts = expectedDisp.split('/').map(p=>p.trim()).filter(Boolean);
      const isColor  = expParts.length > 0 && expParts.every(isColorToken);

      /* #16: bij een afwijking/melding NIET de verwachte kleur als 'actual'
         tonen. Toon de echte ingevoerde waarde, of 'Afwijking gemeld'. */
      let actualDisplay;
      if(status === 'mismatch' || status === 'reported'){
        const rawActual = r && r.actual;
        if(rawActual && !isPlaceholderValue(rawActual)){
          actualDisplay = isColorToken(String(rawActual).trim())
            ? renderRichValue(String(rawActual))
            : escapeHtml(normalizeDisplayValue(String(rawActual)));
        } else {
          actualDisplay = `<span class="check-deviation">${escapeHtml(t('deviation_reported'))}</span>`;
        }
      } else if(isColor){
        actualDisplay = renderRichValue(expectedDisp);
      } else {
        actualDisplay = escapeHtml(normalizeDisplayValue(String(r && r.actual ? r.actual : '—')));
      }

      const statusIco = status==='match'?'✓':status==='saved'?'↑':status==='reported'?'⚠':status==='mismatch'?'✕':'·';
      const rowCls = status==='match'?'row-match':status==='saved'?'row-saved':status==='reported'?'row-reported':status==='mismatch'?'row-miss':'';
      return `
        <div class="check-changes-row ${rowCls}">
          <span class="check-changes-key">${renderParamKey(key)}</span>
          <span class="check-changes-from">${renderRichValue(expectedDisp)}</span>
          <span class="check-changes-sep">→</span>
          <span class="check-changes-to ${status}">${actualDisplay}</span>
          <span class="check-changes-status ${status}">${statusIco}</span>
        </div>`;
    }).join('');

    return `
      <div class="check-summary-screen">
        <div class="check-summary-hero">${t('check_done')}</div>
        <div class="check-summary-sub">${getSectionTitle(state.section)} · ${escapeHtml(biscuitLabel(state.toBiscuit))} ${escapeHtml(state.toFormat||'')}</div>
        <div class="check-summary-stats">
          <span class="check-stat-pill ok">  <span class="sn">${matches.length}</span> ${t('stat_match')}</span>
          <span class="check-stat-pill miss"><span class="sn">${mismatches.length}</span> ${t('stat_mismatch')}</span>
          ${saved.length ? `<span class="check-stat-pill save"><span class="sn">${saved.length}</span> ${t('stat_saved')}</span>` : ''}
          ${reported.length ? `<span class="check-stat-pill report"><span class="sn">${reported.length}</span> ${t('stat_reported')}</span>` : ''}
          ${pending.length ? `<span class="check-stat-pill skip"><span class="sn">${pending.length}</span> ${t('stat_unchecked')}</span>` : ''}
        </div>
        ${allChecked.length ? `
          <div class="check-changes-title">${t('checked_params')}</div>
          <div class="check-changes-list">${changeRows}</div>
        ` : `<div class="emptyNote" style="padding:32px;margin-bottom:24px">${t('no_params_checked')}</div>`}
        <div class="check-summary-actions">
          ${saved.length ? `<button class="btn-save-finish" data-action="check-commit">${t('save_close')}</button>` : ''}
          ${sb && auth.signedIn ? `<button class="view-action-btn afronden-btn afronden-summary" data-action="machine-afronden">${machineAfrondLabel()}</button>` : ''}
          <button class="btn-ghost" data-action="close-check">${t('close')}</button>
        </div>
      </div>`;
  }

  function renderHistory(){
    const store = getStore();
    const sk    = buildStoreKey();
    const versions = store.versions[sk] || [];
    if(!versions.length) return `<div class="empty-state">${t('no_versions')}</div>`;
    return `<div class="version-list">
      ${versions.map((v,vi)=>`
        <div class="version-card">
          <button class="version-card-header" data-action="toggle-version" data-value="${vi}">

  function renderAudit(){
    const store = getStore();
    const grp = state.selectedLineGroup || PILOT_GROUP;
    const curLine = getLineForSection(state.section);
    const logs = store.auditLog.filter(e=>
      e.section===getSectionTitle(state.section) &&
      e.toBiscuit===biscuitLabel(state.toBiscuit) &&
      e.toFormat===state.toFormat &&
      /* Machine sub-lijn (Cavanna/Robert Pack 7-8-9-10) moet ook kloppen */
      ((e.line||'') === (curLine||'')) &&
      /* Lijngroep: entries met lineGroup moeten matchen; oude entries zonder
         lineGroup verschijnen alleen in de pilotgroep (choco-9-10). */
      (e.lineGroup ? e.lineGroup===grp : grp===PILOT_GROUP)
    );
    if(!logs.length) return `<div class="empty-state">${t('no_log')}</div>`;
    const iconMap = { match:'✓', warn:'!', mismatch:'✕', saved:'↑', skipped:'—' };
    return `<div class="audit-list">
      ${logs.map(e=>`
        <div class="audit-entry">
          <div class="audit-icon ${e.action}">${iconMap[e.action]||'·'}</div>
          <div class="audit-body">
            <div class="audit-title">${escapeHtml(e.param)}</div>
            <div class="audit-meta">${escapeHtml(e.section)}${e.line?' · Lijn '+e.line:''} · ${escapeHtml(e.toBiscuit)} ${escapeHtml(e.toFormat)}${e.changedBy?' · door '+escapeHtml(e.changedBy):''}</div>
            <div class="audit-change">
              <span class="audit-old">${escapeHtml(e.old)}</span>
              <span class="audit-arr">→</span>
              <span class="audit-new">${escapeHtml(e.new_)}</span>
            </div>
            ${e.note ? `<div class="audit-note">"${escapeHtml(e.note)}"</div>` : ''}
          </div>
          <div class="audit-timestamp">${escapeHtml(e.ts)}</div>
        </div>`).join('')}
    </div>`;
  }

    const sectionLabel = !state.section ? null :
      state.section==='cavanna'    ? `Cavanna · L${state.cavannaLine}` :
      state.section==='robertpack' ? `Robert Pack · L${state.robertpackLine}` :
      state.section==='dozen'      ? 'Dozen Opzetter' : 'Dekselaar Opzetter';

    /* Check & Verify is beschikbaar voor operators én admins. De workflow-
       stappen tonen de normale voortgang; Check is een losse actie. */
    const steps = [
      { label:t('cfg_title'), done: canContinue,                        active: state.stage===1 },
      { label:t('section_pick'),   done: state.stage===2 && !!state.section, active: state.stage===2 && !checkState.active }

  function render(){
    const shell       = document.getElementById('app-shell');
    /* Poort: niet ingelogd (en cloud beschikbaar) → welkom/login-scherm.
       Offline blijft de app read-only bruikbaar zonder login. */
    if(sb && !auth.signedIn){
      shell.innerHTML = renderWelcomeScreen() + renderLoginOverlay();
      bindWelcome();
      bindActions();
      return;
    }
    if(state.selectedLineGroup) normalizeGroupLines();
    /* Check Mode is voor operators én admins (operators controleren de machine).
       Een operator die een afwijkende waarde invoert maakt een melding;
       alleen een admin wijzigt de officiële waarde (zie confirmSave). */
    const canContinue = state.fromBiscuit&&state.fromFormat&&state.toBiscuit&&state.toFormat;
    const rows        = getRows();
    const filteredRows = filterRows(rows, state.onlyChanges);
    const visibleRows  = applyParamSearch(filteredRows, state.searchQuery);

    let bcParts = [];
    if(state.selectedLineGroup){
      const _lg = getLineGroupMeta(state.selectedLineGroup);
      if(_lg) bcParts.push(`<button class="bc-item bc-linegroup" data-action="change-line-group" title="${t('change_line')}">${escapeHtml(_lg.afdeling)} · ${escapeHtml(_lg.label)}</button><span class="bc-sep"> › </span>`);
    }
    if(state.stage>=1){
      const modeLabel = state.appMode==='status' ? t('mode_status') : state.appMode==='ombouw' ? t('mode_ombouw') : t('module_ombouwen');
      bcParts.push(`<span class="bc-item${state.stage===1&&!checkState.active?' active':''}">${modeLabel}</span>`);
    }
    if(state.stage>=2) bcParts.push(`<span class="bc-sep"> › </span><span class="bc-item${state.stage===2&&!checkState.active&&!state.section?' active':''}">${t('section_pick')}</span>`);
    if(state.stage===2&&state.section) bcParts.push(`<span class="bc-sep"> › </span><span class="bc-item${!checkState.active?' active':''}">${getSectionTitle(state.section)}</span>`);
    if(checkState.active) bcParts.push(`<span class="bc-sep"> › </span><span class="bc-item active" style="color:#06b6d4">${t('module_check')}</span>`);
    const bc = bcParts.join('');

    let mainContent = '';

    if(state.loading){
      mainContent = `<div class="loading-screen"><div class="loading-bar-wrap"><div class="loading-bar-fill"></div></div><div class="loading-label">${t('sys_init')}</div></div>`;

  function saveCurrentInput(){
    const inp  = document.getElementById('check-actual-input');
    const rows = getCheckRows();
    const cur  = rows[checkState.stepIndex];
    if(!cur) return;
    const key    = cur[0];
    const expRaw = cur[2];
    const normExp  = normalizeDisplayValue(String(expRaw));
    const expParts = normExp.split('/').map(p=>p.trim()).filter(Boolean);
    const isColor  = expParts.length > 0 && expParts.every(isColorToken);
    if(isColor) return;
    var presetType2 = detectPresetType(expRaw);
    if(presetType2 && presetType2.options) return;
    const val    = inp ? inp.value : (checkState.results[key] && checkState.results[key].actual ? checkState.results[key].actual : '');
    const exp    = getExpectedValue(key, expRaw);
    const status = val.trim()
      ? (normalizeCompareValue(String(exp)) === normalizeCompareValue(val) ? 'match' : 'mismatch')
      : ((checkState.results[key] && checkState.results[key].status) || 'pending');
    checkState.results[key] = { ...(checkState.results[key]||{}), actual: val, status };
  }

  function attemptLogin(){
    const emailInp = document.getElementById('login-email');
    const passInp  = document.getElementById('login-input');
    if(!passInp) return;
    const email = emailInp ? emailInp.value.trim() : '';
    const pass  = passInp.value;
    if(sb && !email){ auth.loginError = t('err_fill_email'); render(); return; }
    doLogin(email, pass);
  }

  function bindWelcome(){
    const submitLogin = ()=>{
      const u = (document.getElementById('op-username')||{}).value || '';
      const p = (document.getElementById('op-pin')||{}).value || '';
      doOperatorLogin(u, p);
    };
    const submitReg = ()=>{
      doOperatorRegister({
        first: (document.getElementById('reg-first')||{}).value || '',
        last:  (document.getElementById('reg-last')||{}).value || '',
        username: (document.getElementById('reg-username')||{}).value || '',
        pin: (document.getElementById('reg-pin')||{}).value || ''
      });
    };
    const pin = document.getElementById('op-pin');
    if(pin) pin.addEventListener('keydown', e=>{ if(e.key==='Enter') submitLogin(); });
    const regPin = document.getElementById('reg-pin');
    if(regPin) regPin.addEventListener('keydown', e=>{ if(e.key==='Enter') submitReg(); });
    /* Username-velden live filteren: alleen a-z 0-9 _ (geen @, punt, spatie). */
    ['op-username','reg-username'].forEach(function(id){
      const el = document.getElementById(id);
      if(el) el.addEventListener('input', function(){
        const clean = el.value.toLowerCase().replace(/[^a-z0-9_]/g,'');
        if(el.value !== clean){ const pos = el.selectionStart; el.value = clean; try{ el.setSelectionRange(pos-1,pos-1); }catch(e){} }
      });
    });
    const uname = document.getElementById('op-username');
    if(uname) setTimeout(()=>{ try{ uname.focus(); }catch(e){} }, 60);
    /* Admin-login (email+wachtwoord) op de welkomkaart: Enter = inloggen. */
    const adminPass = document.getElementById('login-input');
    if(adminPass) adminPass.addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });
    const adminEmail = document.getElementById('login-email');
    if(adminEmail) setTimeout(()=>{ try{ adminEmail.focus(); }catch(e){} }, 60);
  }

  function bindActions(){

      if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') return;
      el.addEventListener('click', ()=>{
        const action = el.dataset.action;
        const value  = el.dataset.value;

        /* ── auth ── */

        if(action==='health-toggle'){ state.showAdmin = true; loadPendingOperators().then(()=>render()); loadOmbouwHistory().then(()=>render()); loadTimings().then(()=>render()); render(); }
        if(action==='theme-toggle'){
          const cur = document.documentElement.getAttribute('data-theme') || 'dark';
          const next = cur === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          try{ localStorage.setItem('pally_theme', next); }catch(e){}
          const mt = document.getElementById('meta-theme');
          if(mt) mt.content = next === 'light' ? '#eef0f3' : '#000000';
          render();
        }
        if(action==='admin-back'){ state.showAdmin = false; render(); }
        if(action==='admin-refresh'){

        if(action==='timing-start'){ startTiming(); }
