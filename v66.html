<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pally · Ombouwen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --black: #000000;
      --surface-1: rgba(255,255,255,.03);
      --surface-2: rgba(255,255,255,.055);
      --surface-3: rgba(255,255,255,.08);
      --border: rgba(255,255,255,.07);
      --border-2: rgba(255,255,255,.12);
      --border-3: rgba(255,255,255,.18);
      --amber: #f59e0b;
      --amber-glow: rgba(245,158,11,.3);
      --blue: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --slate: #64748b;
      --text: #ffffff;
      --text-2: #94a3b8;
      --text-3: #475569;
      --mono: 'Geist Mono', monospace;
      --sans: 'Geist', system-ui, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--black);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,.007) 2px,
        rgba(255,255,255,.007) 4px
      );
    }

    .shell {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    .topbar {
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,.9);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .topbar-logo {
      width: 30px;
      height: 30px;
      border: 1px solid var(--border-2);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-2);
      flex-shrink: 0;
    }

    .topbar-name {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: .14em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .topbar-sep {
      width: 1px;
      height: 18px;
      background: var(--border-2);
    }

    .topbar-module {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-3);
      letter-spacing: .22em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .sync-indicator {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #47556940;
      color: #475569;
      transition: all .25s ease;
      white-space: nowrap;
    }

    .role-badge,
    .btn-print {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 20px;
      border: 1px solid;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all .15s ease;
      white-space: nowrap;
    }

    .role-badge.operator {
      color: var(--text-2);
      border-color: var(--border-2);
      background: var(--surface-1);
    }

    .role-badge.operator:hover,
    .btn-print:hover {
      color: var(--text);
      background: var(--surface-2);
      border-color: var(--border-3);
    }

    .role-badge.admin {
      color: var(--amber);
      border-color: rgba(245,158,11,.3);
      background: rgba(245,158,11,.08);
    }

    .role-badge.admin:hover {
      background: rgba(245,158,11,.14);
    }

    .btn-print {
      border-color: var(--border-2);
      background: var(--surface-1);
      color: var(--text-2);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(34,197,94,.2);
      background: rgba(34,197,94,.06);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(34,197,94,.35);
      animation: pulse 3s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }

    .status-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--green);
      letter-spacing: .12em;
      opacity: .8;
    }

    .body {
      display: grid;
      grid-template-columns: 260px 1fr;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: rgba(0,0,0,.6);
      display: flex;
      flex-direction: column;
      padding: 28px 0;
      min-height: calc(100vh - 56px);
      position: sticky;
      top: 56px;
      align-self: start;
      max-height: calc(100vh - 56px);
      overflow-y: auto;
    }

    .sidebar-section {
      padding: 0 18px 22px;
    }

    .sidebar-label {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 10px;
    }

    .flow-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-1);
      overflow: hidden;
    }

    .flow-card-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: stretch;
    }

    .flow-block {
      padding: 11px 13px;
    }

    .flow-block + .flow-block {
      border-left: 1px solid var(--border);
    }

    .flow-block-label {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--text-3);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .flow-block-value {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .flow-block-value.dim {
      color: var(--text-3);
      font-weight: 400;
    }

    .flow-block-value.amber {
      color: var(--amber);
    }

    .flow-arrow-col {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 9px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      background: var(--surface-1);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-3);
    }

    .section-tag {
      margin-top: 7px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-1);
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-3);
      letter-spacing: .06em;
    }

    .tag-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 6px var(--amber-glow);
      flex-shrink: 0;
    }

    .sidebar-sep {
      height: 1px;
      background: var(--border);
      margin: 0 18px 22px;
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 0 18px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 11px;
      border-radius: 8px;
      cursor: default;
      border: 1px solid transparent;
      transition: all .18s ease;
    }

    .step-item.done {
      background: rgba(34,197,94,.05);
      border-color: rgba(34,197,94,.1);
    }

    .step-item.active {
      background: rgba(245,158,11,.05);
      border-color: rgba(245,158,11,.12);
    }

    .step-item.check-active {
      background: rgba(6,182,212,.05);
      border-color: rgba(6,182,212,.15);
    }

    .step-num {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      width: 21px;
      height: 21px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid var(--border-2);
      color: var(--text-3);
      background: var(--surface-1);
    }

    .step-item.done .step-num {
      background: rgba(34,197,94,.15);
      border-color: rgba(34,197,94,.3);
      color: var(--green);
    }

    .step-item.active .step-num {
      background: rgba(245,158,11,.1);
      border-color: rgba(245,158,11,.25);
      color: var(--amber);
    }

    .step-item.check-active .step-num {
      background: rgba(6,182,212,.1);
      border-color: rgba(6,182,212,.28);
      color: #06b6d4;
      box-shadow: 0 0 8px rgba(6,182,212,.2);
    }

    .step-text {
      font-size: 12px;
      color: var(--text-3);
      font-weight: 500;
    }

    .step-item.done .step-text {
      color: rgba(34,197,94,.75);
    }

    .step-item.active .step-text {
      color: var(--text);
    }

    .step-item.check-active .step-text {
      color: rgba(6,182,212,.9);
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .breadcrumb {
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,.4);
    }

    .bc-item {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-3);
      letter-spacing: .08em;
    }

    .bc-item.active {
      color: rgba(255,255,255,.6);
    }

    .bc-sep {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-3);
      opacity: .4;
    }

    .content {
      flex: 1;
      padding: 36px 36px 56px;
      animation: fadeUp .22s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .content-header {
      margin-bottom: 28px;
    }

    .content-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.04em;
      margin-bottom: 5px;
      line-height: 1.15;
    }

    .content-sub {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.6;
      max-width: 520px;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-1);
      overflow: hidden;
      position: relative;
      backdrop-filter: blur(10px);
      transition: border-color .18s;
    }

    .panel::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255,255,255,.02) 0%, transparent 60%);
      pointer-events: none;
    }

    .panel:hover {
      border-color: var(--border-2);
    }

    .panel-header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,.015);
    }

    .panel-title {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(255,255,255,.35);
    }

    .panel-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(34,197,94,.1);
      border: 1px solid rgba(34,197,94,.2);
      color: var(--green);
      letter-spacing: .12em;
    }

    .panel-badge::before {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      flex-shrink: 0;
    }

    .panel-body {
      padding: 18px;
    }

    .field-label {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 10px;
      margin-top: 16px;
    }

    .field-label:first-child {
      margin-top: 0;
    }

    .chipRow {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      font-size: 12px;
      font-weight: 500;
      padding: 7px 13px;
      border-radius: 7px;
      border: 1px solid var(--border-2);
      background: var(--surface-1);
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all .14s cubic-bezier(.16,1,.3,1);
      position: relative;
      overflow: hidden;
    }

    .chip:hover {
      background: var(--surface-3);
      color: var(--text);
      border-color: var(--border-3);
      transform: translateY(-1px);
    }

    .chip.active {
      background: rgba(245,158,11,.09);
      border-color: rgba(245,158,11,.28);
      color: var(--amber);
      box-shadow: 0 0 0 3px rgba(245,158,11,.07);
    }

    .chipInner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .chipDot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: .6;
    }

    .table-wrap {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface-1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 11px;
    }

    thead {
      background: rgba(255,255,255,.02);
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    th {
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    tbody tr:hover {
      background: rgba(255,255,255,.02);
    }

    td.changed {
      color: var(--amber);
      font-weight: 600;
    }

    .footer-bar {
      position: sticky;
      bottom: 0;
      background: rgba(0,0,0,.9);
      border-top: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      z-index: 100;
    }

    .btn {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-2);
      background: var(--surface-1);
      color: var(--text-2);
      transition: all .15s ease;
    }

    .btn:hover {
      border-color: var(--border-3);
      color: var(--text);
      background: var(--surface-2);
    }

    .btn.primary {
      background: rgba(245,158,11,.1);
      border-color: rgba(245,158,11,.35);
      color: var(--amber);
    }

    .btn.primary:hover {
      background: rgba(245,158,11,.18);
    }

    /* =========================
       PRINT MODE (EXCEL STYLE)
       ========================= */

    @media print {
      body {
        background: white;
        color: black;
      }

      .shell,
      .sidebar,
      .topbar,
      .footer-bar,
      .breadcrumb {
        display: none !important;
      }

      .main {
        display: block;
      }

      .content {
        padding: 0;
      }

      .print-sheet {
        width: 100%;
        font-family: Arial, sans-serif;
        font-size: 10px;
        border-collapse: collapse;
      }

      .print-sheet table {
        width: 100%;
        border-collapse: collapse;
      }

      .print-sheet th,
      .print-sheet td {
        border: 1px solid #000;
        padding: 4px 6px;
        text-align: center;
      }

      .print-sheet th {
        background: #e5e5e5;
        font-weight: bold;
      }

      .print-header {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .group-header {
        background: #d0d0d0;
        font-weight: bold;
      }

      .sub-header {
        background: #f0f0f0;
      }
    }
  </style>
</head>

<body>
  <div class="shell">

    <div class="topbar">
      <div class="topbar-brand">
        <div class="topbar-logo">P</div>
        <div class="topbar-name">PALLY</div>
        <div class="topbar-sep"></div>
        <div class="topbar-module">OMBOUWEN</div>
      </div>

      <div class="topbar-right">
        <div class="sync-indicator">SYNC</div>
        <div class="role-badge operator">OPERATOR</div>
        <button class="btn-print" onclick="printCavanna()">PRINT</button>
      </div>
    </div>

    <div class="body">
      <div class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-label">FLOW</div>

          <div class="flow-card">
            <div class="flow-card-row">
              <div class="flow-block">
                <div class="flow-block-label">FROM</div>
                <div class="flow-block-value" id="fromLabel">—</div>
              </div>

              <div class="flow-arrow-col">→</div>

              <div class="flow-block">
                <div class="flow-block-label">TO</div>
                <div class="flow-block-value amber" id="toLabel">—</div>
              </div>
            </div>
          </div>

          <div class="section-tag">
            <div class="tag-dot"></div>
            Cavanna Line
          </div>
        </div>
      </div>

      <div class="main">
        <div class="breadcrumb">
          <div class="bc-item active">Cavanna</div>
        </div>

        <div class="content">

          <div class="content-header">
            <div class="content-title">Cavanna Setup</div>
            <div class="content-sub">Select format and print machine settings.</div>
          </div>

          <div class="panel-grid">

            <div class="panel">
              <div class="panel-header">
                <div class="panel-title">Line</div>
              </div>

              <div class="panel-body">
                <div class="chipRow">
                  <div class="chip active" onclick="setLine(9)">Line 9</div>
                  <div class="chip" onclick="setLine(10)">Line 10</div>
                </div>
              </div>
            </div>

            <div class="panel">
              <div class="panel-header">
                <div class="panel-title">Format</div>
              </div>

              <div class="panel-body">
                <div class="chipRow" id="formatChips"></div>
              </div>
            </div>

          </div>

          <div class="table-wrap">
            <table id="previewTable">
              <thead>
                <tr>
                  <th>Param</th>
                  <th>Value</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>

        </div>
      </div>
    </div>
  </div>
